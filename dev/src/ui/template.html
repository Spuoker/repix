<script>
/* AS AN APP. Served from a web address, the page describes itself as an
   application (manifest) and keeps itself for work without the network
   (sw.js): the browser then offers to install it, and it opens in a window
   of its own. Opened from disk there is nothing to install: a browser never
   installs a file, and the page stays the self-contained file it is. */
if(location.protocol==='https:'||location.hostname==='localhost'){
  const mm=document.createElement('link'); mm.rel='manifest'; mm.href='manifest.webmanifest';
  document.head.appendChild(mm);
  // The iPhone reads its home-screen icon from here, not from the manifest.
  const ap=document.createElement('link'); ap.rel='apple-touch-icon'; ap.href='icon-apple.png';
  document.head.appendChild(ap);
  if('serviceWorker' in navigator)
    addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
<style>
  /* THE PIXEL GRID. The interface has its own pixel, --unit. Everything visible
     is a multiple of it: borders, bevels, gaps, widths, heights. Nothing at 1px,
     nothing at 0.5, nothing rounded, nothing blurred. The only exceptions are
     slider heads and the windows with the work.

     The unit comes from the font. A Tiny5 glyph pixel is the font size divided
     by eight, so the font size must be a multiple of eight or letters smear
     between screen pixels.

     There is ONE font size in the interface: small pixel fonts turn to mush,
     and two sizes side by side read as two interfaces. Importance is shown by
     color, not by size. */
  @font-face{font-family:'Pixel';font-style:normal;font-weight:400;font-display:block;
    src:url(data:font/woff2;base64,__FONT__) format('woff2')}

  /* COLORS. Every color is derived from a few chosen ones (deriveColors) and
     set before the first paint; the values here only stand in until then. */
  :root{
    --unit:2px;
    --bg:#c0c0c0; --canvas:#008080; --panel:#c0c0c0; --field:#ffffff;
    --frameColor:#c0c0c0; --light:#ffffff; --shadow:#808080;
    --text:#000000; --quiet:#404040;
    --accent:#000080; --accentLight:#1084d0; --accentShade:#000040;
    --alarm:#a07800;
    /* SPACING IS COUNTED IN CELLS, not pixels: three cells stay three cells at
       any interface size. Both gaps derive from it — between groups one cell
       wider, inside a group one cell narrower, never less than one cell. The
       edge padding of every shelf (header, captions, strip, footer) is the
       spacing itself. */
    --density:3;
    --shelf:calc(var(--unit)*var(--density));
    --gapGroups:calc(var(--unit)*(var(--density) + 1));
    --gapInner:max(var(--unit), calc(var(--unit)*(var(--density) - 1)));
    /* A control is as tall as a button: 3 + 3 cells of padding and a line of
       ten. Whatever stands level with buttons takes this height. */
    --control:calc(var(--unit)*16);
    /* LAYERS GO IN PAIRS: an entity and right above it its hints. A header
       button's hint lies over the header but under the settings menu; a menu
       hint over the menu but under the color picker. An explanation is always
       above what it explains and never over what was opened later. */
    --layerUi:1; --layerUiHints:2;
    --layerMenu:3;       --layerMenuHints:4;
    --layerPicker:5;    --layerPickerHints:6;
  }
  *{box-sizing:border-box}
  /* HIDDEN is one mechanism for everything: the hidden attribute. It must win
     over any display the layout engine writes into an element's style. */
  [hidden]{display:none !important}
  /* The font size is DERIVED from the grid pixel, eight to one; a line is ten
     grid pixels. */
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:calc(var(--unit)*8)/calc(var(--unit)*10) 'Pixel',ui-monospace,Consolas,monospace;
    overscroll-behavior:none;-webkit-font-smoothing:none}
  /* A TOOL, NOT A PAGE: the page itself never scrolls. What does not fit is
     the business of its shelves (they roll, slide, scroll inside) — a
     scroll bar of the whole page would take width, and every shelf would
     lay itself out anew. */
  html,body{overflow:hidden}
  /* THE BACKING. The whole window is one backing in the pictures' color,
     standing still; the panels, the captions and the pictures LIE ON IT.
     What moves, moves over it; a strip the browser shows at the window's
     edge while it is stretched is the backing too. */
  html{background:var(--canvas)}
  body{display:flex;flex-direction:column;background:transparent}
  /* THE GRIP of a sliding shelf: a tab on its top edge, on a line of no
     height, so it covers the window above it a little and takes no room. */
  .grip{height:0;display:flex;justify-content:center;align-items:flex-end;
    gap:var(--gapInner);position:relative;z-index:var(--layerUi)}
  .gripTab{min-height:0;padding:calc(var(--unit)*3) calc(var(--unit)*12);touch-action:none}
  .gripTab svg{height:calc(var(--unit)*3);width:auto;display:block;
    shape-rendering:crispEdges;fill:currentColor}
  /* A TOOL, NOT A PAGE TO READ — on a touch screen. A long press there is our
     hint, not the system selecting a word of a button's label and bringing
     its menu up. Real text stays selectable: fields, links, the guide, the
     license texts, a held hint. With a mouse nothing is taken away: selecting
     and copying do not get in the way there. */
  @media (hover:none){
    body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    input,textarea,a,#guide,#licenseText{-webkit-user-select:text;user-select:text;
      -webkit-touch-callout:default}
  }

  /* Clusters stand at the EDGES of a shelf, not in its middle: when one
     cluster folds into three rows and its neighbours into two, centring leaves
     ragged top and bottom lines. */
  header{display:flex;gap:var(--gapInner);align-items:stretch;flex-wrap:wrap;
    padding:var(--shelf);background:var(--panel);
    border-bottom:var(--unit) solid var(--frameColor)}

  /* A BUTTON is a sprite: a one-grid-pixel bevel that pressing flips over.
     The button itself does not shift. Every button is as tall as a control,
     whatever it holds — a word, an icon or both; objects that are not
     buttons of the row (a bare icon, a swatch, a close cross) say so in their
     own rules. */
  button{background:var(--frameColor);color:var(--btnText);border:0;border-radius:0;
    min-height:var(--control);
    /* What a button holds stands in its MIDDLE, however it is laid out inside
       (a line of text, or an icon with a label in a row): a stretched button
       must not leave it at its left edge. */
    justify-content:center;
    padding:calc(var(--unit)*3) calc(var(--unit)*5);font:inherit;cursor:pointer;
    box-shadow:inset var(--unit) var(--unit) 0 0 var(--light),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--shadow)}
  /* Only a button that responds lights up and presses in. STILL (a button
     argument: it may explain, but does not act), HOLLOW (its own paint, no
     background) and BARE (an icon, no plate) keep their look under the mouse. */
  button:where(:not(.still,.hollow,.bare)):hover:not(:disabled){background:var(--hover)}
  button:where(:not(.still,.hollow,.bare)):active:not(:disabled){background:var(--press);
    box-shadow:inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--light),
               inset var(--unit) var(--unit) 0 0 var(--shadow)}
  /* HELD — this one is working now: the pressed bevel in the accent. */
  button:where(:not(.bare)).held{background:var(--accentShade);color:var(--heldText);
    box-shadow:inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--light),
               inset var(--unit) var(--unit) 0 0 var(--shadow)}
  button:where(:not(.bare)).held:hover:not(:disabled){background:var(--accentHover)}
  button:disabled{color:var(--quiet);opacity:.5;cursor:default}
  button.still{cursor:default}
  button:focus-visible{outline:var(--unit) solid var(--accentLight);outline-offset:calc(var(--unit)*-2)}
  /* An explanation that works even with Hints off: the cursor turns into a
     question mark over it. */
  .alwaysHint{cursor:help}
  /* A LINK BUTTON leads to a web page: its label is highlighted, so it reads
     as a link and not as an action inside the program. */
  button.link{color:var(--linkText)}
  /* A HOLLOW BUTTON WITH ITS OWN PAINT. No background, text in its own color,
     and the bevel's light and shadow are that color mixed with white and
     black, so the frame follows its own paint. */
  /* ARGUMENTS OF A DESCRIPTION. Every object is built from a description
   (buildNode), the ones made while the program runs too. An object is laid out by the standard
     unless its description names an argument; the engine carries it out,
     whatever the object holds.
       even    — the buttons of each row inside are as wide as the widest of
                 that row (evenOut), the rows stretch to the widest row, and a
                 label is never broken: two lines would make one row unequal;
       clip    — text that takes what is left and is cut with an ellipsis;
       hug     — sized by its content, never stretched;
       align   — where what it holds stands: 'start' or 'end'; without it,
                 in the middle (a list read down the left edge — the steps,
                 the theme names — stands at the start);
       fill    — takes the whole row instead of its standard width (a knob
                 alone in a menu row, the color channels);
       scrolls — the panel scrollbar: a track in the background color with a
                 line, a thumb with the button bevel;
       pinned  — 'top' or 'bottom': the row stays at that edge of a scrolling
                 menu page, reaching over the menu's padding so nothing shows
                 beyond it. */
  [data-even] button{min-width:var(--even,auto);flex:1 1 0;white-space:nowrap;
    justify-content:center}
  [data-even][data-measuring]{width:max-content}
  /* Measured bare: not stretched along a row nor across a column. */
  [data-even][data-measuring] button{flex:0 0 auto !important;min-width:0 !important;width:auto !important;
    align-self:flex-start !important}
  [data-clip]{flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  [data-hug]{flex:0 0 auto}
  [data-align="start"]{text-align:left;justify-content:flex-start}
  [data-align="end"]{text-align:right;justify-content:flex-end}
  [data-fill]{flex:1 1 0;width:auto;min-width:0}
  [data-pinned]{position:sticky;z-index:1;background:var(--panel)}
  [data-pinned="top"]{top:calc(var(--menuPad)*-1);
    margin:calc(var(--menuPad)*-1) calc(var(--menuPad)*-1) 0;
    padding:var(--menuPad) var(--menuPad) var(--gapInner)}
  [data-pinned="bottom"]{bottom:calc(var(--menuPad)*-1);
    margin:0 calc(var(--menuPad)*-1) calc(var(--menuPad)*-1);
    padding:var(--gapInner) var(--menuPad) var(--menuPad)}
  /* THE ENGINE'S OWN BAR (the bar argument of a scroll): the browser's is
     not drawn — it cannot be pulled past the end. The bar stands in the
     room the scroll keeps for it on its right, over its whole height. */
  .ownBar{scrollbar-width:none}
  .ownBar::-webkit-scrollbar{display:none}
  .scrollBar{position:absolute;right:0;width:calc(var(--unit)*5);z-index:1;
    background:var(--bg);box-shadow:inset var(--unit) 0 0 0 var(--frameColor);touch-action:none}
  .scrollBar:hover .barThumb{background:var(--hover)}
  /* A button with a drawn icon: the icon before the label, one gap apart. */
  button.withIcon{display:inline-flex;align-items:center;gap:var(--gapInner)}
  button.withIcon svg{flex:0 0 auto;width:calc(var(--unit)*7);height:calc(var(--unit)*7);
    display:block;shape-rendering:crispEdges;fill:currentColor}
  button.hollow{background:transparent;color:var(--paint);
    box-shadow:inset var(--unit) var(--unit) 0 0
                 color-mix(in srgb, var(--paint) 45%, #fff),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0
                 color-mix(in srgb, var(--paint) 55%, #000)}

  /* The name plate is also the settings button: the gear sits right in it. It
     is as tall as a button, like every object of its group. */
  #name{background:var(--accent);color:var(--plateText);
    padding:calc(var(--unit)*3) calc(var(--unit)*5);
    letter-spacing:var(--unit);user-select:none;
    display:flex;align-items:center;align-self:flex-start;gap:var(--shelf);
    box-shadow:inset var(--unit) var(--unit) 0 0 var(--accentLight),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--accentShade)}
  #name svg{width:calc(var(--unit)*7);height:calc(var(--unit)*7);display:block;
    shape-rendering:crispEdges;fill:currentColor}
  #name:active{box-shadow:inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--accentLight),
                        inset var(--unit) var(--unit) 0 0 var(--accentShade)}

  /* THE SETTINGS MENU is a small window under the plate, not full width: a
     section of groups in a column, with one gap for groups and dividers. */
  #settings,#askWin{position:fixed;z-index:var(--layerMenu);background:var(--panel);
    --menuPad:var(--gapGroups);
    display:flex;flex-direction:column;gap:var(--gapInner);
    max-height:calc(100vh - var(--unit)*8);overflow:auto;
    padding:var(--menuPad);min-width:calc(var(--unit)*110);
    box-shadow:inset 0 0 0 var(--unit) var(--frameColor),
               calc(var(--unit)*2) calc(var(--unit)*2) 0 rgba(0,0,0,.5)}
  /* PAGES OF ONE WINDOW. The menu shows one page at a time — the settings, the
     guide, a theme — in its own place, not a window over a window; the engine
     hides the groups of the other pages. The guide wants its own width: in the
     settings frame its lines would break at every word. */
  #settings[data-wide]{width:min(calc(var(--unit)*260), calc(100vw - var(--unit)*8))}
  /* The top row of a page: its title, and the cross that goes back. It stays in
     view while the page scrolls, reaching over the menu's padding so nothing
     shows above it. */
  /* Title and cross keep to the top of the row: centring a ten-cell line
     against an eleven-cell button would put one of them on half a cell. */
  #pageTop{display:flex;justify-content:space-between;align-items:flex-start;flex:0 0 auto}
  #pageTop h2{margin:0}
  /* A BARE BUTTON has no plate: a seven-cell icon, as tall as a swatch; the
     accent marks it under the mouse, or held — a lock that is closed. Locks,
     and the plus and minus of the themes, are such buttons. */
  .bare{padding:var(--unit) calc(var(--unit)*2);background:none;box-shadow:none;min-height:0;
    color:var(--text)}
  /* Under the mouse the accent that reads on the panel; held (a lit heart, a
     closed lock) the accent itself — an icon is a mark, not a line to read,
     and the accent darkened for reading looks like a dimmer one. */
  .bare:hover:not(:disabled){color:var(--accentText)}
  .bare.held{color:var(--accent)}
  .bare svg{width:calc(var(--unit)*7);height:calc(var(--unit)*7);display:block;
    shape-rendering:crispEdges;fill:currentColor}
  /* A swatch is the same button with the same bevel: click it to choose. */
  .sample{width:calc(var(--unit)*16);height:calc(var(--unit)*8);min-height:0;padding:0;border:0;
    box-shadow:inset var(--unit) var(--unit) 0 0 rgba(255,255,255,.25),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 rgba(0,0,0,.35),
               0 0 0 var(--unit) var(--frameColor)}

  /* COLOR PICKER. The system color dialog is a foreign program inside ours —
     its own rounded fields, font and cursor. This one is drawn on the grid. */
  #colorPicker{position:fixed;z-index:var(--layerPicker);background:var(--panel);
    padding:var(--shelf);display:flex;flex-direction:column;
    gap:var(--unit);
    box-shadow:inset 0 0 0 var(--unit) var(--frameColor),
               calc(var(--unit)*2) calc(var(--unit)*2) 0 rgba(0,0,0,.5)}
  /* The tone slider is an ordinary slider with a colored track, laid out in
     STEPS, cell by cell: a smooth gradient reads as a foreign detail here. */
  #colorPicker .slider{width:100%;margin:0 0 var(--unit);background:transparent}
  #colorPicker .slider::-webkit-slider-runnable-track{background:var(--track)}
  #colorPicker .slider::-moz-range-track{background:var(--track)}
  /* THE COLOR FIELD is one plane of color with no gaps inside: a small canvas
     stretched by a whole number of grid pixels, without smoothing. How many
     field pixels fit is decided by the engine. */
  #colorPicker .colorField{display:block;image-rendering:pixelated;cursor:crosshair}
  /* The top row: pipette and close button at its two ends. It is also the
     handle the window is dragged by. */
  #colorPicker .colorTop{display:flex;justify-content:space-between;
    align-items:center;gap:var(--gapInner);cursor:move;touch-action:none}
  /* The bottom row: three channels, each a third of the field width, like a
     knob in the footer. */
  #colorPicker .colorBottom{display:flex;gap:var(--gapGroups);align-items:flex-start}
  /* ICON BUTTONS are squares of 11 cells with a free cell on every side between
     the icon and the bevel, or the icon presses against it and looks crooked.
     The pipette is 7 cells, the cross 5: the padding makes up the difference. */
  .iconButton{padding:calc(var(--unit)*2);min-height:0}
  .iconButton svg{width:calc(var(--unit)*7);height:calc(var(--unit)*7);display:block;
    shape-rendering:crispEdges;fill:currentColor}
  .iconButton.cross{padding:calc(var(--unit)*3)}
  .iconButton.cross svg{width:calc(var(--unit)*5);height:calc(var(--unit)*5)}
  /* Without a pipette (a browser that cannot pick from the screen) the cross
     still keeps to the right end. */
  #colorPicker .colorTop .cross{margin-left:auto}

  #askWin p{margin:0 0 var(--gapGroups);max-width:calc(var(--unit)*110)}
  #askWin .buttonRow{display:flex;gap:var(--gapInner);flex:0 0 auto}
  #settings h2,#askWin h2{margin:0 0 var(--gapInner);font-weight:400;font-size:inherit;
    color:var(--accentText)}
  /* A GROUP HEAD: the heading on the left, the group's own bare buttons in
     the opposite corner. */
  #settings .groupHead{display:flex;justify-content:space-between;align-items:center;
    gap:var(--gapInner);margin-bottom:var(--gapInner)}
  #settings .groupHead h2{margin:0}
  #settings .groupHead span{display:flex;gap:var(--unit)}
  /* A menu group: the heading and what is under it, one below the other. */
  #settings > .group:not(#guide):not(.buttonRow){display:block;flex:0 0 auto}
  #settings > .group > :last-child{margin-bottom:0}
  #settings label{color:var(--quiet);cursor:pointer}
  /* Label, field and room for a button — three columns for all rows at once.
     The field column does not shrink, even when one row has a button. */
  #settings .colors{display:grid;align-items:center;
    grid-template-columns:1fr max-content max-content;
    gap:var(--gapInner);margin-bottom:var(--gapGroups)}
  /* Stages in a column across the window: it is a choice of one, read as a
     list, not as a panel of actions. */
  #stepList{display:flex;flex-direction:column;gap:var(--gapInner);
    margin-bottom:var(--gapGroups)}
  #stepList button{width:100%}
  /* Rows of equal buttons: themes, sizes, spacings, the bottom row. */
  #themes,#sizes,#spacings{display:flex;gap:var(--gapInner);
    margin-bottom:var(--gapGroups)}
  /* Theme arrows hug their content, the name is clipped to the rest: a long
     name must not move the arrows (the arguments hug and clip). */
  /* A knob in the menu spans the whole section, not a footer knob's width. */
  /* A ROW OF BUTTONS of equal width — the bottom row, the actions of a page. */
  #settings .buttonRow{display:flex;gap:var(--gapInner);flex:0 0 auto}
  /* Its buttons are even (the argument): the menu grows wider rather than
     break a label. */
  /* A text field, sunken like the number fields of the knobs. */
  #settings input[type=text]{width:100%;min-width:0;margin-bottom:var(--gapInner);
    background:var(--field);color:var(--accentField);font:inherit;border:0;border-radius:0;
    padding:calc(var(--unit)*2) calc(var(--unit)*3);
    box-shadow:inset var(--unit) var(--unit) 0 0 var(--shadow),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--frameColor)}
  #settings input[type=text]:focus{outline:none;color:var(--accentLightField);
    box-shadow:inset 0 0 0 var(--unit) var(--accent)}
  /* A LIST OF THEMES to pick: a box to tick, then the name, which shows the
     theme when pressed. */
  #settings .pickList{display:grid;grid-template-columns:max-content 1fr;
    gap:var(--gapInner);align-items:center}
  /* What went wrong on a page: in the alarm color, until the next try. */
  #settings .complaint{color:var(--alarmText);margin:0 0 var(--gapInner)}
  #confirmText{margin:0 0 var(--gapGroups);max-width:calc(var(--unit)*110)}
  #settings .complaint:empty{display:none}

  /* THE GUIDE is a page to read, not a panel — no buttons under it. It is a
     section of groups in a column too. The key column is shared by
     all groups: each group takes the section's columns (subgrid). */
  #guide{display:grid;grid-template-columns:auto 1fr;flex:0 0 auto;
    gap:var(--gapInner) var(--gapGroups)}
  #guide > .group, #guide > .divider{grid-column:1 / -1}
  #guide > .group{display:grid;grid-template-columns:subgrid;
    gap:var(--gapInner) var(--gapGroups)}
  #guide > .group > h2{grid-column:1 / -1;margin-bottom:0}
  #guide b{font-weight:400;color:var(--text);white-space:nowrap}
  #guide span{color:var(--quiet)}
  /* License buttons: a row of equal buttons. */
  #guide .licenseButtons{grid-column:1 / -1;display:flex;gap:var(--gapInner)}
  /* A license is read in the guide's place: its groups step aside. */
  #guide.reading > .group, #guide.reading > .divider{display:none}
  #guide:not(.reading) > #licenseText{display:none}
  #licenseText{grid-column:1 / -1;margin:0;white-space:pre-wrap;
    font:inherit;color:var(--quiet)}

  /* THE STATUS is a single that can SUBDIVIDE. It stands on the right, as tall
     as a button, and gives way in two steps: first it breaks at its own
     separators into two rows in place — the top part at the button's top, the
     bottom part at its bottom; when even the parts do not fit, it moves down
     whole to the left edge. It is never cut off: a half-told status is useless. */
  #status{color:var(--quiet);margin-left:auto;align-self:flex-start;
    flex:0 1 auto;min-width:0;height:var(--control);
    display:flex;flex-direction:row;align-items:center;justify-content:flex-end}
  #status span{white-space:nowrap}
  /* Broken: lines squeezed to the glyph — two ten-pixel lines do not fit into
     sixteen. */
  #status.inColumn{flex-direction:column;align-items:flex-end;
    justify-content:space-between;line-height:calc(var(--unit)*8);
    height:auto;min-height:var(--control)}
  #status.atBottom{flex:1 0 100%;margin-left:0;height:auto;
    flex-direction:row;justify-content:flex-start;align-items:center}

  /* The windows are no boxes of their own: the pictures lie on the backing.
     The seam between them is a line of its own (#seamLine) side by side,
     the captions' bar's own edges stacked — in the frame colour; --seamAlpha is how much of it is there (the
     fades argument). */
  #stages{flex:1;display:flex;gap:var(--unit);min-height:0;
    --seam:color-mix(in srgb, var(--frameColor) calc(var(--seamAlpha,1)*100%), var(--canvas))}
  #stages{position:relative}
  #seamLine{position:absolute;left:0;top:0;background:var(--seam);pointer-events:none;z-index:1}
  #stages[style*="column"] > #seamLine{display:none}
  /* Between the windows stacked, the seam is the captions' bar's own edges:
     it moves with the bar. */
  #stages > #captionsTop{box-shadow:0 calc(var(--unit)*-1) 0 0 var(--seam), 0 var(--unit) 0 0 var(--seam)}
  .stage{flex:1;display:flex;flex-direction:column;min-width:0}
  /* A window caption: what the window shows, over it. */
  .caption_{padding:var(--unit) var(--shelf);color:var(--quiet);background:var(--panel);
    border-bottom:var(--unit) solid var(--frameColor);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* AN AREAS SHELF — an engine rule, not a special node. Areas share the shelf
     equally, content is centred in its area, and between two visible areas the
     engine puts a divider — which one is the shelf's argument: a drawing, a
     plain line, or a control. An empty shelf takes no room.
     The window captions live on such shelves: above the windows standing side
     by side, between them when stacked; the divider is the button that flips
     the arrangement. */
  .areas{display:flex;align-items:center;background:var(--panel);
    gap:var(--shelf);padding:0 var(--shelf)}
  .areas:not(:has(> :not([data-divider]))){display:none}
  .areas > :not([data-divider]){flex:1 1 0;min-width:0;text-align:center;
    border:0;background:none;padding-inline:0}
  #captionsShelf > #captionsTop{border-bottom:var(--unit) solid var(--frameColor)}
  /* A drawn divider spans the whole shelf height: it divides the SHELF. */
  .areaDivider{flex:0 0 auto;display:block;color:var(--frameColor);align-self:stretch}
  .areaDivider svg{height:100%;width:auto;display:block;
    shape-rendering:crispEdges;fill:currentColor}
  .areaDivider:empty{width:var(--unit);background:currentColor}
  /* The window with the work: its canvas lies over it and is moved by the view. */
  .canvas{flex:1;position:relative;overflow:hidden;touch-action:none}
  .canvas > canvas{position:absolute;left:0;top:0;image-rendering:pixelated}

  /* The stage block stands right of the knobs and moves down by itself only
     when it does not fit beside them. */
  footer{background:var(--panel);border-top:var(--unit) solid var(--frameColor);
    padding:var(--shelf);display:flex;flex-wrap:wrap;gap:var(--gapGroups);align-items:stretch}
  /* THE KNOB FIELD. Knobs are gathered in CLUSTERS that stand in a row and are
     never torn apart: when tight, a cluster folds inward into more rows of its
     own; only if even folded they do not fit do clusters wrap. The field spans
     the footer's full height so dividers reach the bottom. */
  #knobsField{flex:1 1 auto;min-width:0;display:flex;gap:var(--gapGroups);
    flex-wrap:wrap;align-items:stretch;align-self:stretch}
  /* The header field works the same way, sized by content: the status line
     stands right of it and must get some room. */
  #headerField{flex:0 1 auto;min-width:0;display:flex;gap:var(--gapInner);
    flex-wrap:wrap;align-items:stretch;align-self:stretch}

  /* A CLUSTER is ONE ROW and wraps whole: half a group moved down stops
     reading as a group. It stretches to the section height — that is its field,
     the dividers stand along it — but the objects inside run FROM THE TOP,
     packed: spreading the height between rows leaves an empty band. */
  .group{display:flex;gap:var(--gapInner) var(--gapGroups);flex-wrap:nowrap;
    align-items:flex-start;align-content:flex-start;flex:0 1 auto;min-width:0}
  /* Header clusters are tighter inside than between clusters, so one can see
     where one ends even when a row wrapped. A cluster does not break, so a
     button must shrink: its text is shortened with an ellipsis rather than cut
     by the window edge. */
  header .group{gap:var(--gapInner)}
  header .group button{min-width:0;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis}
  /* A DIVIDER has no margins of its own — the shelf sets the gap — and spans
     the whole height of the clusters it separates. Lying — between groups
     standing in a column: across the whole section. */
  .divider{flex:0 0 auto;width:var(--unit);align-self:stretch;background:var(--frameColor)}
  .divider.lying{width:auto;height:var(--unit)}
  footer .divider{min-height:calc(var(--unit)*17)}
  /* A knob has its own width: a slider is an instrument, not a rubber band.
     It shrinks only when the cluster could not fit otherwise. */
  :where(.knob){display:flex;flex-direction:column;gap:var(--unit);
    flex:0 1 calc(var(--unit)*58);width:calc(var(--unit)*58);min-width:calc(var(--unit)*34)}
  /* THE STAGE BLOCK stands in the row of clusters, sized by content and at the
     top: where we are is always visible, without hovering. It is a ROW of
     three — arrow, where we are, arrow — like any flipper. */
  #stageBlock{flex:0 0 auto;align-self:flex-start}
  #stageBlock .knob.move{flex-direction:row;align-items:center;
    gap:var(--gapInner);width:auto}
  /* Undo and redo are ONE piece: two halves side by side, no gap, as wide
     as the stage buttons under them. */
  #stageBlock .knob.history{flex-direction:row;gap:0;width:auto;
    margin-bottom:var(--gapInner)}
  #stageBlock #whereWeAre{color:var(--quiet)}
  /* SQUEEZING (the squeezes argument, in one row): what gives way sinks under the rest,
     the object scrolls to it, its bar always drawn. */
  .sinking{overflow-y:hidden;align-self:flex-start}
  .barThumb{position:absolute;left:0;right:0;background:var(--frameColor);
    box-shadow:inset var(--unit) var(--unit) 0 0 var(--light),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--shadow)}
  .sinking .knob.move{flex-wrap:wrap}
  .sinking .knob button{flex:1 0 auto}
  .sinking.measuring .knob button{flex:0 0 auto}
  .sinking .knob .sunk{flex:1 0 100%}
  /* When the knobs take more than one row, the flipper stands as a COLUMN
     (the stacks argument). */
  #stageBlock.inColumn .knob.move{flex-direction:column;align-items:stretch}

  /* A STRIP — ONE ROW, NOT A CARPET (the palette is one). What does not fit
     goes past the edge and is scrolled — with the wheel, or dragged with a
     finger. Shutters at the edges say there is more. The tiles stand side by
     side with no gap: a mouse led along the strip goes from paint to paint,
     never over the panel between them, so nothing blinks off and on. */
  .strip{display:flex;flex-wrap:nowrap;gap:0;
    --ribbonPad:var(--shelf);
    padding:var(--ribbonPad);position:relative;
    background:var(--panel);border-top:var(--unit) solid var(--frameColor);
    overflow-x:auto;overflow-y:hidden;touch-action:pan-x;
    scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  /* A ROLLED FIELD (the rolls argument): the knobs in one row that scrolls
     sideways, shutters at the edges, like the strip. */
  .rolled{flex-wrap:nowrap;overflow:hidden;touch-action:none;
    position:relative;scrollbar-width:none;--ribbonPad:0px}
  .rolled::-webkit-scrollbar{display:none}
  .rolled > .group{flex:0 0 auto;flex-wrap:nowrap}
  /* The shutters take no room, not even the gap beside them. */
  .rolled > .more_.left_{margin-right:calc(var(--gapGroups)*-1)}
  .rolled > .more_.right_{margin-left:calc(var(--gapGroups)*-1)}
  /* Lodged in the footer the strip is a resident of the shelf like the stage block:
     no frame or padding of its own, as tall as its neighbour. */
  .strip.lodged{flex:1 1 0;min-width:0;--ribbonPad:0px;border-top:0;
    align-self:center;background:none}
  /* A SHUTTER sticks to the edge and takes NO room, or it would lengthen the
     strip itself and never go out. Its plate, in the panel color, covers the
     last paint and the shelf padding over the strip's full height, so no
     sliver shows; the dots are drawn (five cells) rather than typed (twelve),
     so the shutter hides a single paint. */
  :is(.strip,.rolled) .more_{position:sticky;width:0;flex:0 0 0;align-self:stretch;
    pointer-events:none;visibility:hidden;z-index:1}
  :is(.strip,.rolled) .more_.shown{visibility:visible}
  :is(.strip,.rolled) .more_.right_{right:0;--own:var(--shutterRight, calc(var(--unit)*9 + var(--gapInner)))}
  :is(.strip,.rolled) .more_.left_{left:0;--own:var(--shutterLeft, calc(var(--unit)*9 + var(--gapInner)))}
  :is(.strip,.rolled) .more_::before{content:'';position:absolute;
    width:calc(var(--own) + var(--ribbonPad));
    top:calc(var(--ribbonPad)*-1);
    height:calc(100% + var(--ribbonPad)*2);
    background:var(--panel)}
  :is(.strip,.rolled) .more_.right_::before{right:calc(var(--ribbonPad)*-1)}
  :is(.strip,.rolled) .more_.left_::before{left:calc(var(--ribbonPad)*-1)}
  /* The three dots are drawn inside the element itself, in the middle of the
     plate, not as shadows falling outside it past the strip edge. */
  :is(.strip,.rolled) .more_::after{content:'';position:absolute;top:50%;
    width:calc(var(--unit)*5);height:var(--unit);
    background:linear-gradient(to right,
      var(--quiet) 0 var(--unit), transparent var(--unit) calc(var(--unit)*2),
      var(--quiet) calc(var(--unit)*2) calc(var(--unit)*3),
      transparent calc(var(--unit)*3) calc(var(--unit)*4),
      var(--quiet) calc(var(--unit)*4) calc(var(--unit)*5))}
  :is(.strip,.rolled) .more_.right_::after{right:calc((var(--own) - var(--unit)*5)/2)}
  :is(.strip,.rolled) .more_.left_::after{left:calc((var(--own) - var(--unit)*5)/2)}
  /* A TILE has the button bevel. */
  .strip .tile{flex:0 0 auto;width:calc(var(--unit)*9);height:calc(var(--unit)*9);
    display:inline-block;cursor:default;
    box-shadow:inset var(--unit) var(--unit) 0 0 rgba(255,255,255,.3),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 rgba(0,0,0,.45)}
  /* The paint in hand keeps its bevel, and the bevel itself — its light and
     its shadow — is painted in the paint's OPPOSITE color: it shows on any
     paint, and stays inside the tile, touching no neighbour. */
  .strip .tile.held{cursor:pointer;
    box-shadow:inset var(--unit) var(--unit) 0 0 var(--oppLight),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--oppShade)}
  /* A paint pointed at from the picture shows its OWN frame: the same light
     top-left edge and dark bottom-right edge, at full strength. */
  .strip .tile.pointed{
    box-shadow:inset var(--unit) var(--unit) 0 0 rgba(255,255,255,.9),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 rgba(0,0,0,.9)}
  /* The plus is a strip tile of the same size and bevel; its cross is drawn in
     cells, five long. */
  .strip .tile.plus{cursor:pointer;
    background:linear-gradient(var(--text),var(--text)) center/calc(var(--unit)*5) var(--unit) no-repeat,
               linear-gradient(var(--text),var(--text)) center/var(--unit) calc(var(--unit)*5) no-repeat,
               var(--frameColor)}
  /* A DOT in the corner marks a tile apart: a copied color is not a paint of
     the work yet, until it is painted with. */
  .strip .tile.dot{position:relative}
  .strip .tile.dot::after{content:'';position:absolute;
    right:var(--unit);top:var(--unit);width:var(--unit);height:var(--unit);
    background:var(--text);box-shadow:0 0 0 var(--unit) var(--panel)}

  /* A KNOB LABEL wraps instead of being cut with an ellipsis: half a word is a
     riddle, not a label. It is pressed to the BOTTOM, to its slider: a short
     name would otherwise hang detached from its knob. Two lines are the floor;
     in the footer the engine levels all labels to the tallest (alignCaptions). */
  .knob b{font-weight:400;color:var(--quiet);min-height:calc(var(--unit)*20);
    display:flex;align-items:flex-end;overflow:hidden}
  .knob span{color:var(--accentText)}

  /* The slider is the ONE deliberate exception from the grid. It is drawn in
     cells like everything else, but it MOVES between them: a position is a
     thousand steps, and snapping the head to cells would leave fifty — a step
     of 4.5997 could not be set, and here it decides everything. The grid is
     about how things are drawn, not about which values exist.

     The slider is drawn by hand: the built-in one has a rounded track and a
     round head. Track — a sunken groove, head — a bar with the button bevel. */
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;
    width:100%;min-width:0;height:calc(var(--unit)*9);margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:calc(var(--unit)*4);background:var(--field);
    box-shadow:inset var(--unit) var(--unit) 0 0 var(--shadow),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--frameColor)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;border:0;border-radius:0;
    width:calc(var(--unit)*5);height:calc(var(--unit)*9);margin-top:calc(var(--unit)*-2.5);
    background:var(--accent);
    box-shadow:inset var(--unit) var(--unit) 0 0 var(--accentLight),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--accentShade)}
  input[type=range]::-moz-range-track{height:calc(var(--unit)*4);background:var(--field);
    box-shadow:inset var(--unit) var(--unit) 0 0 var(--shadow),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--frameColor)}
  input[type=range]::-moz-range-thumb{border:0;border-radius:0;
    width:calc(var(--unit)*5);height:calc(var(--unit)*9);background:var(--accent);
    box-shadow:inset var(--unit) var(--unit) 0 0 var(--accentLight),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--accentShade)}
  input[type=range]:focus{outline:none}
  input[type=range]:focus-visible::-webkit-slider-thumb{background:var(--accentLight)}
  input[type=range]:focus-visible::-moz-range-thumb{background:var(--accentLight)}

  /* THE NUMBER FIELD of a knob, sunken, with the "i" at its right. The
     explanation comes from hovering the "i", not the whole knob: the mouse
     crosses the panel all the time. */
  .knob .field{position:relative}
  .knob .num{width:100%;min-width:0;background:var(--field);color:var(--accentField);
    font:inherit;border:0;border-radius:0;
    padding:calc(var(--unit)*2) calc(var(--unit)*11) calc(var(--unit)*2) calc(var(--unit)*3);
    -moz-appearance:textfield;
    box-shadow:inset var(--unit) var(--unit) 0 0 var(--shadow),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--frameColor)}
  .knob .num:focus{outline:none;color:var(--accentLightField);
    box-shadow:inset 0 0 0 var(--unit) var(--accent)}
  /* Not taken (unfinished, or refused by the rule): the field's own words
     are no accent — the number standing is still the last taken one. */
  .knob .num.wrong{color:var(--text);text-decoration:underline dotted}
  .knob .num::-webkit-inner-spin-button,.knob .num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  /* The "i" is DRAWN, not typed: a font letter does not fit a small square on
     the grid. A 9x9 box: a one-cell frame and seven cells inside — empty, dot,
     empty, three cells of stroke, empty. It stands two cells below the top of
     the field: the field is fourteen cells tall, so exact centring would put
     it on half a cell. */
  .knob .info{position:absolute;right:calc(var(--unit)*2);top:calc(var(--unit)*2);font-size:0;
    width:calc(var(--unit)*9);height:calc(var(--unit)*9);
    box-shadow:inset 0 0 0 var(--unit) var(--quiet);user-select:none}
  .knob .info::before,.knob .info::after{content:'';position:absolute;
    left:calc(var(--unit)*4);width:var(--unit);background:var(--quiet)}
  .knob .info::before{top:calc(var(--unit)*2);height:var(--unit)}
  .knob .info::after{top:calc(var(--unit)*4);height:calc(var(--unit)*3)}
  .knob .info:hover{box-shadow:inset 0 0 0 var(--unit) var(--accent)}
  .knob .info:hover::before,.knob .info:hover::after{background:var(--accent)}

  /* The drop cover: the body color, nearly opaque, over everything. */
  #toss{position:fixed;inset:0;display:none;place-items:center;
    background:color-mix(in srgb, var(--bg) 94%, transparent);
    color:var(--tossText);z-index:var(--layerUi);
    letter-spacing:var(--unit);border:calc(var(--unit)*2) dashed var(--accent)}
  #toss.showing{display:grid}

  /* THE HINT. Not display:none when hidden — it lies in place, transparent, so
     its size is known before it is positioned. It appears in steps: smooth
     transparency smears edges, steps do not. It gets its layer when shown,
     from whoever called it. A floating entity is never taller than the window:
     at the ceiling it scrolls inside. */
  #hint{position:fixed;max-width:calc(var(--unit)*170);z-index:var(--layerUiHints);
    line-height:calc(var(--unit)*12);
    max-height:calc(100vh - var(--unit)*8);overflow:auto;
    background:var(--panel);padding:calc(var(--unit)*3);
    box-shadow:inset 0 0 0 var(--unit) var(--frameColor), calc(var(--unit)*2) calc(var(--unit)*2) 0 rgba(0,0,0,.5);
    pointer-events:none;visibility:hidden;opacity:0}
  /* A SHOWN hint is a thing to go to: it catches the pointer and its words
     can be selected and copied. */
  #hint.showing{visibility:visible;opacity:1;transform:none;pointer-events:auto;
    -webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  /* A HELD hint (called by holding) stays and is read like text: it catches
     the pointer, and its words can be selected and copied. */
  #hint.held{pointer-events:auto;-webkit-user-select:text;user-select:text;
    -webkit-touch-callout:default}
  #hint b{color:var(--accentText);display:block;margin-bottom:var(--unit);font-weight:400}
  /* A hint that did not fit is scrolled, so it must catch the mouse; a normal
     hint lets the mouse through, or it would steal clicks meant for what is
     under it. It is the engine's scroll (its overflow says so), with a bar. */
  #hint.scrolls{pointer-events:auto;overscroll-behavior:contain}

  /* Scrollbars are bars like the rest, not thin pills. */
  *::-webkit-scrollbar{width:calc(var(--unit)*6);height:calc(var(--unit)*6)}
  *::-webkit-scrollbar-track{background:var(--field)}
  *::-webkit-scrollbar-thumb{background:var(--frameColor);
    box-shadow:inset var(--unit) var(--unit) 0 0 var(--light),
               inset calc(var(--unit)*-1) calc(var(--unit)*-1) 0 0 var(--shadow)}
  *::-webkit-scrollbar-corner{background:var(--field)}

  /* Where to split the windows, how to pack clusters and where the stage block
     goes is decided by the engine. The panel is never cut by the window's
     width: how much of it is in view is the viewer's choice (its grip). */
</style>

<script type="module">
/* The pipeline (src/ui/pipeline.js) comes first, as it is: how the page drives
   the core. The test bench imports the same file, and the core's thread
   takes it from between the two marks below. */
/* PIPELINE BEGINS */
__PIPELINE__
/* PIPELINE ENDS */
const $=s=>document.querySelector(s);
/* ===================== SHELVES =====================
   What one sees are shelves, one above another. The engine is told which
   follows which and what stands on each; it builds them itself. Nothing is
   left in the HTML markup.

   A shelf knows its name, its tag and its content. The content is the same
   kind of list: a node is described by WHAT it is, not how to lay it out.  */
/* THE WINDOWS' ARRANGEMENT as it will be after pressing: two windows one
   above the other — turned a quarter, two side by side. Drawn in cells,
   like the gear. */
const ICON_TO_STACK =
  '<svg viewBox="0 0 7 7" aria-hidden="true">'+
  '<path d="M0 0h7v1H0zM0 1h1v1H0zM6 1h1v1H6zM0 2h7v1H0zM0 4h7v1H0zM0 5h1v1H0zM6 5h1v1H6zM0 6h7v1H0z"/></svg>';
/* Lock closed — the color is derived from the body; open — your own color
   stands. The shackle tells them apart: seated in the body when closed,
   raised when open. */
const LOCK_CLOSED =
  '<svg viewBox="0 0 7 7" aria-hidden="true">'+
  '<path d="M2 0h3v1H2zM1 1h1v2H1zM5 1h1v2H5zM0 3h7v4H0z"/></svg>';
const LOCK_OPEN =
  '<svg viewBox="0 0 7 7" aria-hidden="true">'+
  '<path d="M2 0h3v1H2zM1 1h1v2H1zM5 1h1v1H5zM0 3h7v4H0z"/></svg>';

/* The close cross is drawn in cells too, for the same reason. */
const ICON_CROSS =
  '<svg viewBox="0 0 5 5" aria-hidden="true">'+
  '<path d="M0 0h1v1H0zM1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4z'+
          'M4 0h1v1H4zM3 1h1v1H3zM1 3h1v1H1zM0 4h1v1H0z"/></svg>';

/* A floppy disk — saving to disk: the cut corner, the shutter slot, the label. */
const ICON_DISK =
  '<svg viewBox="0 0 7 7" aria-hidden="true">'+
  '<path d="M0 0h6v1H0zM0 1h4v1H0zM5 1h2v1H5zM0 2h7v2H0zM0 4h1v2H0zM6 4h1v2H6zM0 6h7v1H0z"/></svg>';
/* A box to tick: empty, and with a mark in the middle. */
const ICON_BOX_OFF =
  '<svg viewBox="0 0 7 7" aria-hidden="true"><path d="M0 0h7v1H0zM0 6h7v1H0zM0 1h1v5H0zM6 1h1v5H6z"/></svg>';
const ICON_BOX_ON =
  '<svg viewBox="0 0 7 7" aria-hidden="true"><path d="M0 0h7v1H0zM0 6h7v1H0zM0 1h1v5H0zM6 1h1v5H6zM2 2h3v3H2z"/></svg>';
/* A heart, seven cells wide: a favorite theme. */
const ICON_HEART =
  '<svg viewBox="0 0 7 7" aria-hidden="true">'+
  '<path d="M1 0h2v1H1zM4 0h2v1H4zM0 1h7v2H0zM1 3h5v1H1zM2 4h3v1H2zM3 5h1v1H3z"/></svg>';
/* The plus, seven cells wide like the locks. */
const ICON_PLUS =
  '<svg viewBox="0 0 7 7" aria-hidden="true"><path d="M3 0h1v7H3zM0 3h7v1H0z"/></svg>';

/* The pipette is drawn in cells — no system icon next to Tiny5. */

/* A THEME'S NAME is at most this long: the theme button holds sixty cells of
   text, and the widest letters take six — ten of any letters always show
   whole, with no ellipsis. */
const THEME_NAME_MAX=10;

const SHELVES=[
  {id_:'header_', tag:'header', onto:[
    // The gear is drawn, not typed: the pixel font has none, and a system icon
    // next to Tiny5 looks like a guest from another world.
    // The engine later moves this node into the "file" group — see INCOMING.
    {tag:'button', id_:'name', inner:'Repix'+ICON_GEAR},
    {tag:'input',  id_:'file', props:{type:'file', accept:'image/*', hidden:true}},
    // The field of groups, like the knob field below: a section is this field
    // plus singles, and it is the field that folds, squeezes and scrolls.
    {buttons:'header_', field:'headerField'},
    {tag:'div',  id_:'status', text:'starting…'},
  ]},

  // The captions of the windows: ONE bar, with the flip button between them —
  // over both windows standing side by side, between them stacked. It moves
  // whole, as one object (see stitchCaptions).
  {tag:'div', id_:'captionsShelf', onto:[{areas:'captionsTop', divider:()=>FLIP}]},
  // The seam FADES (its colour, not the windows) when the windows turn.
  {id_:'stages', tag:'div', fades:'--seamAlpha', onto:[
    // The windows are the BACKGROUND of the pictures: they stand where the
    // layout puts them, drawn as a background, not moved as objects.
    // Their captions go after the window three times the standard pace.
    {win:{caption:'ww0', canvas:'xx0', label:'source', background:true, captionArgs:{follow:{window:{ms:20}}}}},
    // THE SEAM of the windows side by side: a line that starts where it
    // touches the captions' bar and fills down to the end of the windows —
    // it goes with the bar, never ahead of it.
    {tag:'i', id_:'seamLine', follow:false,
     goal:{rel:'#captionsTop', side:'downward', gap:0, align:{x:'#flipSplit'}, size:{w:1, h:'fill'}}},
    {win:{caption:'ww2', canvas:'xx2', label:'pixels', background:true, captionArgs:{follow:{window:{ms:20}}}}},
  ]},

  /* The palette: a strip that lodges in the footer when the footer has no
     knobs (stage 4). */
  {id_:'palette', props:{hidden:true},
   strip:{leave:()=>lightPaint(-1)},
   lodges:{into:'#knobs', field:'#knobsField', items:'.knob'}},

  // The footer SLIDES: its grip hides it under the screen or brings it back.
  {id_:'knobs', tag:'footer', slides:{items:'.knob',
     hint:['Panel', 'Each press takes the next: all the knobs in view, then one row that scrolls sideways a whole knob at a time, then the panel hidden, then all in view again. Pull the tab down or up to step that way.']},
   // ...and ROLLS: its knobs fold into rows, or stand in one row that scrolls.
   rolls:{field:'#knobsField', items:'.knob'},
   onto:[
    {tag:'div', id_:'knobsField'},
    /* The stage block is an OBJECT that stands among the knobs: undo and redo
       as one piece on top — a phone has no Ctrl+Z — and under them one row
       of the stage buttons — back, where we are, forward. */
    /* In ONE ROW (the shelf rolls) the block is as tall as the row and as
       wide as undo and redo; what does not fit is SQUEEZED OUT below, in
       this order, and the block scrolls down to it. */
    {tag:'div', id_:'stageBlock', even:true, squeezes:['#whereWeAre'], ribbon:true, onto:[
      {tag:'div', cls:'knob history', onto:[
        {buttons:'history'},
      ]},
      {tag:'div', cls:'knob move', onto:[
        {buttons:'footer'},
      ]},
    ]},
  ]},
];
/* FLOATING ENTITIES — the settings window, the hint, the drop invitation.
   They are not tied to the section grid: they stand where they were called
   (settings under the plate, a hint next to what is hovered) and have no say
   in a section's wrapping, dividers or shortening.

   Inside, a floating entity has its own SECTIONS with groups, living by its
   rules — but the engine still carries them out: its buttons are the same
   objects with the same labels, dimming and shortening.

   They are built last, above everything else, and overlap by layers that go
   in pairs: an entity and its hints (see --layer* in the style). */
const FLOATING=[
  {tag:'div', id_:'toss', text:'drop an image here'},
  // The menu, and above it the color picker, because the menu calls it.
  /* THE MENU is a window of PAGES: every group names the page it belongs to,
     and the engine shows one page at a time (see PAGES). */

  {tag:'div', id_:'askWin', props:{hidden:true}, onto:[
    {tag:'h2', id_:'askTitle'},
    {tag:'p', id_:'askText'},
    {tag:'div', cls:'buttonRow', even:true, onto:[
      {tag:'button', id_:'askYes', props:{type:'button'}},
      {tag:'button', id_:'askNo', text:'Cancel', props:{type:'button'}},

  {tag:'div', id_:'settings', props:{hidden:true}, onto:[

    {tag:'div', cls:'group', page:'main', onto:[
      {tag:'h2', text:'Undo steps'},

    {tag:'div', cls:'group', page:'main', onto:[

    {tag:'div', cls:'group', page:'confirm', onto:[
      {tag:'p', id_:'confirmText'},
      {tag:'div', cls:'buttonRow', even:true, onto:[

  // goal of one notch of the wheel (by 'line' or by 'item', how many); `end`

  // than `slack` lines behind.

  // INERTIA. A scroll has mass: let go, it keeps the speed it had. A finger
  // flicks it: it glides on, `decel` of its speed lost a millisecond, and
  // lands on the stop nearest where the glide would end. At an EDGE the
  // spring is softer (damping `edge`): what comes to it with way on it

  // fit becomes a scroll (see adoptScrolls). Controls and pictures are not in it.

    const was=OWN.map(kk=>el.style[kk]);

    const hh=el.getBoundingClientRect().height;

/* One step: the first item that stands and the gap after it. */
function itemStep(el, items, along){
  const it=[...el.querySelectorAll(items)].find(x=>x.offsetParent);
  if(!it) return gridPixel()*STANDARD.line;
  const r=it.getBoundingClientRect(), cs=getComputedStyle(it.parentElement);
  const gap = along==='x' ? (parseFloat(cs.columnGap)||0) : (parseFloat(cs.rowGap)||0);
  return (along==='x' ? r.width : r.height)+gap;
}
/* `cover` — the shutter is a plate of its own width laid over the edge,
   not cut to the border between items: for items wider than a paint. */
function makeShutters(el, items, cover, way){
  const shutter=side=>Object.assign(document.createElement('i'),{className:'more_ '+side, _drawn:true});
  /* THE SHUTTER STANDS AT A TILE BORDER. The strip edge falls in the middle
     of a tile, so the width is computed each time: from the strip edge to the
     nearest border between tiles, wide enough for the dots. Computed from the
     ACTUAL edges of the tiles, not from scroll arithmetic: padding and gaps
     would each be another chance to be off by a pixel. The plate is wider by
     the strip padding and shifted outward by as much, so the padding is
     subtracted from the distance to the edge. */
  const trim=()=>{
    if(cover){
      /* Over wide items: the left plate is the dots' own width, and the row
         stops so that a whole item begins right past it (see `lead` in
         makeScroll); the right
         plate covers what is left of a cut item, up to the last whole one. */
      const own=gridPixel()*11;
      el.style.setProperty('--shutterLeft', own+'px');
      // It begins at the right edge of the last item that stays whole with
      // room for the dots, and covers everything past it: never half a knob.
      const r=el.getBoundingClientRect();
      const ends=[...el.querySelectorAll(items)].filter(x=>x.offsetParent)
        .map(x=>x.getBoundingClientRect().right).filter(e=>r.right-e>=own-0.5);
      const wid = ends.length ? r.right-Math.max(...ends) : own;
      el.style.setProperty('--shutterRight', Math.ceil(wid)+'px');
      return;
    }
    const pt=[...el.querySelectorAll(items)].filter(x=>x.offsetParent); if(!pt.length) return;
    const r=el.getBoundingClientRect(), mn_=gridPixel()*7;   // what the dots need
    const edges=pt.map(x=>x.getBoundingClientRect());
    const field=parseFloat(getComputedStyle(el).paddingLeft)||0;
    let widR=0;
    for(let i=edges.length-1;i>=0;i--){
      const upTo=r.right-edges[i].right-field;
      if(upTo>=mn_-0.5){ widR=upTo; break; }      // the nearest edge where the dots fit
    }
    el.style.setProperty('--shutterRight', Math.ceil(widR||mn_)+'px');
    let widL=0;
    for(const g of edges){
      const upTo=g.left-r.left-field;
      if(upTo>=mn_-0.5){ widL=upTo; break; }
    }
    el.style.setProperty('--shutterLeft', Math.ceil(widL||mn_)+'px');
  };
  /* Shutters go out by themselves: the left one at the start, the right one
     at the end. The threshold on both sides is half a tile, so tiny offsets
     at the ends do not keep them lit. */
  const edges=()=>{
    trim();
    const right_=el.querySelector('.more_.right_'), left_=el.querySelector('.more_.left_');
    const pt=el.querySelector(items);
    // An overlaid shutter shows as soon as anything is hidden under it.
    const halfTile = cover ? gridPixel() : pt ? pt.getBoundingClientRect().width/2 : 8;
    if(right_) right_.classList.toggle('shown', el.scrollWidth-(el.scrollLeft+el.clientWidth) > halfTile);
    if(left_) left_.classList.toggle('shown', el.scrollLeft > halfTile);
  };
  // The row scrolls by the engine's scroll: a whole item a notch, and a
  // whole item where the hand lets go; over wide items (cover) the first one
  // in view begins right past the left dots.
  makeScroll(el, {along:'x', items, notch:{by:'item', count:1}, end:{by:'item'},
                  lead: cover ? ()=>gridPixel()*11 : 0, ...(way||{})});
  el.addEventListener('scroll',edges,{passive:true});
  // Its width changes when it moves, on a stage change and when the window
  // shrinks, and the shutters are computed from it.
  if(window.ResizeObserver) new ResizeObserver(edges).observe(el);
  el._edges=edges;
  return {shutter, edges};
}
/* A tile's paint, and its opposite for the frame of the one in hand: the
   opposite side of the color circle (turquoise — coral), as saturated, and
   on the other side in lightness, so it shows by both; its light edge and
   its shadow edge. A grey has no hue: its opposite is only in lightness. */
function paintTile(dd, color){
  dd.style.background=color;
  const c=(color.match(/\d+(\.\d+)?/g)||[]).slice(0,3).map(Number); if(c.length<3) return;
  const [r,g,b]=c.map(v=>v/255), hi=Math.max(r,g,b), lo=Math.min(r,g,b), L=(hi+lo)/2;
  let H=0, S=0;
  if(hi>lo){
    const d=hi-lo; S=d/(1-Math.abs(2*L-1));
    H = hi===r ? ((g-b)/d+6)%6 : hi===g ? (b-r)/d+2 : (r-g)/d+4;
  }
  const oH=(H*60+180)%360, oS=S<0.12 ? 0 : Math.max(S, 0.6), oL=L<0.5 ? 0.75 : 0.28;
  const hsl=l=>`hsl(${oH.toFixed(1)} ${(oS*100).toFixed(1)}% ${(Math.max(0,Math.min(1,l))*100).toFixed(1)}%)`;
  dd.style.setProperty('--oppLight', hsl(oL+0.12));
  dd.style.setProperty('--oppShade', hsl(oL-0.14));
}
function makeStrip(el, ss){
  el.classList.add('strip');
  const byKey=new Map();
  const {shutter, edges}=makeShutters(el, '.tile');
  el.strip={
    fill(list){
      const keep=el.scrollLeft;
      el.textContent=''; byKey.clear();
      el.appendChild(shutter('left_'));
      for(const t of list){
        const dd=document.createElement('i'); dd.className='tile';
        for(const ff of ['held','dot','plus']) if(t[ff]) dd.classList.add(ff);
        if(t.color) paintTile(dd, t.color);
        if(t.key!==undefined) byKey.set(String(t.key), dd);
        dd._tile=t;
        if(t.click) dd.onclick=e=>t.click(e);
        // The strip is not rebuilt by a click: the second click of a double
        // click must hit the same tile, not a fresh copy of it.
        if(t.dblclick) dd.ondblclick=e=>{ e.stopPropagation(); t.dblclick(dd); };
        el.appendChild(dd);
      }
      el.appendChild(shutter('right_'));
      el.scrollLeft=keep;
      edges();
    },
    tile:key=>byKey.get(String(key))||null,
    mark(flag,key){
      for(const dd of el.querySelectorAll('.tile.'+flag)) dd.classList.remove(flag);
      const dd=key==null ? null : byKey.get(String(key));
      if(dd) dd.classList.add(flag);
      return dd||null;
    },
    // A tile shown goes to the middle of the strip, whether it was in view
    // or not — by the engine's scroll, from its place in the layout.
    show(key){
      const dd=byKey.get(String(key)); if(!dd) return;
      glideTo(el, 'x', dd.offsetLeft+dd.offsetWidth/2-el.clientWidth/2);
    },
    edges};
  // One listener for all tiles: there can be hundreds of them.
  // HOVERING (a mouse): the tile's hint, and what it lights while under it.
  // A finger does not hover — touching is not hovering.
  el.addEventListener('pointerover',e=>{
    if(e.pointerType==='touch' || hintHeld) return;
    const dd=e.target.closest('.tile'); if(!dd||!dd._tile) return;
    const t=dd._tile;
    if(t.hint){ const [title,text]=t.hint(); showHint(dd,title,text||''); }
    if(t.over) t.over();
  });
  el.addEventListener('pointerout',e=>{
    if(e.pointerType==='touch' || hintHeld) return;
    hideHint();
    const to=e.relatedTarget;
    if(ss.leave && !(to && to.closest && to.closest('.tile') && el.contains(to))) ss.leave();
  });
  /* HOLDING a tile — a finger or the mouse button — is its own question, as
     on buttons: the hint comes and stays until the next press, and what the
     tile lights (a paint's cells on the picture) stays lit with it. The tile
     is not taken by a hold. A finger that slides scrolls the strip instead. */
  let holdTimer=null, holdFrom=null;
  const letGo=()=>{ clearTimeout(holdTimer); holdTimer=null; };
  el.addEventListener('pointerdown',e=>{
    const dd=e.target.closest('.tile'); if(!dd||!dd._tile) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    const t=dd._tile; letGo(); holdFrom=[e.clientX,e.clientY];
    holdTimer=setTimeout(()=>{
      holdTimer=null;
      if(ss.leave) ss.leave();
      if(t.over) t.over();
      if(t.hint){ const [title,text]=t.hint(); placeHint(dd,title,text||'',true); }
      holdHint(ss.leave);
      eatClick=true;                 // held to be explained, not to be taken
    }, PRESS);
  });
  el.addEventListener('pointermove',e=>{
    if(holdTimer && holdFrom && Math.hypot(e.clientX-holdFrom[0], e.clientY-holdFrom[1])>gridPixel()*4) letGo();
  });
  for(const ev of ['pointerup','pointercancel']) el.addEventListener(ev, letGo);
  return el;
}
const stripEdges=()=>{ for(const el of document.querySelectorAll('.strip, .rolled')) if(el._edges) el._edges(); };
/* LODGES — an argument: {into, field, items}. Two half-empty bands are one
   too many: when the `field` of the shelf `into` shows none of its `items`,
   this shelf moves to the start of `into`, and the empty field (elastic, it
   would still take half the band) is removed; when items show up again, it
   goes back home. */
function lodgeAll(){
  for(const el of document.querySelectorAll('[data-lodges]')){
    const lo=el._lodges, into=$(lo.into), field=$(lo.field);
    if(!into||!field) continue;
    if(!el._home) el._home={parent:el.parentElement, next:el.nextSibling};
    /* First the field is put back: while hidden, its items are invisible to
       this check, and the shelf would stay lodged forever. */
    field.hidden=false;
    const any=[...field.querySelectorAll(lo.items)].some(x=>x.offsetParent);
    const go=!el.hidden && !any;
    el.classList.toggle('lodged', go);
    field.hidden=go;
    if(go){ if(el.parentElement!==into) into.insertBefore(el, into.firstChild); }
    else if(el.parentElement!==el._home.parent) el._home.parent.insertBefore(el, el._home.next);
  }
}
/* FINE KNOBS BEHIND A LID. On view stay the grid and the tolerance; overlap,
   spatial width, surround weight and agreement hide behind "Fine": the
   automatic settings set them alike on any work. Their values still work. */
let fineVisible=false;
let currentGroup=null, prevCluster=null;
for(const record of KNOBS){
  const [name,mn_,mx_,beg,precP,prec,move,stageKnobs,explanation,cluster]=record;
  // A new cluster — a new column. No dividers here: as in the header, the
  // engine places them itself, looking at what is visible now.
  if(cluster!==prevCluster){ currentGroup=null; prevCluster=cluster; }
  val[name]=beg;
  const shares = move==='step share';
  const oo=buildNode({knob:{
    caption:CAPTIONS[name]||name, min:mn_, max:mx_, value:beg,
    limits:()=>limits(move,mn_,mx_),
    curve: move==='multiple' ? 'ratio' : 'even', step:precP, digits:prec,
    fold: shares ? v=>toCell(v,currentStep()) : null,
    // The title shows the knob's CAPTION, not its key: the key is internal.
    hint: explanation ? ()=>[CAPTIONS[name]||name, explanation] : null,
    change:v=>{
      remember('knob:'+name);
      val[name]=v;
      // Computing parameters touched BY HAND are no longer replaced when an
      // image opens. By hand only: the grid knobs are not computing parameters.
      if(!CLUSTERS[cluster].grid) touched=true;
      if(name===STEP_KNOB) refreshStepShares();
      STAGES[stageKnobs-1].count_();
    }}});
  // What the program gives the knob is the value too.
  widget[name]={
    give:v=>{ oo.knob.give(v); val[name]=oo.knob.value(); },
    place:()=>{ oo.knob.place(); val[name]=oo.knob.value(); }};
  // Visibility is managed by the CLUSTER, not by a single knob: hiding both
  // would leave the knobs hidden when the cluster is shown again.
  if(!currentGroup){
    currentGroup=document.createElement('div');
    currentGroup.className='group';
    currentGroup.dataset.stage=stageKnobs;
    currentGroup.dataset.cluster=cluster;
    if(CLUSTERS[cluster].fine) currentGroup.dataset.fine='1';
    currentGroup.hidden=stageKnobs!==1;
    $('#knobsField').appendChild(currentGroup);
  }
  currentGroup.appendChild(oo);
}
// The step moved — the knobs that live inside one cell got new limits.
function refreshStepShares(){
  for(const [name,,,,,,move] of KNOBS) if(move==='step share' && widget[name]) widget[name].place();
}
/* THE KNOBS OF STAGE 1 as the pipeline takes them. The jitter is measured by
   stage 1 or set by hand; before the first computation it is zero and only
   the tolerance floor works. */
const stage1Knobs=()=>({jitter:val['jitter'], colorTolerance:val['color tolerance'],
  noiseMultiple:val['tolerance x noise'], cap:val['tolerance cap'], overlap:val['overlap'],
  agreement:val['agreement'], placeWidth:val['spatial width'], surroundWeight:val['surround weight']});
/* AGREEMENT is a share of the tolerance, derived by the core from the grid
   step with the advice: few own pixels on a small cell, so neighbours are let
   in generously; a large cell is its own master. */
let agreementShare=AGREEMENT_SHARE_START;
/* ===================== core =====================
   The computing is done by Zig compiled to WebAssembly. Browsers have run
   WASM since 2017, nothing to install.
   THE CORE HAS ITS OWN THREAD (src/ui/worker.js). The page has one thread for
   the screen and the clicks; while the core computed on it, the window stood
   still. Now the page sends jobs and draws what comes back, and the window
   stays alive whatever is being computed. */
let core=null;
async function bootCore(){
  say_('coreMsg');
  // The core is embedded in the page at build time: the file stays
  // self-contained and opens with a double click. fetch would not work — the
  // browser forbids reading a neighbouring file when the page is not served.
  // For the same reason the thread is made from the page's own text: the
  // pipeline between its marks and the thread's script.
  const bin=atob(CORE_B64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const size_=bytes.byteLength;
  const me=document.querySelector('script[type=module]').textContent;
  const from=me.indexOf('/* PIPELINE '+'BEGINS */'), to=me.indexOf('/* PIPELINE '+'ENDS */');
  const text=me.slice(from,to).replace(/^export\s+/gm,'')+'\n'+$('#coreThread').textContent;
  const th=new Worker(URL.createObjectURL(new Blob([text],{type:'text/javascript'})));
  await new Promise((ok,fail)=>{
    th.onmessage=e=>{ if(e.data.ready) ok(); else if(e.data.failed) fail(e.data.failed); };
    th.onerror=e=>fail(e.message);
    th.postMessage({boot:bytes.buffer},[bytes.buffer]);
  });
  th.onmessage=heard;
  core=th;
  say_('ready',size_);
}
/* JOBS GO BY LANES: the grid, stage 1, stage 2, stage 3. A new job stops the
   one still running in its lane and in every lane after it — they would be
   computed from what is being replaced. A stopped job answers null, and so
   does one that finished just as it was replaced. */
const LANES=['grid','s1','s2','s3'];
const running={grid:0, s1:0, s2:0, s3:0};
const asked=new Map();   // id -> {lane, resolve, onPart}
let lastJob=0;
function stopFrom(lane){
  const drop=[];
  for(const ll of LANES.slice(LANES.indexOf(lane)))
    if(running[ll]){ drop.push(running[ll]); running[ll]=0; }
  if(drop.length) core.postMessage({drop});
}
/* Sends a job; the promise gives its answer. onPart gets what can be shown
   while it runs. */
function coreJob(lane, kind, data, give=[], onPart=null){
  if(lane) stopFrom(lane);
  const id=++lastJob;
  if(lane) running[lane]=id;
  return new Promise(resolve=>{
    asked.set(id,{lane, onPart, resolve});
    core.postMessage({id, kind, data}, give);
  });
}
function heard(e){
  const m=e.data, aa=asked.get(m.id);
  if(m.rows || m.preview){
    try{ if(aa && aa.onPart && running[aa.lane]===m.id) aa.onPart(m); }
    // drawn, not wanted or failed to draw: the next of this job may come
    finally{ core.postMessage({drawn:m.id}); }
    return;
  }
  asked.delete(m.id);
  if(!aa) return;
  if(m.error){ console.error(m.error); say_('coreError', String(m.error).split('\n')[0]); }
  let value=m.dropped ? null : m.value;
  if(aa.lane){
    if(running[aa.lane]===m.id) running[aa.lane]=0;
    else value=null;                   // replaced meanwhile
  }
  aa.resolve(value);
}
/** Gives the decoded image to the core: a copy of the page's bitmap, handed
    over whole — the thread reads its pixels itself. It stays there for as
    long as the work is open. */
function putIntoCore(bitmap,w,h){
  stopFrom('grid');
  return coreJob(null,'image',{bitmap,w,h},[bitmap]);
}
let lastMeasurements=null, adviceGiven=false, adviceAsked=false;
/** The core's advice goes into the knobs, not applied silently: the user must
    see what is used and be able to change it. It looks at the MEASUREMENTS of
    this picture — first of all the noise where paints meet — so it is possible
    only AFTER the first computation. */
async function applyAdvice(){
  const meas=lastMeasurements;
  if(!meas) return false;
  const byHand=touched;
  const ss=await coreJob(null,'advice',{step:val[STEP_KNOB], meas});
  // Late advice is dropped: another image was opened meanwhile (other
  // measurements), or a knob was set by hand while it was on its way.
  if(!ss || lastMeasurements!==meas || (touched && !byHand)) return false;
  agreementShare=ss.agreementShare;
  // if the advice already stands, touch neither the knobs nor the undo stack
  if(Math.abs(ss.colorTolerance-val['color tolerance'])<0.05 &&
     Math.abs(ss.cap-val['tolerance cap'])<0.05 &&
     Math.abs(ss.noiseMultiple-val['tolerance x noise'])<0.01 &&
     Math.abs(ss.overlap-val['overlap'])<0.01 &&
     Math.abs(ss.agreement-val['agreement'])<0.05 &&
     (ss.jitter===null || Math.abs(ss.jitter-val['jitter'])<0.05)) return false;
  remember('advice');
  if(ss.jitter!==null) widget['jitter'].give(ss.jitter);
  widget['color tolerance'].give(ss.colorTolerance);
  widget['tolerance x noise'].give(ss.noiseMultiple);
  widget['tolerance cap'].give(ss.cap);
  widget['overlap'].give(ss.overlap);
  widget['agreement'].give(ss.agreement);
  return true;
}
