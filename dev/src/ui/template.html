      kk.node.disabled=dimmed(kk);
}
function refreshButtons(){
  for(const kk of BUTTONS){
    const el=kk.node; if(!el) continue;
    el.hidden = kk.shown ? !kk.shown() : false;
    el.disabled = dimmed(kk);
    writeLabel(kk, shownLabel(kk));
    el.classList.toggle('held', pressedNow(kk));
  }
  refreshLive();
  // An empty cluster takes no room and asks for no divider.
  for(const place of Object.values(BUTTON_PLACES))
    for(const gg of place.querySelectorAll('.group'))
      gg.hidden = ![...gg.children].some(el=>!el.hidden);
  relayout();
}
/* LAYOUT ON CHANGE, NOT ON A CLOCK. Laying out is expensive: to lay out a
   section the engine resets its groups' styles and measures them again, on
   every squeezing level.

   So the layout has a PRINT — everything it depends on: grid pixel, section
   widths, which objects are visible and their FULL labels, which knob groups
   are open and how many knobs they hold. Same print — nothing to lay out.

   The print takes the full label, not the current one: shortening is a
   result of the layout, and counting it as a cause would loop. */
let layoutPrint=null;
function viewPrint(){
  // The widths of the SHELVES, not of the fields inside them: a field's width
  // depends on how its neighbours laid themselves out (the stage block as a
  // row or a column), and counting that as a cause would make the layout
  // chase its own tail.
  const ww=$('header'), unit=$('#knobs');
  const btn=BUTTONS.filter(kk=>kk.node && !kk.node.hidden)
                 .map(kk=>kk.id_+':'+labelsRow(kk)[0]).join('|');
  const ru_=[...document.querySelectorAll('#knobsField .group')]
    .filter(gg=>!gg.hidden)
    .map(gg=>gg.dataset.cluster+':'+gg.childElementCount).join('|');
  return [getComputedStyle(document.documentElement).getPropertyValue('--unit'),
          ww?ww.clientWidth:0, unit?unit.clientWidth:0, btn, ru_].join(';');
}
/* The only door to the layout. Forcibly — when something the print does not
   see has changed, e.g. the font loaded and all widths moved. */
function relayout(forcibly){
  const unit=viewPrint();
  if(!forcibly && unit===layoutPrint){ squeezeSingles(); return; }
  layoutPrint=unit;
  evenOut();
  arrangeDividers();
  arrangeClusters();
  alignCaptions();
}

/* EVEN — an argument of an object's description: the buttons of each ROW
   inside it are as wide as the widest of that row, and the rows stretch to
   the widest row. So the stage buttons in a row are all alike, and in a
   column the pair of arrows stands by its own icons while the stage buttons
   under it stretch to it — a button is never widened by one in another row.
   The engine measures them as they are, without stretching. */
function evenOut(){
  for(const box of document.querySelectorAll('[data-even]')){
    if(!box.offsetParent) continue;       // not shown: measured when it is
    box.dataset.measuring='';
    const rows=new Map();
    for(const bb of box.querySelectorAll('button')){
      if(!bb.offsetParent) continue;
      const r=bb.getBoundingClientRect(), top=Math.round(r.top);
      if(!rows.has(top)) rows.set(top, []);
      rows.get(top).push([bb, r.width]);
    }
    delete box.dataset.measuring;
    for(const row of rows.values()){
      const ww=Math.ceil(Math.max(...row.map(x=>x[1])));
      for(const [bb] of row) bb.style.setProperty('--even', ww+'px');
    }
  }
}
/* ONE RULE FOR ALL SECTIONS. Between two neighbouring visible groups of a
   section stands a divider. Which one depends on how the groups stand: in a
   row — upright, in a column — lying. Header, footer, menu and guide are
   divided by the same code. */
function divideGroups(where){
  for(const mm of [...where.querySelectorAll(':scope > .divider')]) mm.remove();
  const cs=getComputedStyle(where);
  const lying=!(cs.display.includes('flex') && cs.flexDirection.startsWith('row'));
  const groups=[...where.children].filter(gg=>gg.classList.contains('group')
    && !gg.hidden && getComputedStyle(gg).display!=='none');
  for(let i=1;i<groups.length;i++)
    where.insertBefore(Object.assign(document.createElement('i'),
      {className:lying?'divider lying':'divider'}), groups[i]);
}
/* Every place of buttons that has a field is a section of clusters, laid out
   within the shelf it stands on. */
function arrangeDividers(){
  for(const place of Object.values(BUTTON_PLACES)){
    if(place.hidden) continue;
    divideGroups(place);
    packClusters(place, place.parentNode);
  }
}
/* ===================== WHAT IS MADE OF WHAT =====================
   PRIMITIVE — what an object is built from and does not live alone: a label,
     a slider, a number field, an icon.
   OBJECT — primitives together, the smallest thing the engine moves whole:
     a button, a knob, the stage block. An object is never torn.
   GROUP — objects together, with a shared meaning. A group feels tight
     before its section does and copes by itself.
   SECTION — a place with groups: the header, the knob field. The order of
     groups is fixed, and every joint is marked with a divider.
   SINGLE — a section object outside any group: it has its own rules of
     standing and giving way, and no dividers.

   When room runs out, things give way in this order:
     1. objects wrap INSIDE their group, downwards;
     2. a smaller group lines up under a larger one — all get the same number
        of rows and span the section top to bottom, or the edges are ragged;
     3. labels are shortened — only where a shortening is written, and only
        to the written form.
   Singles are not in this order: they squeeze their own way. */
/* A single's record, by arguments; the engine carries them out.
     counted — the engine counts it when it checks if a row of clusters fits:
               a single that stands on a row of its own or stretches to any
               width must not make the clusters fold;
     seams   — it is text sewn from parts at these seams, and gives way at
               them: gives 'rows' — breaks into rows, then moves down whole;
               'tail' — drops the parts from the end;
     stacks  — it stands as a column as soon as the field beside it takes
               more than one row of its items. */
const SINGLES=[
  // Status: stands last in the header and subdivides at its own seams; when
  // there is no room, it takes a row of its own.
  {id_:'status', seams:[' — ','  ·  '], gives:'rows'},
  // Stage block: stands last in the footer and takes room like a cluster; it
  // stands as a column when the knobs already make the footer that tall.
  {id_:'stageBlock', counted:true, stacks:{beside:'#knobsField', rowOf:'.knob'}},
  // The paint strip in the footer: elastic, shrinks to any width and scrolls.
  {id_:'palette'},
  // Window captions: each is a single of its window. It gives way by dropping
  // the tail after the dash: the measure matters less than what is shown.
  {id_:'ww0', seams:[' — '], gives:'tail'},
  {id_:'ww2', seams:[' — '], gives:'tail'},
];
/* A SUBDIVIDED SINGLE. The status line is not solid text but parts sewn
   with separators: "ready (core 57228 bytes) — open or drop an image". It may
   break only at those seams, so spaces inside parts are non-breaking.
   First step: out of width — parts go to separate rows, the status stays in
   place. Second: the status went below the groups — it takes a whole row at
   the left edge. */
/* Parts are what the line may break into, nothing else: wrapping inside a
   part is forbidden, so each lies in its own nowrap node. The seam stays at
   the end of the part it followed. Gaps at a seam are non-breaking, or "·"
   sticks to the text. */
function statusParts(full, seams){
  let pieces=[full];
  for(const seam of seams){
    const fresh=[];
    for(const kk of pieces){
      const ch_=kk.split(seam);
      ch_.forEach((x,i)=>fresh.push(i<ch_.length-1 ? x+seam.replace(/ /g,'\u00A0') : x));
    }
    pieces=fresh;
  }
  return pieces.filter(x=>x!=='');
}
function squeezeStatus(el, oo){
  // Fresh text from the computation or our own earlier layout? Told apart
  // by the snapshot: drawing sets the whole line, we set it in parts.
  const ownIt=(el.dataset.snapshot!==undefined && el.textContent===el.dataset.snapshot);
  const full=ownIt ? (el.dataset.fulltext||'') : el.textContent;
  if(full!==el.dataset.fulltext || !el.firstElementChild){
    el.dataset.fulltext=full;
    el.textContent='';
    for(const ch_ of statusParts(full, oo.seams)){
      const s=document.createElement('span'); s.textContent=ch_; el.appendChild(s);
    }
    el.dataset.snapshot=el.textContent;
  }
  el.classList.remove('atBottom','inColumn');
  /* The thresholds are computed from the REST of the row, not from whether
     the status already wrapped: while its parts lie in one line, its narrowest
     width is its whole length, and the layout would carry it down before it
     could break. */
  const ch_=[...el.children].map(x=>x.getBoundingClientRect().width);
  if(!ch_.length) return;
  const entire=ch_.reduce((a,b)=>a+b,0), most=Math.max(...ch_);
  const unit=el.parentElement, st_=getComputedStyle(unit);
  const place=unit.clientWidth-(parseFloat(st_.paddingLeft)||0)-(parseFloat(st_.paddingRight)||0);
  const gapSize=parseFloat(st_.columnGap)||0;
  let occupied=0, neighbors=0;
  for(const dd of unit.children){
    if(dd===el || !dd.offsetParent) continue;
    occupied+=dd.getBoundingClientRect().width; neighbors++;
  }
  const remainder=place-occupied-gapSize*neighbors;
  if(entire>remainder){
    if(most<=remainder) el.classList.add('inColumn');
    else { el.classList.add('atBottom'); return; }
    // By the fact: the column is as tall as a button, and three parts may
    // not fit into it. Cut off it must never be — then it goes down whole.
    if(el.scrollHeight>el.clientHeight+1){
      el.classList.remove('inColumn'); el.classList.add('atBottom'); return;
    }
  }
  /* And a final check by the fact: once the layout has already put the status
     below the groups, it takes the whole row at the left edge. */
  const gg=el.parentElement.querySelector('.group');
  if(gg && el.getBoundingClientRect().top > gg.getBoundingClientRect().top+1){
    el.classList.remove('inColumn');
    el.classList.add('atBottom');
  }
}
/* A window caption reads "pixels — 111×111 cells": what is shown, then the
   measure. In a narrow window the measure is dropped whole rather than cut
   with an ellipsis. The full text is kept on the node itself: drawing sets it
   anew every frame, and our own cut-down text must be told apart from it. */
function dropTail(el, oo){
  if(el.textContent!==el.dataset.squeezed) el.dataset.fulltext=el.textContent;
  let text=el.dataset.fulltext||el.textContent;
  el.textContent=text;
  while(el.scrollWidth>el.clientWidth+1){
    const at=Math.max(...oo.seams.map(ss=>text.lastIndexOf(ss)));
    if(at<=0) break;
    text=text.slice(0,at); el.textContent=text;
  }
  el.dataset.squeezed=el.textContent;
}
/* STACKS — a single as a column as soon as the field beside it takes more
   than one row: the shelf is that tall anyway, and the width goes to the
   field. One row is as tall as the field's tallest item. */
function stackWhenTall(el, oo){
  const was=el.classList.contains('inColumn');
  stack(el, oo);
  // A row and a column have other rows of buttons: an even object levels
  // them anew.
  if(el.classList.contains('inColumn')!==was) evenOut();
}
function stack(el, oo){
  // Judged with the single as a row, as the field was packed.
  el.classList.remove('inColumn');
  const field=$(oo.stacks.beside); if(!field || field.hidden) return;
  const items=[...field.querySelectorAll(oo.stacks.rowOf)].filter(x=>x.offsetParent);
  if(!items.length) return;
  const oneRow=Math.max(...items.map(x=>x.getBoundingClientRect().height));
  if(field.getBoundingClientRect().height > oneRow+gridPixel()) el.classList.add('inColumn');
}
const GIVING={rows:squeezeStatus, tail:dropTail};
function squeezeSingles(){
  for(const oo of SINGLES){
    const how = oo.stacks ? stackWhenTall : oo.seams ? GIVING[oo.gives] : null;
    if(!how) continue;
    const el=$('#'+oo.id_); if(el && el.offsetParent) how(el, oo);
  }
}
/* SHORTENING BY RULE, NOT BY CUTTING. An object has a SERIES: the full label
   and its shortenings in order, from mildest to harshest. No series — the
   label is untouchable. A shortening that did not change the label does not
   count as a level. */
function labelsRow(kk){
  const fulltext=(typeof kk.label==='function')?kk.label():kk.label;
  const row_=(typeof kk.shorter==='function')?kk.shorter():(kk.shorter||[]);
  const everything=[fulltext,...row_];
  return everything.filter((tt,i)=>i===0||tt!==everything[i-1]);
}
function squeezeDepth(where){
  let gg=0;
  for(const kk of BUTTONS){
    const el=kk.node;
    if(el && where.contains(el) && el.offsetParent) gg=Math.max(gg, labelsRow(kk).length-1);
  }
  return gg;
}
function squeezeLabels(where, level){
  where.dataset.squeeze=level;
  for(const kk of BUTTONS)
    if(kk.node && where.contains(kk.node)) writeLabel(kk, shownLabel(kk));
}

/* EACH CLUSTER LAYS ITSELF OUT, NOT NECESSARILY IN ONE ROW. As soon as ONE
   cluster takes two rows, the shelf is twice as tall anyway, and a second row
   is free for the rest. So a cluster is not "row or stack" but "as many rows
   as needed"; a stack is just the extreme case.

   Dividers stay between clusters, dividing neighbours in the row. */
/* Where the clusters lie and where tightness is measured are not always the
   same: the knob field is measured over the whole footer. */
/* The narrowest width that holds the objects (their widths, in order) in at
   most n rows, a gap between neighbours in a row. */
function narrowestSplit(ws, n, gap){
  const m=ws.length; if(!m) return 0;
  const span=(a,b)=>{ let ss=gap*(b-a-1); for(let i=a;i<b;i++) ss+=ws[i]; return ss; };
  let prev=Array(m+1).fill(Infinity); prev[0]=0;
  let best=Infinity;
  for(let r=1; r<=n; r++){
    const cur=Array(m+1).fill(Infinity); cur[0]=0;
    for(let i=1;i<=m;i++) for(let j=0;j<i;j++) cur[i]=Math.min(cur[i], Math.max(prev[j], span(j,i)));
    best=Math.min(best, cur[m]); prev=cur;
  }
  return best;
}
function packClusters(where, shelf){
  const clusters=[...where.querySelectorAll('.group')].filter(gg=>!gg.hidden);
  if(!clusters.length) return;
  const st_=getComputedStyle(shelf);
  // The INNER width is available: the shelf padding is not given to clusters.
  const place=shelf.clientWidth-(parseFloat(st_.paddingLeft)||0)-(parseFloat(st_.paddingRight)||0);
  const gapSize=parseFloat(st_.columnGap)||0;
  const linesCount=new Map(clusters.map(gg=>[gg,1]));
  /* A cluster's one-row width is the basis for its width in N rows. Not a
     grid: a column would take the widest button's width and leave holes.
     Instead the cluster's width is capped and it wraps by itself, buttons
     packed with the same gap as in one row. */
  const toLine=new Map();
  const most=new Map();
  const gapIn=new Map();   // the gap INSIDE a group counts towards the width too
  const widths=new Map();   // object widths, largest first: columns are computed from them
  const inOrder=new Map();  // the same widths in the order the objects stand
  // Measured more than once: a shortened label is another width, and counting
  // by the old one would fold groups where everything already fits.
  const measure=()=>{
    /* Measured UNSQUEEZED: a group wider than the field would be shrunk by
       the row it stands in, its knobs and labels with it, and a fold planned
       from shrunk widths comes out taller than planned. For the measuring it
       stands at its own full width. */
    for(const gg of clusters){ gg.style.flex='0 0 auto'; gg.style.width='max-content'; }
    for(const gg of clusters){
      gg.style.flexWrap=''; gg.style.maxWidth='';
      for(const el of gg.children) el.style.flexGrow='';
      // Measured BEFORE stretching: the whole cluster in one row and its widest
      // button. A cluster cannot be narrower than its widest button.
      toLine.set(gg, gg.getBoundingClientRect().width);
      gapIn.set(gg, parseFloat(getComputedStyle(gg).columnGap)||0);
      const ww=[...gg.children].filter(el=>!el.hidden)
        .map(el=>el.getBoundingClientRect().width).sort((a,b)=>b-a);
      widths.set(gg, ww);
      inOrder.set(gg, [...gg.children].filter(el=>!el.hidden).map(el=>el.getBoundingClientRect().width));
      most.set(gg, ww[0]||0);
    }
    for(const gg of clusters){ gg.style.flex=''; gg.style.width=''; }
  };
  measure();
  const place_=()=>{
    for(const [gg,nn] of linesCount){
      if(nn<=1){
        gg.style.flexWrap=''; gg.style.maxWidth='';
        for(const el of gg.children) el.style.flexGrow='';
      } else {
        gg.style.flexWrap='wrap';
        /* THE CEILING IS THE NARROWEST SPLIT into n rows, the objects kept
           in their order: a long one stands alone, short ones share a row —
           "Repix" above, "Open" and "Save" together under it, not "Repix"
           with "Open" and "Save" alone. Rows fill from the left within it and
           come out exactly that split. */
        const ceiling=narrowestSplit(inOrder.get(gg)||[], nn, gapIn.get(gg));
        gg.style.maxWidth=Math.ceil(Math.max(most.get(gg), ceiling))+'px';
        /* Buttons in a folded cluster stretch to its full width, or the rows end
           raggedly. Not knobs: a slider is an instrument, its width is fixed. */
        for(const el of gg.children) if(el.tagName==='BUTTON') el.style.flexGrow='1';
      }
    }
  };
  /* WIDTH BY FACT, NOT BY CALCULATION. The calculated width is a ceiling
     for deciding how many columns fit: the k widest objects side by side. But
     the widest ones need not share a row — "Show source" and "Edit lines"
     stand on top, the wider "Find grid again" below. So once laid out, every
     row is measured at its objects' OWN widths, unstretched, and the group
     becomes as wide as its widest real row: that row stands exactly by its
     labels, the others stretch to it. */
  const shrink=()=>{
    for(const [gg,nn] of linesCount){
      if(nn<=1) continue;
      const kids=[...gg.children].filter(el=>!el.hidden);
      for(const el of kids) el.style.flexGrow='';
      const rows=new Map();
      for(const el of kids){
        const b=el.getBoundingClientRect(), top=Math.round(b.top);
        rows.set(top, (rows.get(top)||0) + b.width + (rows.has(top) ? gapIn.get(gg) : 0));
      }
      const widest=Math.max(...rows.values());
      if(widest>0) gg.style.maxWidth=Math.ceil(widest)+'px';
      for(const el of kids) if(el.tagName==='BUTTON') el.style.flexGrow='1';
    }
  };
  if(place<=0) return;               // the shelf is not laid out yet — nothing to measure
  /* The measure is THE FACT OF WRAPPING, not a sum of widths: we look at
     whether everyone stands at one height — what lies in the field and the
     field's neighbours on the shelf, except singles that are not counted. */
  const uncounted=new Set(SINGLES.filter(oo=>!oo.counted).map(oo=>oo.id_));
  const children_=()=>{
    const sp=[...where.children].filter(el=>el.offsetParent!==null);
    if(shelf!==where) for(const el of shelf.children){
      if(el===where || !el.offsetParent || uncounted.has(el.id)) continue;
      sp.push(el);
    }
    return sp;
  };
  /* WRAPPING IS WHEN CLUSTERS ARE NOT IN ONE ROW. Two clusters share a row
     if their vertical spans overlap: heights differ, top edges too, but an
     overlap is always there. */
  const wrap=()=>{
    const rr=children_().map(el=>el.getBoundingClientRect());
    if(rr.length<2) return false;
    const topEdge=Math.max(...rr.map(x=>x.top)), bottomEdge=Math.min(...rr.map(x=>x.bottom));
    return topEdge >= bottomEdge;          // no shared band — someone moved down
  };
  /* A SHARED CEILING THAT GROWS AS NEEDED. First all in one row; does not fit —
     all in two; then all in three, and so on. Growing it for all at once gives
     every cluster the same number of rows and the lowest possible shelf. */
  place_();
  /* ORDER OF CONCESSIONS. First groups fold into rows — all into the same
     number. Only when folding is exhausted do labels get shortened. A
     shortened label makes a group narrower, so after each shortening the row
     count starts again from one. */
  const mx_=Math.max(...clusters.map(gg=>gg.childElementCount));
  const depth=squeezeDepth(where);
  /* ONE BAND, UNLESS IT COSTS ROWS. Every fold is tried and the shelf height
     of each is measured. Groups folding on themselves come first (the order
     of concessions): the lowest fold that keeps everyone in one band wins —
     as long as it is less than ONE ROW taller than the lowest fold of all.
     A row is the step a shelf grows by; less than that is the same shelf. On a phone the only one-band fold is every cluster in a column
     beside the stage block — rows taller than one row of knobs with the
     block under it, so there the lowest wins. Labels are shortened only when
     no fold at the current level gives one band. */
  // The singles of this shelf stand whole while folds are tried: a status
  // left broken in rows by the last layout would make this one's heights
  // depend on it. They give way again after (squeezeSingles).
  for(const oo of SINGLES){ const el=$('#'+oo.id_); if(el && shelf.contains(el)) el.classList.remove('inColumn','atBottom'); }
  let best=null, fitted=false;
  for(let ss=0; ss<=depth; ss++){
    // Level zero is a level too: labels must be RESTORED, or a button squeezed
    // once would stay "Grid" on a wide screen.
    squeezeLabels(where, ss);
    measure();
    // One row: the tallest object of the field.
    const row=Math.max(0, ...clusters.flatMap(gg=>[...gg.children].filter(el=>!el.hidden)
      .map(el=>el.getBoundingClientRect().height)));
    let lowest=null, lowestOne=null;
    for(let nn=1; nn<=mx_; nn++){
      for(const gg of clusters) linesCount.set(gg, Math.min(nn, gg.childElementCount));
      place_();
      const one=!wrap(), hh=shelf.scrollHeight, tt={ss, nn, hh, one};
      if(!lowest || hh<lowest.hh-0.5) lowest=tt;
      if(one && (!lowestOne || hh<lowestOne.hh-0.5)) lowestOne=tt;
    }
    if(lowestOne) fitted=true;
    const here = lowestOne && lowestOne.hh<lowest.hh+row ? lowestOne : lowest;
    if(!best || fitted || here.hh<best.hh-0.5) best=here;
    if(fitted) break;
  }
  if(best){
    squeezeLabels(where, best.ss);
    measure();
    for(const gg of clusters) linesCount.set(gg, Math.min(best.nn, gg.childElementCount));
    place_();
  }
  shrink();
  /* Groups are laid out — now it is clear whether singles have room. */
  squeezeSingles();
  /* No reverse step (straightening narrow clusters one by one): the shelf
     height is set by the most awkward cluster anyway, and a shared ceiling
     looks even. */
}
/* HOW TO SPLIT THE WINDOWS. The two windows always share the room equally,
   but they can stand side by side or stacked, and the right choice depends
   on the work: a wide strip belongs stacked, otherwise each window gets a
   narrow column.

   Both cases are computed: the scale side by side and the scale stacked.
   The one showing the work larger wins — unless the flip button said
   otherwise. Its word holds only until the automatic choice comes round to it
   by itself (a new size of the window, another work): from then on the
   automatic choice decides again. A new work drops it at once. */
let splitByHand=null;   // null — automatic; true — stacked; false — side by side
function arrangeWindows(){
  const el=$('#stages'); if(!el) return;
  let auto=false;
  const r=el.getBoundingClientRect();
  if(size.w && size.h && r.width && r.height){
    const beside  = Math.min((r.width/2)/size.w, r.height/size.h);
    const asStack= Math.min(r.width/size.w, (r.height/2)/size.h);
    auto=(asStack>beside);
  }
  if(splitByHand===auto) splitByHand=null;
  const stacked = splitByHand===null ? auto : splitByHand;
  el.style.flexDirection = stacked ? 'column' : 'row';
  stitchCaptions(stacked);
}
FLIP.onclick=e=>{ e.stopPropagation();
  splitByHand = $('#stages').style.flexDirection!=='column';
  arrangeWindows();
  if(hasImage) fitCanvas(); };   // at once, not waiting for the size observer
/* Captions move whole: the same node, only the place changes. Drawing knows
   nothing about it — it writes into #ww0 and #ww2 wherever they are. Side by
   side they stand on the shelf above the windows, stacked on the seam between
   them; the flip button shows the arrangement it would give. */
function stitchCaptions(stacked){
  const shelf=$(stacked ? '#windowSeam' : '#captionsTop'); if(!shelf) return;
  const ww0=$('#ww0'), ww2=$('#ww2');
  if(!ww0||!ww2) return;
  if(ww0.parentElement!==shelf) shelf.appendChild(ww0);

/* KNOB CLUSTERS ARE THE ENGINE'S TOO, laid out like the header's: cluster by

   end of the shelf where the stage block stands. Tightness is measured over
   the WHOLE footer: the stage block takes room like the clusters, though it
   lies outside the knob field. */
function arrangeClusters(){
  const field=$('#knobsField'); if(!field) return;
  divideGroups(field);
  // The knobs are always packed with the stage block standing as a row; only
  // then does it decide whether to stand as a column (its stacks argument). If
  // the column took part in the packing, the room it frees would undo the
  // very reason it was taken, and the two would swap back and forth.
  const block=$('#stageBlock'); if(block) block.classList.remove('inColumn');
  evenOut();          // its rows as they stand in a row, before the packing
  // Label heights are levelled AFTER the packing (alignCaptions); the reserve
  // left from the last layout — another stage's labels — must not weigh in.
  for(const bb of field.querySelectorAll('.knob b')) bb.style.minHeight='';

/* LABEL HEIGHT is measured, not assigned: in a narrow window a label takes
   three lines. The engine measures the tallest visible label and gives
   everyone the same reserve, so the sliders stay level. */
function alignCaptions(){
  const visibleOnes=[...document.querySelectorAll('#knobsField .knob')]
    .filter(rr=>rr.offsetParent!==null);
  if(!visibleOnes.length) return;
  const line=gridPixel()*10;                // a line is ten grid pixels
  let mx_=line;
  for(const rr of visibleOnes) rr.querySelector('b').style.minHeight='0';
  for(const rr of visibleOnes){ const vv=rr.querySelector('b').scrollHeight; if(vv>mx_) mx_=vv; }
  const reserve=Math.ceil(mx_/line)*line;
  for(const rr of visibleOnes) rr.querySelector('b').style.minHeight=reserve+'px';

/* STAGES ARE DATA, NOT BRANCHES. A stage is a record in this list, and
   everything reads it:

     brief   — the short name on the stage flipper;
     about   — the stage's explanation;
     result  — the status line;
     auto    — what "Auto settings" does on this stage;
     count_  — recomputing when knobs move.
   Switching stages swaps the record; nothing is rebuilt. */
const STAGES=[
  {number:1, title:'prepare', brief:'st.1',
   about:'You are on the first stage: bringing back the pixels. The grid of the original art is found and the picture is handed back at its native resolution, one grid cell per pixel. The knobs below tune how well the grid fits and how each cell gets its color.',
   result:()=> result ? [`art ${result.nw}×${result.nh}`,`colors ${result.colorsCount}`,`${result.msec} ms`]
                  : (buf ? [`art ${buf.width}×${buf.height}`,'computing…'] : [`${size.w}×${size.h} px`]),
   auto:async ()=>{ touched=false; await applyAdvice(); laterCount(0); },
   count_:()=>{ redraw(); laterCount(); }},

  {number:2, title:'clusters', brief:'st.2',
   about:'You are on the second stage: clusters. Neighboring cells of one paint are gathered together and get one shared color, so the noise inside them averages out. A lone patch on a flat background stays on its own.',
   result:()=> result2 ? [`clusters ${result2.groupsCount}`,`colors ${result2.colorsCount}`,`${result2.msec} ms`] : ['computing…'],
   auto:(record=true)=>autoGroups(record),
   count_:()=>laterGroups()},

  {number:3, title:'merge', brief:'st.3',
   about:'You are on the third stage: merge. Clusters of the same color anywhere in the work are brought into one paint, including pieces that do not touch. The ribbon shows the paints that came out.',
   result:()=> result3 ? [`paints ${result3.paintsCount}`,`${result3.msec} ms`] : ['computing…'],
   auto:(record=true)=>autoPaints(record),
   count_:()=>laterMerge()},

  /* FOUR — painting. No more algorithms: what did not come together is
     finished by hand. The stage has no knobs. */
  {number:4, title:'paint', brief:'st.4',
   about:'You are on the fourth stage: painting by hand. Whatever did not come together on its own is finished here. Brush and fill use the paints of the work; the picker also copies a color from any picture, and it joins the palette once you paint with it. Double-click a paint to change its color.',
   result:()=> [`paints ${paintsOnPicture()}`, `edits ${edits()}`],
   // No auto, no computing: nothing to turn, nothing to count — painting is
   // done by hand. The "Auto settings" button disappears by itself, seeing the
   // stage has no automatic settings.
   count_:()=>{}},
];
const currentStage=()=>STAGES[stage-1];

/* The button names an ACTION, not what is shown now: the caption above the

function nextStep(){
  const ring=showRing();

// The show button's label and availability are computed by the button engine:

/* ALL OUTPUT IN ONE REFRESH. Buttons, stage label, fine knobs, the step

function refreshView(){
  // What is shown first — fine knobs, the step list, the palette and where it
  // lodges — and only then the layout, or it lays out what is about to hide.
  refreshFine();
  buildStepList();
  showPalette();
  lodgeAll();
  refreshButtons();          // and it calls relayout itself if something is to change
  arrangeWindows();

  tell();

const autoVisited=new Set();

let clickedNow=null, askedAct=null;

function toStage(nn, quiet=false){

  leftView=String(nn*2);

  // THE FIRST VISIT to a stage in a session starts from its automatic

  const firstAuto = !autoVisited.has(nn) && nn>1 && nn<4 && !quiet && !!STAGES[nn-1].auto

/* STEPS. The whole path from the source to the painted work is laid out by

const STEPS={

  '2':{brief:'grid',

  '3':{brief:'pixels', squeezedDown:'px',

  '4':{brief:'cluster borders', squeezedDown:'cl. borders',
       prepare:()=>{ ensureGroups(); },
       above:()=>`cluster borders over pixels — ${result2?result2.groupsCount:0} clusters`,
       draw:kk=>{ if(!drawArt(kk,buf))return false; drawClusters(kk); return true; }},
  '5':{brief:'clusters', squeezedDown:'clust.',

  '6':{brief:'paint borders',

       draw:kk=>{ if(!drawArt(kk,buf2))return false; drawMerged(kk); return true; }},
  '7':{brief:'merged',
       prepare:()=>{ ensureGroups(); ensureMerge(); },
       above:()=>`merged paints — ${result3?result3.paintsCount:0}`,

  '8':{brief:'painted borders',
       prepare:()=>{ ensureGroups(); ensureMerge(); setupRecolor(); },

/* A digit is a VIEW, not a move: it changes the left window, not the stage,
   so the knobs under the hand stay. A step not yet computed is computed here.
   Zero brings the left window back to the current stage's markup. */
function toStep(nn){
  const st_=STEPS[nn]; if(!st_||!hasImage) return;
  if(!AVAILABLE().includes(nn)) return;    // no looking ahead
  if(st_.prepare) st_.prepare();
  leftView=nn;

addEventListener('keydown',e=>{
  if(e.ctrlKey||e.altKey||e.metaKey) return;
  const vv=e.target;
  if(vv && (vv.tagName==='INPUT'||vv.tagName==='TEXTAREA')) return;  // digits are typed in fields
  // Zero — back to the current stage's markup.
  if(e.key==='0'){ e.preventDefault(); toStep(String(stage*2)); return; }
  if(STEPS[e.key]){ e.preventDefault(); toStep(e.key); return; }
  if(e.key==='Delete' && stage===4){ e.preventDefault(); deletePaint(); refreshButtons(); }
});
/* ===================== hints =====================
   Everything explained goes through ONE hint: a native tooltip has its own
   look and font and reads as a foreign program.

   hold. A short tap only does the job, a long one only explains, and the
   press is not passed through. */
const hint=$('#hint');
let hintsOn=true;
function recallHints(){
  try{ hintsOn = localStorage.getItem('repix.hints')!=='no'; }catch(_){}
}
function saveHints(){
  try{ localStorage.setItem('repix.hints', hintsOn?'yes':'no'); }catch(_){}
}
const WAIT=900;              // mouse: how long to stay
const PRESS=450;             // finger: how long to hold
let hintTimer=null;
let fingerHold=null, swallowClick=false;
/* THE ICON IS AN EXPLICIT QUESTION. The hints switch turns off what pops up
   by itself: explanations of buttons, fields, knobs. But the "i" is there to
   be asked, so icons are "on demand" and the switch does not apply to them. */
function attachHint(el, give, onDemand){
  const name=()=>typeof give==='function'?give():give;
  // Explained even with Hints off: the question mark under the cursor says so.
  el.classList.toggle('alwaysHint', !!onDemand);
  el.addEventListener('pointerenter', ss=>{
    if(ss.pointerType==='touch') return;   // a finger has its own way — press and hold

  // hint comes and stays (see holdHint). Hovering is hovering.

function gridPixel(){
  return parseFloat(getComputedStyle(document.documentElement)
           .getPropertyValue('--unit'))||2;
}
/* A FLOATING WINDOW IS DRAGGED BY ITS HEADER — and lands on the grid like
   everything else. Buttons in the header stay buttons: one drags by the empty
   space between them. The drag step is the grid pixel. */
function dragFloating(win, knob){
  knob.addEventListener('pointerdown', ss=>{
    if(ss.target.closest('button')) return;
    const unit=gridPixel(), edge=unit*FLOAT_EDGE;
    const rr=win.getBoundingClientRect();
    const dx_=ss.clientX-rr.left, du=ss.clientY-rr.top;
    knob.setPointerCapture(ss.pointerId);
    const drag=mm=>{
      let x=Math.round((mm.clientX-dx_)/unit)*unit;
      let y=Math.round((mm.clientY-du)/unit)*unit;
      x=Math.max(edge, Math.min(innerWidth-rr.width-edge, x));
      y=Math.max(edge, Math.min(innerHeight-rr.height-edge, y));
      win.style.left=x+'px'; win.style.top=y+'px';
    };
    const enough=()=>{
      knob.removeEventListener('pointermove',drag);
      knob.removeEventListener('pointerup',enough);
      knob.removeEventListener('pointercancel',enough);

    ss.preventDefault();

/* WHERE A FLOATING ENTITY STANDS. It comes to the entity the user is dealing
   with, so its place is computed from it: horizontally centre to centre,

  const edge=gridPixel()*FLOAT_EDGE, gapSize=gridPixel()*FLOAT_GAP;

  let x=rr.left+rr.width/2-unit.width/2;
  x=Math.max(edge, Math.min(innerWidth-unit.width-edge, x));
  const upward=rr.top-unit.height-gapSize, downward=rr.bottom+gapSize;
  let y;
  if(whereTo==='downward') y=(downward+unit.height+edge<=innerHeight) ? downward : upward;
  else              y=(upward>=edge) ? upward : downward;
  y=Math.max(edge, Math.min(innerHeight-unit.height-edge, y));

/* THE WINDOWS COUNT IN PHYSICAL PIXELS of the screen, not in CSS ones. On a

let editingLines=false;
let fixes={x:new Map(), y:new Map()};   // line number -> shift in pixels
let highlighting=null;                        // the line under the hand is drawn brighter than the rest
/* CELL BORDERS (pipeline: borders). Usually an even grid from step and
   origin, but every line can be moved by hand — then the cells differ, and the
   core computes with what it is given. Fixes are dropped on a new grid search
   and a new image. */
function bounds(axis,limit){
  return borders(limit, val[STEP_KNOB], val[axis==='x'?'origin x':'origin y'],
                 k=>fixes[axis].get(k)||0);
}
function lineNumber(axis,world){
  const s=val['step'], ff=val[axis==='x'?'origin x':'origin y'];
  return Math.round((world-ff)/s);
}
function linePosition(axis,k){
  const s=val['step'], ff=val[axis==='x'?'origin x':'origin y'];
  return ff+k*s+(fixes[axis].get(k)||0);
}
function resetFixes(){ fixes={x:new Map(), y:new Map()}; highlighting=null; }
/* UNDO. Not "what changed" is stored but the whole state: the knob values and
   the two maps of line fixes. Cheaper and safer than teaching every action
   (slider, field, line drag, grid drag, reset, advice) to undo itself.
   The snapshot is taken BEFORE the action. Consecutive moves of one knob
   count as one action. */
const UNDO={back:[],forward:[],whose:'',when_:0};
const STICKING=700;
/* HISTORY DEPTH is a setting (Undo steps in the menu). It is ONE limit for
   undo and redo together: no more memory is taken than set.
   A new action does not wipe the redo list: what was undone stays reachable
   with Ctrl+Y; only what does not fit the limit drops out, one record at a
   time — the farthest redo first, then the oldest undo. */
const DEPTH_MIN=10, DEPTH_MAX=1000;
let DEPTH=60;
/* A NEW STEP, as in any editor: what was undone before it is gone — redo
   would bring back a past that no longer leads here. */
function newStep(hh){ hh.forward.length=0; trimHistory(hh); }
function trimHistory(hh){
  while(hh.back.length+hh.forward.length>DEPTH){
    if(hh.forward.length) hh.forward.shift(); else hh.back.shift();
  }
  refreshForward();   // every new step comes through here: undo lights up
}
function recallDepth(){
  try{ const tt=+localStorage.getItem('repix.undoSteps');
       if(tt>=DEPTH_MIN && tt<=DEPTH_MAX) DEPTH=Math.round(tt); }catch(_){}
}
function saveDepth(){
  try{ localStorage.setItem('repix.undoSteps', DEPTH); }catch(_){}
}
/* A STEP of the history: the knobs, the line fixes, the stage one stands on
   and which stages have had their first visit (its automatic settings belong
   to the visit: undo the visit, and the next one brings them again). */
function capture(){
  const zz={}; for(const kk in val) zz[kk]=val[kk];
  return {val:zz, fixes:{x:new Map(fixes.x), y:new Map(fixes.y)},
          stage, visited:[...autoVisited]};
}
const sameFixes=(a,b)=>a.size===b.size && [...a].every(([k,v])=>b.get(k)===v);
function remember(whose){
  const tt=performance.now();
  if(whose===UNDO.whose && tt-UNDO.when_<STICKING){ UNDO.when_=tt; return; }
  UNDO.whose=whose; UNDO.when_=tt;
  UNDO.back.push(capture());
  newStep(UNDO);
}
function goBack(ss){
  // Only a step that changed what is counted counts again: stepping back over
  // a move between stages must not recount the whole work.
  const changed=!sameFixes(ss.fixes.x,fixes.x) || !sameFixes(ss.fixes.y,fixes.y)
             || Object.keys(ss.val).some(kk=>ss.val[kk]!==val[kk]);
  fixes={x:new Map(ss.fixes.x), y:new Map(ss.fixes.y)};
  highlighting=null;
  for(const name in ss.val) if(widget[name]) widget[name].give(ss.val[name]);
  refreshStepShares();
  autoVisited.clear(); for(const nn of ss.visited||[]) autoVisited.add(nn);
  if(ss.stage && ss.stage!==stage) toStage(ss.stage, true);
  redraw();
  if(changed) laterCount(0);
}
function undo(){
  if(!UNDO.back.length) return;
  UNDO.forward.push(capture());
  goBack(UNDO.back.pop());
  UNDO.whose='';
}
function redo(){
  if(!UNDO.forward.length) return;
  UNDO.back.push(capture());
  goBack(UNDO.forward.pop());
  UNDO.whose='';
}
addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  // in a text field Ctrl+Z belongs to the field
  if(e.target && e.target.tagName==='INPUT' && e.target.type!=='range') return;
  /* By KEY CODE, not by letter: on a Russian layout the same key gives "я". */
  const kk=e.code;
  // On stage 4 undo works on the painting: there are no knobs to undo there.
  if(kk==='KeyZ' && !e.shiftKey){ e.preventDefault(); stepBack(); }
  else if(kk==='KeyY' || (kk==='KeyZ' && e.shiftKey)){ e.preventDefault(); stepForward(); }
});
/* On stage 4 undo works on the painting first; with no strokes left it
   steps back through the knobs and the stages, like on any other stage. */
const paintBack=()=> stage===4 && RECOLOR.back.length>0;
const paintForward=()=> stage===4 && RECOLOR.forward.length>0;
function stepBack(){
  if(paintBack()){ undoRecolor(); refreshButtons(); return; }
  // With no strokes left, a step back from the painting leaves it: asked first.
  leavePainting(()=>{ undo(); refreshButtons(); });
}
function stepForward(){ if(paintForward()) redoRecolor(); else redo(); refreshButtons(); }
const canStepBack=()=> hasImage && (paintBack() || UNDO.back.length>0);
const canStepForward=()=> hasImage && (paintForward() || UNDO.forward.length>0);
/* The nearest line by ITS REAL place, not by where it would be on an even
   grid: otherwise a moved line cannot be grabbed again and lines stick. */
function nearestLine(axis,world){
  const k0=lineNumber(axis,world); let ll=k0, dd=Infinity;
  for(let k=k0-2;k<=k0+2;k++){
    const rr=Math.abs(linePosition(axis,k)-world);
    if(rr<dd){ dd=rr; ll=k; }
  }
  return {k:ll, dd};
}
function lineUnder(hl,clientX,clientY){
  if(!hasImage||!showGrid)return null;   // a hidden grid is not touched
  const dd=hl.getBoundingClientRect();
  const {ax,ay,ssx,ssy}=visiblePart();
  const d=density();
  const worldX=ax+((clientX-dd.left)*d-ssx)/view.mm, worldY=ay+((clientY-dd.top)*d-ssy)/view.mm;
  const bbx=nearestLine('x',worldX), bby=nearestLine('y',worldY);
  const kx=bbx.k, ky=bby.k;
  const ddx=bbx.dd*view.mm, ddy=bby.dd*view.mm;
  if(ddx<6*d && ddx<=ddy) return {axis:'x',k:kx};
  if(ddy<6*d) return {axis:'y',k:ky};
  return null;
}
/* THE WHOLE GRID with the right button: moving it changes both origins at
   once. Single-line fixes stay intact: they count from their place in the
   grid and travel with it. */
function dragGrid(clientX,clientY){
  if(!gridPull)return;
  // A step of the history once the grid really moves: a press alone is none.
  if(!gridPull.stepped){ remember('drag grid'); gridPull.stepped=true; }
  const s=val['step'];
  const d=density();
  const ddx=(clientX-gridPull.x)*d/view.mm, ddy=(clientY-gridPull.y)*d/view.mm;
  widget['origin x'].give(toCell(gridPull.nchx+ddx,s));
  widget['origin y'].give(toCell(gridPull.nchy+ddy,s));
  redraw(); laterCount();
}
/* A fix of ONE line is removed by double-clicking it: the line returns to its
   place on the even grid, the others stay. */
function resetLine(hl,clientX,clientY){
  const ll=lineUnder(hl,clientX,clientY);
  if(!ll || !fixes[ll.axis].has(ll.k)) return false;
  remember('reset line');
  fixes[ll.axis].delete(ll.k);
  redraw(); laterCount();
  return true;
}
function dragLine(hl,clientX,clientY){
  if(!linePull)return;
  // A step of the history once the line really moves: a click alone is none.
  if(!linePull.stepped){ remember('drag line'); linePull.stepped=true; }
  const dd=hl.getBoundingClientRect();
  const {ax,ay,ssx,ssy}=visiblePart();
  const {axis,k}=linePull;
  const d=density();
  let world = axis==='x' ? ax+((clientX-dd.left)*d-ssx)/view.mm
                      : ay+((clientY-dd.top)*d-ssy)/view.mm;
  // no passing through a neighbour: at least a pixel always stays between lines
  const lft=linePosition(axis,k-1), rgt=linePosition(axis,k+1);
  world=Math.max(lft+1, Math.min(rgt-1, world));
  const s=val['step'], ff=val[axis==='x'?'origin x':'origin y'];
  fixes[axis].set(k, world-(ff+k*s));
  redraw(); laterCount();
}
/* THE SCALE of the view: screen pixels per picture pixel. */
const ZOOM_MIN=0.05, ZOOM_MAX=64;
const zoomed=mm=>Math.max(ZOOM_MIN*density(),Math.min(ZOOM_MAX*density(),mm));
/* Zoom anchored to a point: the picture point under the cursor stays under
   it after the scale changes. */
function zoomIn(hl,clientX,clientY,vo){
  const dd=hl.getBoundingClientRect();
  const sx=(clientX-dd.left-dd.width/2)*density(), sy=(clientY-dd.top-dd.height/2)*density();
  const underX=view.x+sx/view.mm, underY=view.y+sy/view.mm;
  const was_=view.mm;
  view.mm=zoomed(view.mm*vo);
  if(view.mm===was_)return;
  view.x=underX-sx/view.mm; view.y=underY-sy/view.mm;
  redraw();
}
function highlight(ll){
  const bb=highlighting;
  if((!ll&&!bb) || (ll&&bb&&ll.axis===bb.axis&&ll.k===bb.k)) return;
  highlighting=ll; redraw();
}
/* WHAT A TOUCH ON A WINDOW DOES — one table, read from the top: the first
   rule that holds takes the touch. When none does, the touch moves the
   picture (or, in line editing, the line under it). A rule alone takes the
   touch without holding the pointer: it is a single tap. */
const WINDOW_TOUCH=[
  // The picker's pipette is armed: the touch takes a color, and its click
  // must not close the picker (a click elsewhere closes it).
  {name:'pick for the picker', alone:true,
   holds:()=>pickingInWindows && !!colorTaker,
   act:(hl,e)=>{
     // What is drawn over the picture (the brush's aim, a lit paint) is not
     // the picture: it goes before the pixel is read.
     aimK=-1; litPaint=-1; redraw();
     const px=pixelAt(hl,e);
     if(px) takeColor('#'+px.map(v=>v.toString(16).padStart(2,'0')).join(''), true);
     disarmPipette(); eatClick=true; }},
  // The right button carries the whole grid — but only in line editing
  // mode; the grid is not moved in passing.
  {name:'move the grid',
   holds:(hl,e,source)=>e.button===2 && source && editingLines && showGrid && hasImage,
   act:(hl,e)=>{
     gridPull={x:e.clientX,y:e.clientY,nchx:val['origin x'],nchy:val['origin y']};
     linePull=null; }},
  // STAGE 4: the pipette on EITHER window copies the color of what is
  // visible there.
  {name:'take a paint',
   holds:(hl,e,source)=>stage===4 && source && e.button===0 && hasImage && !!paintsField
                        && (e.altKey || tool==='pipette'),
   act:(hl,e)=>copyFromScreen(hl,e)},
  // STAGE 4: the left button over the right window paints instead of
  // panning. Panning is still there — right button, wheel, two fingers.
  // A SECOND FINGER on a stroke: it was a pinch, not painting. The stroke
  // so far is taken back and both fingers zoom and move the picture.
  {name:'pinch out of a stroke',
   holds:(hl,e)=>e.pointerType==='touch' && recoloringNow===hl && strokeAt && strokeAt.pointerId!==e.pointerId,
   act:(hl,e)=>{
     cancelStroke(); recoloringNow=null;
     dots.clear(); dots.set(strokeAt.pointerId, strokeAt); dots.set(e.pointerId, e); base=null; }},
  {name:'paint',
   holds:(hl,e,source)=>stage===4 && !source && e.button===0 && hasImage && !!paintsField
                        && (!!tool || e.altKey),
   act:(hl,e)=>{ recoloringNow=hl; strokeAt=e; recolorTap(hl,e,true); }},
];
for(const hl of canvases){
  // lines live on the source: the result has no grid to grab
  const source = hl===canvases[0];
  // The right-click menu is never needed over our canvas. The handler sees only
  // presses on it, so it silences only itself.
  hl.addEventListener('contextmenu',e=>e.preventDefault());
  hl.addEventListener('pointerdown',e=>{
    const rule=WINDOW_TOUCH.find(rr=>rr.holds(hl,e,source));
    if(rule && rule.alone){ e.preventDefault(); rule.act(hl,e,source); return; }
    try{ hl.setPointerCapture(e.pointerId); }catch(_){}
    // The first finger of a new touch starts from nothing: a finger that
    // never came up must not turn this one into a pinch.
    if(e.isPrimary){ dots.clear(); base=null; }
    if(rule){ e.preventDefault(); rule.act(hl,e,source); pull=null; return; }
    // (the first finger of a pinch is not primary-cleared above: see the rule
    // that turns a stroke into a pinch)
    dots.set(e.pointerId,e);
    if(dots.size!==1) return;
    const ll=(editingLines&&source)? lineUnder(hl,e.clientX,e.clientY) : null;
    if(ll) highlight(ll);
    if(ll){ linePull={...ll}; pull=null; return; }   // in edit mode a line is dragged, not the picture
    pull={x:e.clientX,y:e.clientY,v:{...view}};
  });
  hl.addEventListener('pointermove',e=>{
    if(recoloringNow===hl){ strokeAt=e; recolorTap(hl,e,false); return; }
    if(gridPull){ dragGrid(e.clientX,e.clientY); return; }
    if(dots.has(e.pointerId)) dots.set(e.pointerId,e);
    if(linePull){ dragLine(hl,e.clientX,e.clientY); return; }
    if(!pull && editingLines && source && dots.size===0){
      const ll=lineUnder(hl,e.clientX,e.clientY);
      hl.style.cursor = ll ? 'grab' : '';
      highlight(ll);
    }
    if(dots.size===2){
      pull=null;
      const [a,b]=[...dots.values()];
      const dd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      // Two fingers at one spot give no ratio: nothing to scale by.
      if(base>=1 && dd>=1){ view.mm=zoomed(view.mm*(dd/base)); redraw(); }
      base=dd; return;
    }
    if(!pull)return;
    const d=density();
    view.x=pull.v.x-(e.clientX-pull.x)*d/view.mm; view.y=pull.v.y-(e.clientY-pull.y)*d/view.mm;
    redraw();
  });
  const remove_=e=>{ gridPull=null;
    if(recoloringNow===hl){ recoloringNow=null; endStroke(); }
    dots.delete(e.pointerId); if(dots.size<2) base=null;
    if(dots.size===0){ pull=null; linePull=null; } };
  hl.addEventListener('pointerup',remove_);
  hl.addEventListener('pointercancel',remove_);
  hl.addEventListener('lostpointercapture',remove_);
  hl.addEventListener('pointerleave',()=>{ if(!linePull) highlight(null); dwellOff(); if(!source) aimOff(); });
  hl.addEventListener('pointermove',e=>{
    if(!recoloringNow && !pull) dwellOn(hl,e); else dwellOff();
    if(!source) aimAt(hl,e);
    else if(!editingLines) hl.style.cursor = (stage===4&&tool==='pipette') ? toolCursor('pipette') : '';
  });
  hl.addEventListener('wheel',e=>{ e.preventDefault();
    zoomIn(hl,e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15); },{passive:false});
  // a double click zooms in twice at the point clicked
  hl.addEventListener('dblclick',e=>{ e.preventDefault();
    // in edit mode a double click removes a line's fix instead of zooming
    if(editingLines&&source){ resetLine(hl,e.clientX,e.clientY); return; }
    zoomIn(hl,e.clientX,e.clientY,2); });
}
/* Line editing lives only while the grid is visible. Grid hidden — the mode
   is frozen, not reset: dragging moves the picture again, highlighting goes
   out. Grid shown again — everything is back as it was. */
function freezeEdit(){
  if(!showGrid) highlight(null);
}
/* Resets, from small to large:
     double click on a line — remove the fix of one line;
     "Find grid again"      — find the grid from scratch, drop all fixes;
     reopen the image       — the same plus the computing parameters. */
/* ===================== opening ===================== */
const toss=$('#toss');
addEventListener('dragover',e=>{e.preventDefault();toss.classList.add('showing');});
toss.addEventListener('dragleave',()=>toss.classList.remove('showing'));
addEventListener('drop',e=>{e.preventDefault();toss.classList.remove('showing');
  const f=e.dataTransfer.files[0]; if(f) fromFile(f);});
/* JOINTS of stage 1's art (pipeline: jointsOf) — the picture's own units of
   difference, kept until the art changes. */
let joints=null;
const theJoints=()=>joints || (joints=jointsOf(artBytes,buf.width,buf.height));
/* AUTOMATIC SETTINGS of stages 2 and 3 (pipeline: groupAdvice, mergeAdvice). */
/* record=false — part of a step already taken (the first visit), not a step
   of its own. */
function autoGroups(record=true){
  if(!buf||!artBytes) return false;
  const ss=groupAdvice(buf.width,buf.height,theJoints(),lastMeasurements,val['jitter']);
  if(record) remember('group advice');
  widget['min paint'].give(ss.minPaint);
  widget['gauge'].give(ss.gauge);
  widget['cell noise'].give(ss.cellNoise);
  laterGroups();
  return true;
}
function autoPaints(record=true){
  if(!buf) return false;
  if(record) remember('paint advice');
  const sp=theSpread();
  const ss=mergeAdvice(buf.width,buf.height,sp||{S:[]});
  widget['min paint total'].give(ss.minPaintTotal);
  if(sp) widget['merge gauge'].give(ss.mergeGauge);
  laterMerge();
  return true;
}

$('#file').onchange=e=>{const f=e.target.files[0]; if(f) fromFile(f);};
let opening=0;
async function fromFile(file){
  // Not before the core is up: there is nowhere to put the image yet.
  if(!core){ say_('coreMsg'); return; }
  // Only the last file chosen is opened: a large one still decoding must not
  // replace a smaller one chosen after it.
  const mine=++opening;
  say_('reading');
  // Anything can be dropped on the window — an archive, text, a broken JPEG.
  // Without a catch the promise would reject silently and the status would
  // hang on "reading" forever.
  let bitmap;
  try{ bitmap=await createImageBitmap(file); }
  catch(_){ if(mine===opening) say_('notImage'); return; }
  if(mine!==opening) return;
  const copy=await createImageBitmap(bitmap);
  if(mine!==opening) return;
  // The core takes it or refuses it (too big for its memory): refused, the
  // work open before stays as it was.
  if(await putIntoCore(copy,bitmap.width,bitmap.height)!==true){
    if(mine===opening) say_('tooBig');
    return;
  }
  if(mine!==opening) return;
  srcBitmap=bitmap;
  size={w:bitmap.width,h:bitmap.height}; hasImage=true;
  adviceGiven=false; lastMeasurements=null; splitByHand=null;
  // A new image starts from the beginning: otherwise, opening a file on stage 3,
  // one would look at paints computed for the previous work.
  result=null; result2=null; result3=null; marks=null; groupPaint=null; palette=null;
  forgetRecolor();
  groupSpread=null; joints=null;
  // The history is of the work open before: its steps must not land here.
  UNDO.back.length=0; UNDO.forward.length=0; UNDO.whose='';
  // Settings are NOT touched: what was set by hand stays for the new image
  // and across stages. Only the previous work's data is dropped. Computed
  // values come back with "Auto settings".
  if(stage!==1) toStage(1, true);
  // The whole work fits the window at first.
  const dd=canvases[0].getBoundingClientRect();
  view={x:bitmap.width/2,y:bitmap.height/2,
       mm:zoomed(Math.min(dd.width/bitmap.width,dd.height/bitmap.height)*density())};
  drawnDensity=density();   // the scale is set for the density of now
  // One common refresh instead of a handful of calls: one of them always gets
  // forgotten.
  refreshView();
  await findGrid();
  laterCount(0);
}
/* ===================== grid ===================== */
/* THE DOUBT LABEL. Coherence — how well color transitions sit on the found
   lattice. Real pixel art gives 0.8..1.0 (all right grids of 27 references
   are 0.79 and above); below 0.7 transitions fit no lattice well — typical
   of neural-net "pixel" images and heavy blur. The grid is placed as usual;
   the label only asks to check it by eye. Its state is just data — whether to
   show it and what it explains; the button engine does the rest. */
const COHERENCE_DOUBT=0.7;
function showDoubt(r){
  const dd=r?r.coherence:0;
  doubtShown = !r || dd<COHERENCE_DOUBT;
  doubtText='Color transitions sit badly on any lattice: coherence '+dd.toFixed(2)+
    ' (real pixel art gives 0.8–1.0). Looks like a neural-net image or heavy blur — check the grid by eye.';
  refreshButtons();
}
async function findGrid(){
  if(!hasImage)return;
  say_('seekingGrid');
  const g=await coreJob('grid','grid',{});
  if(!g) return;                 // another image or search took over
  const r=g.found;
  showDoubt(r);
  // No grid: the lines stay where they were, and the art the search stopped
  // is counted again on them.
  if(!r){ say_('noGrid'); laterCount(0); return; }
  resetFixes();          // line fixes are dropped: the grid is set anew
  widget[STEP_KNOB].give(r.step); widget['origin x'].give(r.ox); widget['origin y'].give(r.oy);
  refreshStepShares();   // the origins came before the step settled — fold them into a cell
  // no advice yet: measurements are born in the first pass, adjusted there
  tell();          // numbers at once, as an estimate; exact ones come when the whole canvas is done
  redraw();
  // and recompute. Otherwise "Find grid again" moved the lines while the
  // right window kept art computed on the OLD grid
  laterCount(0);
}
/* ===================== drawing ===================== */
function visiblePart(){
  const c=$('#xx0'), ww=c.width/view.mm, vv=c.height/view.mm;
  const llx=view.x-ww/2, lly=view.y-vv/2;
  const ax=Math.max(0,Math.floor(llx)), ay=Math.max(0,Math.floor(lly));
  const bx=Math.min(size.w,Math.ceil(view.x+ww/2)), by=Math.min(size.h,Math.ceil(view.y+vv/2));
  return {ax,ay,bx,by,ssx:(ax-llx)*view.mm,ssy:(ay-lly)*view.mm};
}
/* CLUSTER BORDERS. Like the grid on stage 1, but showing what stage 2 built:
   a line runs where neighbouring cells belong to different groups. */
/* The line color comes from the colors: it is drawn on the canvas but belongs
   to the interface. */
const fromPalette=name=>getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function toTransparency(color,share){
  const ch_=parseInt(color.slice(1),16);
  return `rgba(${ch_>>16&255},${ch_>>8&255},${ch_&255},${share})`;
}
function drawClusters(kk){
  if(!marks||!buf||!boundsField)return;
  const {ax,ay,bx,by,ssx,ssy}=visiblePart();
  const {ggx,ggy}=boundsField;
  const ll=ggx[0], unit=ggx[ggx.length-1], vv=ggy[0], nn=ggy[ggy.length-1];
  const nw=buf.width, nh=buf.height;
  const sk=(unit-ll)/nw*view.mm, vk=(nn-vv)/nh*view.mm;   // a cell on screen
  // How far lines are shown depends on the CELL on screen, not the work's size:
  // what matters is whether cells are distinguishable. On stages 2 and 3 one
  // looks at the borders, so there lines are drawn longer — down to 1.2 px per cell.
  if(sk<1.2*density()||vk<1.2*density()) return;
  const x0=ssx+(ll-ax)*view.mm, y0=ssy+(vv-ay)*view.mm;
  // A hairline while cells are small; thicker only up close.
  // A bold line on a small cell eats the cell itself.
  const thick = sk<14*density() ? hair(1) : Math.min(hair(3), sk/14);
  // Only cells inside the window are visited: walking the whole grid every
  // frame made large works lag.
  const wid=(unit-ll)/nw, hgt=(nn-vv)/nh;
  const i0=Math.max(0,Math.floor((ax-ll)/wid)-1), i1=Math.min(nw,Math.ceil((bx-ll)/wid)+1);
  const j0=Math.max(0,Math.floor((ay-vv)/hgt)-1), j1=Math.min(nh,Math.ceil((by-vv)/hgt)+1);
  if(i1<=i0||j1<=j0) return;

  kk.strokeStyle=toTransparency(fromPalette('--bar'),0.9);
  kk.lineWidth=thick;
  kk.beginPath();
  // Consecutive borders merge into one line: drawing a long cluster edge as
  // one segment is much cheaper than as a hundred.
  for(let i=i0;i<i1-1;i++){          // vertical borders merged along a column
    const x=x0+(i+1)*sk;
    let beg=-1;
    for(let j=j0;j<j1;j++){
      if(marks[j*nw+i+1]!==marks[j*nw+i]){ if(beg<0) beg=j; }
      else if(beg>=0){ kk.moveTo(x,y0+beg*vk); kk.lineTo(x,y0+j*vk); beg=-1; }
    }
    if(beg>=0){ kk.moveTo(x,y0+beg*vk); kk.lineTo(x,y0+j1*vk); }
  }
  for(let j=j0;j<j1-1;j++){          // horizontal borders merged along a row
    const y=y0+(j+1)*vk, rr=j*nw, rr2=(j+1)*nw;
    let beg=-1;
    for(let i=i0;i<i1;i++){

      else if(beg>=0){ kk.moveTo(x0+beg*sk,y); kk.lineTo(x0+i*sk,y); beg=-1; }
    }
    if(beg>=0){ kk.moveTo(x0+beg*sk,y); kk.lineTo(x0+i1*sk,y); }

/* The source goes into ANY canvas, not only the left one: the right window
   can show steps too, and the first of them is the picture itself. */
function putSource(kk){
  if(!srcBitmap)return false;
  const {ax,ay,bx,by,ssx,ssy}=visiblePart();
  const c=kk.canvas;
  kk.setTransform(1,0,0,1,0,0); kk.clearRect(0,0,c.width,c.height);
  kk.imageSmoothingEnabled=false;
  kk.drawImage(srcBitmap,ax,ay,bx-ax,by-ay,ssx,ssy,(bx-ax)*view.mm,(by-ay)*view.mm);
  return true;
}
function drawSource(){
  // On the left — the chosen step and only it. A step knows what to draw
  // and how to caption itself; with nothing drawn, the source stands.
  let st_=STEPS[leftView];
  if(!st_ || !st_.draw(ktx[0])){
    st_=STEPS['1'];
    if(!st_.draw(ktx[0])) return;
  }
  $('#ww0').textContent=st_.above();
}
function drawGrid(kk){
  if(!srcBitmap)return;
  const {ax,ay,bx,by,ssx,ssy}=visiblePart();
  const s=val['step'], fx=val['origin x'], fy=val['origin y'];
  // zoomed out, lines would merge into a fill — every N-th is drawn so that
  // at least five screen pixels stay between them
  const N=Math.max(1,Math.ceil(5*density()/(s*view.mm)));
  const unitx=(bx-ax)*view.mm, unity=(by-ay)*view.mm;
  kk.save(); kk.beginPath(); kk.rect(ssx,ssy,unitx,unity); kk.clip();
  // Transparency cuts the contrast just as much, so it never goes below half.
  kk.strokeStyle=toTransparency(fromPalette('--bar'), N>1?0.55:Math.min(0.9,0.5+s*view.mm/(40*density())));
  // A line of odd width sits on the middle of a pixel, an even one between.
  const lw=hair(1), half=(lw%2)/2;
  kk.lineWidth=lw; kk.beginPath();
  let k0=Math.floor((ax-fx)/s); k0-=((k0%N)+N)%N;
  for(let k=k0; fx+k*s<=bx+s; k+=N){ const gg=linePosition('x',k); if(gg<ax||gg>bx)continue;
    const x=Math.round(ssx+(gg-ax)*view.mm)+half; kk.moveTo(x,ssy); kk.lineTo(x,ssy+unity); }
  let l0=Math.floor((ay-fy)/s); l0-=((l0%N)+N)%N;
  for(let k=l0; fy+k*s<=by+s; k+=N){ const gg=linePosition('y',k); if(gg<ay||gg>by)continue;
    const y=Math.round(ssy+(gg-ay)*view.mm)+half; kk.moveTo(ssx,y); kk.lineTo(ssx+unitx,y); }
  kk.stroke();
  // the line held or about to be grabbed — brighter and thicker than the rest,
  // drawn separately so thinning out cannot eat it
  if(highlighting){
    const {axis,k}=highlighting, gg=linePosition(axis,k);
    const lw2=hair(2), half2=(lw2%2)/2;
    kk.strokeStyle=fromPalette('--highlighting'); kk.lineWidth=lw2; kk.beginPath();
    if(axis==='x'){ if(gg>=ax&&gg<=bx){ const x=Math.round(ssx+(gg-ax)*view.mm)+half2;
      kk.moveTo(x,ssy); kk.lineTo(x,ssy+unity); } }
    else { if(gg>=ay&&gg<=by){ const y=Math.round(ssy+(gg-ay)*view.mm)+half2;
      kk.moveTo(ssx,y); kk.lineTo(ssx+unitx,y); } }
    kk.stroke();
  }
  kk.restore();
}
/* ===== buffer of the whole art =====
   The art is computed in strips of cell rows into a buffer for the whole
   work, and showing only scales what is ready: zooming computes NOTHING, and
   the construction is visible live, strip by strip. */
let buf=null, bk=null, result=null, waiting=null, boundsField=null;
let artBytes=null, buf2=null, bk2=null, result2=null, marks=null;
let buf3=null, bk3=null, result3=null, groupPaint=null, palette=null;
function setupBuffer(nw,nh){
  if(buf && buf.width===nw && buf.height===nh) return;
  buf=new OffscreenCanvas(nw,nh); bk=buf.getContext('2d'); bk.imageSmoothingEnabled=false;
  buf2=new OffscreenCanvas(nw,nh); bk2=buf2.getContext('2d'); bk2.imageSmoothingEnabled=false;
  buf3=new OffscreenCanvas(nw,nh); bk3=buf3.getContext('2d'); bk3.imageSmoothingEnabled=false;

/* STAGE TWO. Cells into groups, one color per group (pipeline: pass2).

async function computeGroups(){
  if(!artBytes||!core||!buf){result2=null;return;}
  const nw=buf.width, nh=buf.height;
  const shown=(stage===2) ? bk2.getImageData(0,0,nw,nh).data : null;
  const r=await coreJob('s2','pass2',
    {art:artBytes, nw, nh, k:groupKnobs(), joints:theJoints(), shown},
    shown ? [shown.buffer] : [],
    m=>{ bk2.putImageData(new ImageData(m.preview,nw,nh),0,0); redraw(); });

/* Computes what a view needs, unless it is there or on its way. */

function finishGroups(r, msec){

/* STAGE THREE — MERGING (pipeline: pass3). Stage 2's groups are merged into

let groupSpread=null;

const mergeKnobs=()=>({mergeGauge:val['merge gauge'], neighbourStrictness:val['neighbor strictness'],
  maxDrift:val['drift from source'], minPaintTotal:val['min paint total'], maxPaints:val['max paints']});
/* STAGE 3 IN THE CORE'S THREAD, like stage 2: on stage 3 the clusters are

async function computeMerge(){
  if(!marks||!result2||!buf2||!core||!clusters){result3=null;return;}
  const nw=buf2.width, nh=buf2.height;
  const shown=(stage===3) ? bk3.getImageData(0,0,nw,nh).data : null;
  const r=await coreJob('s3','pass3',
    {label:marks, nw, nh, cc:clusters, k:mergeKnobs(), spread:theSpread(), shown},
    shown ? [shown.buffer] : [],
    m=>{ bk3.putImageData(new ImageData(m.preview,nw,nh),0,0); redraw(); });

function finishMerge(r, msec){
  const nw=buf2.width, nh=buf2.height, total=nw*nh;
  const frame=new ImageData(nw,nh);

let waitMerge=null;
function laterMerge(){
  clearTimeout(waitMerge);
  waitMerge=setTimeout(()=>{ waitMerge=null; computeMerge(); },0);
  refreshForward();
}
/* What a paint's tile says: its color and what stands behind it — cells of
   the picture on stage 4, clusters on stage 3. */
function paintText(kk){
  const rgb=`${kk.r},${kk.g},${kk.b}`;
  if(stage===4 && paintCounts)
    return paintCounts[kk.nn]>0 ? `${rgb} — ${paintCounts[kk.nn]} cells.`
                                : `${rgb} — not on the picture. Clean removes it.`;
  return kk.groupsCount>0 ? `${rgb} — ${kk.groupsCount} clusters.` : `${rgb} — added by hand.`;

/* THE PALETTE IN VIEW. Stage 3 is about paints, so they must be visible:

function showPalette(){
  const where=$('#palette'); if(!where) return;
  where.hidden = (stage!==3&&stage!==4) || !palette;
  if(where.hidden) return;
  // PALETTE ORDER — as a painter lays it out, not as the core counted: greys
  // first, dark to light (they have no hue), then colors around the hue
  // circle, and within one hue from dark to light. Hues are rounded to 15°
  // sectors, or neighbouring paints of one family scatter by lightness.
  const order=[...palette].map(kk=>({...kk, hsl:vvHSLch_(kk.r,kk.g,kk.b)}))
    .sort((a,b)=>{
      const ssa=a.hsl.S<12?0:1, ssb=b.hsl.S<12?0:1;
      if(ssa!==ssb) return ssa-ssb;                       // greys first
      if(ssa===0) return a.hsl.L-b.hsl.L;                // greys by lightness
      const tta=Math.round(a.hsl.H/15), ttb=Math.round(b.hsl.H/15);
      if(tta!==ttb) return tta-ttb;                       // colors around the circle
      return a.hsl.L-b.hsl.L;                           // within a hue by lightness

      color:`rgb(${copied.r},${copied.g},${copied.b})`,
      hint:()=>[tt.copied, `${copied.r},${copied.g},${copied.b} — a color held in hand, but not a paint of the palette yet.<br><br>It gets here when the picker copies a color from any picture, or when Clean removes the paint you were holding from the palette. The color stays in hand so it is not lost.<br><br>Click it to take it. The first stroke with it makes it a paint of the palette again.`],
      click:()=>{ chosen=COPIED; markChosen(); }});

  // cannot be taken in hand. The strip scrolls. On stage 4 the strip is not a
  // report but a set of paints: a click takes the paint in hand, and the one
  // in hand is marked. The hint reads the paint as it is now.
  for(const kk of order){
    const own=palette.find(x=>x.nn===kk.nn)||kk;

/* PAINT BORDERS. Like cluster borders, but drawn where neighbouring cells

function drawMerged(kk){
  if(!marks||!groupPaint||!buf2||!boundsField)return;
  const {ax,ay,bx,by,ssx,ssy}=visiblePart();
  const {ggx,ggy}=boundsField;
  const ll=ggx[0], unit=ggx[ggx.length-1], vv=ggy[0], nn=ggy[ggy.length-1];
  const nw=buf2.width, nh=buf2.height;
  const sk=(unit-ll)/nw*view.mm, vk=(nn-vv)/nh*view.mm;
  if(sk<1.2*density()||vk<1.2*density()) return;
  const x0=ssx+(ll-ax)*view.mm, y0=ssy+(vv-ay)*view.mm;
  const wid=(unit-ll)/nw, hgt=(nn-vv)/nh;
  const i0=Math.max(0,Math.floor((ax-ll)/wid)-1), i1=Math.min(nw,Math.ceil((bx-ll)/wid)+1);
  const j0=Math.max(0,Math.floor((ay-vv)/hgt)-1), j1=Math.min(nh,Math.ceil((by-vv)/hgt)+1);
  if(i1<=i0||j1<=j0) return;

  // a line would stay where a paint was painted over by hand.
  const pt= (stage===4&&paintsField) ? (i=>paintsField[i])
                                   : (i=>{ const g=marks[i]; return g<0?-1:groupPaint[g]; });

  // input, and one knob, "Markup color", paints them.
  kk.strokeStyle=toTransparency(fromPalette('--bar'),0.9);
  kk.lineWidth=sk<14*density()?hair(1):Math.min(hair(3),sk/14);

    const x=x0+(i+1)*sk; let beg=-1;
    for(let j=j0;j<j1;j++){
      if(pt(j*nw+i+1)!==pt(j*nw+i)){ if(beg<0) beg=j; }
      else if(beg>=0){ kk.moveTo(x,y0+beg*vk); kk.lineTo(x,y0+j*vk); beg=-1; }
    }
    if(beg>=0){ kk.moveTo(x,y0+beg*vk); kk.lineTo(x,y0+j1*vk); }
  }
  for(let j=j0;j<j1-1;j++){
    const y=y0+(j+1)*vk, rr=j*nw, rr2=(j+1)*nw; let beg=-1;
    for(let i=i0;i<i1;i++){
      if(pt(rr2+i)!==pt(rr+i)){ if(beg<0) beg=i; }

  }

/* An art pixel is square — that is about the work itself, not about how it

  const {ax,ay,ssx,ssy}=visiblePart();
  const {ggx,ggy}=boundsField;
  const ll=ggx[0], unit=ggx[ggx.length-1], vv=ggy[0], nn=ggy[ggy.length-1];

/* THE OUTPUT OF A STAGE — its picture and the caption over it. The right

function stageOutput(){
  return [()=>[buf,`pixels — ${buf?buf.width:0}×${buf?buf.height:0} cells`],

          ()=>[buf3,`paints — ${result3?result3.paintsCount:0}`],
          ()=>[buf4,`painted — ${paintsOnPicture()} paints, ${edits()} edits`]][stage-1]();

function drawResult(){
  // The right window ALWAYS shows the current stage's output: it is the

/* HOLDING. The picture cannot be dragged into emptiness: half of it always

const HOLD=0.5;
function hold(){

    const win=side/view.mm, edge=HOLD*Math.min(limit,win);
    const mn_=-win/2+edge, mx_=limit+win/2-edge;

function redraw(){            // showing only, no computing

  // They are squeezed right away, not at the next layout pass.
  squeezeSingles();

let waitGroups=null;

  clearTimeout(waitGroups);

  // and the line color is fitted to this work right now if it is on.

/* THE TOP LINE IS A RESULT, NOT A DASHBOARD. What matters on each stage is

const MESSAGES={

  RECOLOR.back.push({kk:Int32Array.from(strokeK), bb:Int32Array.from(strokeB),
                    adopted:strokeAdopted});
  strokeAdopted=null;
  newStep(RECOLOR);
  strokeK=null; strokeB=null;
  // Both the status line and the window caption: the edit count is in both.
  showPalette(); refreshButtons(); tell(); redraw();
}
function rollBack(whence,whereTo){
  const ww=whence.pop(); if(!ww) return false;
  const undoing=(whence===RECOLOR.back);
  if(ww.paletteAdd || ww.paletteClean){
    // Adding is undone by removing, cleaning by bringing back, and vice versa.
    const list=ww.paletteAdd||ww.paletteClean;
    const bringBack = ww.paletteClean ? undoing : !undoing;
    if(bringBack){ for(const kk of list) if(!palette.some(x=>x.nn===kk.nn)) palette.push({...kk}); }
    else {
      palette=palette.filter(x=>!list.some(kk=>kk.nn===x.nn));
      if(list.some(kk=>kk.nn===chosen)){
        copied={r:paintColors[chosen*3], g:paintColors[chosen*3+1], b:paintColors[chosen*3+2]};
        chosen=COPIED;
      }
    }
    whereTo.push(ww);
  } else if(ww.color!==undefined){
    // A paint color edit: swap the current color and the remembered one.
    const now=[0,1,2].map(i=>paintColors[ww.color*3+i]);
    setPaintRGB(ww.color, ww.bb);
    whereTo.push({color:ww.color, bb:now});
  } else {
    const was_=new Int32Array(ww.kk.length);
    for(let n=0;n<ww.kk.length;n++){ was_[n]=paintsField[ww.kk[n]]; paintsField[ww.kk[n]]=ww.bb[n]; }
    whereTo.push({kk:ww.kk,bb:was_,adopted:ww.adopted});
    /* A stroke that gave birth to a paint — undo moves it from the palette back
       to copied, redo brings it back. */
    if(ww.adopted){
      const {nn,rgb}=ww.adopted;
      if(undoing){
        palette=palette.filter(x=>x.nn!==nn);
        copied={r:rgb[0],g:rgb[1],b:rgb[2]};
        if(chosen===nn) chosen=COPIED;
      } else {
        if(!palette.some(x=>x.nn===nn)) palette.push({r:rgb[0],g:rgb[1],b:rgb[2],groupsCount:0,nn});
        copied=null;
        if(chosen===COPIED) chosen=nn;
      }
    }
  }
  writeRecolor(); showPalette(); refreshButtons(); redraw(); tell();
  return true;
}
const undoRecolor=()=>rollBack(RECOLOR.back,RECOLOR.forward);
const redoRecolor=()=>rollBack(RECOLOR.forward,RECOLOR.back);

/* A click on the right window. The pipette also lives on Alt with any tool:
   taking a paint is needed all the time. */
/* A STROKE KEEPS THE TOOL IT BEGAN WITH: a drag after the pipette or a fill
   takes and floods nothing more, and letting Alt go mid-drag does not turn it
   into a brush. A copied color becomes a paint with the first cell it lands
   on, wherever the stroke began. */
let strokeTool=null, strokeAt=null;
function recolorTap(hl,e,first){
  if(first) strokeTool = (e.altKey || tool==='pipette') ? 'take' : tool;
  const k=cellUnder(hl,e.clientX,e.clientY);
  if(k<0) return;
  if(strokeTool==='take'){ if(first) takePaint(k); return; }
  if(!first && strokeTool!=='brush') return;
  adoptCopied();
  if(!strokeK) startStroke();
  const changed = (first && strokeTool==='fill') ? floodFill(k) : put(k);
  if(changed){ writeRecolor(); redraw(); }
}
/* A stroke taken back before it is done (it turned into a pinch): its cells
   return to what they were. A stroke that gave birth to a paint is kept. */
function cancelStroke(){
  if(!strokeK){ return; }
  if(strokeAdopted){ endStroke(); return; }
  for(let n=strokeK.length-1;n>=0;n--) paintsField[strokeK[n]]=strokeB[n];
  strokeK=null; strokeB=null;
  writeRecolor(); redraw();
}

/* A THEMES FILE is JSON: {"repix":"themes", "version":1, "themes":[{"name":…,
   "colors":{…}}, …]}; a single theme ({"repix":"theme", "name", "colors"}) is
   read too. The names are the file's header: loading offers them. Colors that
   are missing or not colors are taken from the default theme; a theme without
   its body and accent is skipped, and a file with none left is refused. */
const THEME_COLORS=['hull','accent','markup','canvas','buttons','text'];
const THEME_FLAGS=['lockButtons','lockText','auto'];
function readThemesFile(text){
  try{
    const ff=JSON.parse(text);
    const list = ff && ff.repix==='themes' && Array.isArray(ff.themes) ? ff.themes
               : ff && ff.repix==='theme' ? [ff] : [];
    const good=vv=>/^#[0-9a-f]{6}$/i.test(vv||'');
    const out=[];
    for(const tt of list){
      if(!tt || !tt.colors || !good(tt.colors.hull) || !good(tt.colors.accent)) continue;
      const cc={};
      for(const kk of THEME_COLORS) cc[kk]=good(tt.colors[kk]) ? tt.colors[kk].toLowerCase() : DEFAULT_COLORS[kk];
      for(const kk of THEME_FLAGS) cc[kk]=typeof tt.colors[kk]==='boolean' ? tt.colors[kk] : DEFAULT_COLORS[kk];
      out.push({name: typeof tt.name==='string' ? tt.name.trim().slice(0,THEME_NAME_MAX) : '', colors:cc});
    }
    return out.length ? out : null;
  }catch(_){ return null; }
}

  const out={repix:'themes', version:1, themes:list.map(tt=>{
    const cc={}; for(const kk of THEME_COLORS.concat(THEME_FLAGS)) cc[kk]=tt.colors[kk];
    return {name:tt.name, colors:cc}; })};

   colors as they were, standing on the default theme's name. */
const RENAMED_THEMES={'Repix':'Moss'};
const knownTheme=name=>{

  return allThemes().some(x=>x.name===nn) ? nn : THEMES[0].name;
