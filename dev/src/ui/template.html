  if(parts.length) for(let k=1; k<=most; k++){
    const bb = k===1 ? {wide:ws.reduce((a,w,i)=>a+w+(i<ws.length-1?joins[i]:0),0), lines:[parts.map((_,i)=>i)]}
                     : narrowestLines(ws, joins, k);
    const stays = el._decided===String(k);
    if(bb && bb.wide <= remainder-(stays ? 1 : margin)){ decided=String(k); lines=bb.lines; break; }
  }
  // How it stands follows the decision always (a packing takes its classes
  // off while it measures); its words are laid only when the decision or
  // the words changed — else the page is not touched.
  el.classList.toggle('atBottom', decided==='bottom');
  el.classList.toggle('inColumn', decided!=='bottom' && decided!=='1');
  if(decided===el._decided && el.textContent===el.dataset.snapshot) return;
  el._decided=decided;
  lay(parts.length ? lines : []);
}
/* A window caption reads "pixels — 111×111 cells": what is shown, then the
   measure. In a narrow window the measure is dropped whole rather than cut
   with an ellipsis. The full text is kept on the node itself: drawing sets it
   anew every frame, and our own cut-down text must be told apart from it. */
function dropTail(el, oo){
  if(el.textContent!==el.dataset.squeezed) el.dataset.fulltext=el.textContent;
  // Its words and its width as last time: nothing to do.
  const key=(el.dataset.fulltext||'')+'|'+el.clientWidth;
  if(key===el._laidFor && el.textContent===el.dataset.squeezed) return;
  el._laidFor=key;
  let text=el.dataset.fulltext||el.textContent;
  el.textContent=text;
  while(el.scrollWidth>el.clientWidth+1){
    const at=Math.max(...oo.seams.map(ss=>text.lastIndexOf(ss)));
    if(at<=0) break;
    text=text.slice(0,at); el.textContent=text;
  }
  el.dataset.squeezed=el.textContent;
}
/* STACKS — a single as a column as soon as the field beside it takes more
   than one row: decided with the field's fold, in packClusters. */
const GIVING={rows:squeezeStatus, tail:dropTail};
function squeezeSingles(){
  for(const oo of SINGLES){
    // A stacking single is decided with its field's fold (packClusters),
    // not a second time after it.
    const how = oo.stacks ? null : oo.seams ? GIVING[oo.gives] : null;
    if(!how) continue;
    const el=$('#'+oo.id_); if(el && el.offsetParent) how(el, oo);
  }
}
/* SHORTENING BY RULE, NOT BY CUTTING. An object has a SERIES: the full label
   and its shortenings in order, from mildest to harshest. No series — the
   label is untouchable. A shortening that did not change the label does not
   count as a level. */
function labelsRow(kk){
  const fulltext=(typeof kk.label==='function')?kk.label():kk.label;
  const row_=(typeof kk.shorter==='function')?kk.shorter():(kk.shorter||[]);
  const everything=[fulltext,...row_];
  return everything.filter((tt,i)=>i===0||tt!==everything[i-1]);
}
function squeezeDepth(where){
  let gg=0;
  for(const kk of BUTTONS){
    const el=kk.node;
    if(el && where.contains(el) && el.offsetParent) gg=Math.max(gg, labelsRow(kk).length-1);
  }
  return gg;
}
function squeezeLabels(where, level){
  where.dataset.squeeze=level;
  for(const kk of BUTTONS)
    if(kk.node && where.contains(kk.node)) writeLabel(kk, shownLabel(kk));
}

/* EACH CLUSTER LAYS ITSELF OUT, NOT NECESSARILY IN ONE ROW. As soon as ONE
   cluster takes two rows, the shelf is twice as tall anyway, and a second row
   is free for the rest. So a cluster is not "row or stack" but "as many rows
   as needed"; a stack is just the extreme case.

   Dividers stay between clusters, dividing neighbours in the row. */
/* Where the clusters lie and where tightness is measured are not always the
   same: the knob field is measured over the whole footer. */
/* The narrowest width that holds the objects (their widths, in order) in at
   most n rows, a gap between neighbours in a row. */
function narrowestSplit(ws, n, gap){
  const m=ws.length; if(!m) return 0;
  const span=(a,b)=>{ let ss=gap*(b-a-1); for(let i=a;i<b;i++) ss+=ws[i]; return ss; };
  let prev=Array(m+1).fill(Infinity); prev[0]=0;
  let best=Infinity;
  for(let r=1; r<=n; r++){
    const cur=Array(m+1).fill(Infinity); cur[0]=0;
    for(let i=1;i<=m;i++) for(let j=0;j<i;j++) cur[i]=Math.min(cur[i], Math.max(prev[j], span(j,i)));
    best=Math.min(best, cur[m]); prev=cur;
  }
  return best;
}
function packClusters(where, shelf){
  const clusters=[...where.querySelectorAll('.group')].filter(gg=>!gg.hidden);
  if(!clusters.length) return;
  const st_=getComputedStyle(shelf);
  // The INNER width is available: the shelf padding is not given to clusters.
  const place=shelf.clientWidth-(parseFloat(st_.paddingLeft)||0)-(parseFloat(st_.paddingRight)||0);
  const gapSize=parseFloat(st_.columnGap)||0;
  const linesCount=new Map(clusters.map(gg=>[gg,1]));
  /* A cluster's one-row width is the basis for its width in N rows. Not a
     grid: a column would take the widest button's width and leave holes.
     Instead the cluster's width is capped and it wraps by itself, buttons
     packed with the same gap as in one row. */
  const toLine=new Map();
  const most=new Map();
  const gapIn=new Map();   // the gap INSIDE a group counts towards the width too
  const widths=new Map();   // object widths, largest first: columns are computed from them
  const inOrder=new Map();  // the same widths in the order the objects stand
  const heights=new Map();  // their heights, in the same order
  const rowGapIn=new Map(); // the gap between a group's rows
  // Measured more than once: a shortened label is another width, and counting
  // by the old one would fold groups where everything already fits.
  const measure=()=>{
    /* Measured UNSQUEEZED: a group wider than the field would be shrunk by
       the row it stands in, its knobs and labels with it, and a fold planned
       from shrunk widths comes out taller than planned. For the measuring it
       stands at its own full width. */
    for(const gg of clusters){ gg.style.flex='0 0 auto'; gg.style.width='max-content'; }
    // The knobs' labels are given the height they will stand with (the
    // reserve alignCaptions gives): measured by their default, two lines,
    // every knob would be data taller than it stands.
    if(where.querySelector('.knob')) alignCaptions();
    for(const gg of clusters){
      gg.style.flexWrap=''; gg.style.maxWidth='';
      for(const el of gg.children) el.style.flexGrow='';
      // Measured BEFORE stretching: the whole cluster in one row and its widest
      // button. A cluster cannot be narrower than its widest button.
      toLine.set(gg, gg.getBoundingClientRect().width);
      gapIn.set(gg, parseFloat(getComputedStyle(gg).columnGap)||0);
      const ww=[...gg.children].filter(el=>!el.hidden)
        .map(el=>el.getBoundingClientRect().width).sort((a,b)=>b-a);
      widths.set(gg, ww);
      inOrder.set(gg, [...gg.children].filter(el=>!el.hidden).map(el=>el.getBoundingClientRect().width));
      heights.set(gg, [...gg.children].filter(el=>!el.hidden).map(el=>el.getBoundingClientRect().height));
      rowGapIn.set(gg, parseFloat(getComputedStyle(gg).rowGap)||0);
      most.set(gg, ww[0]||0);
    }
    for(const gg of clusters){ gg.style.flex=''; gg.style.width=''; }
  };
  measure();
  const place_=()=>{
    for(const [gg,nn] of linesCount){
      if(nn<=1){
        gg.style.flexWrap=''; gg.style.maxWidth='';
        for(const el of gg.children) el.style.flexGrow='';
      } else {
        gg.style.flexWrap='wrap';
        /* THE CEILING IS THE NARROWEST SPLIT into n rows, the objects kept
           in their order: a long one stands alone, short ones share a row —
           "Repix" above, "Open" and "Save" together under it, not "Repix"
           with "Open" and "Save" alone. Rows fill from the left within it and
           come out exactly that split. */
        const ceiling=narrowestSplit(inOrder.get(gg)||[], nn, gapIn.get(gg));
        gg.style.maxWidth=Math.ceil(Math.max(most.get(gg), ceiling))+'px';
        /* Buttons in a folded cluster stretch to its full width, or the rows end
           raggedly. Not knobs: a slider is an instrument, its width is fixed. */
        for(const el of gg.children) if(el.tagName==='BUTTON') el.style.flexGrow='1';
      }
    }
  };
  /* WIDTH BY FACT, NOT BY CALCULATION. The calculated width is a ceiling
     for deciding how many columns fit: the k widest objects side by side. But
     the widest ones need not share a row — "Show source" and "Edit lines"
     stand on top, the wider "Find grid again" below. So once laid out, every
     row is measured at its objects' OWN widths, unstretched, and the group
     becomes as wide as its widest real row: that row stands exactly by its
     labels, the others stretch to it. */
  const shrink=()=>{
    for(const [gg,nn] of linesCount){
      if(nn<=1) continue;
      const kids=[...gg.children].filter(el=>!el.hidden);
      for(const el of kids) el.style.flexGrow='';
      const rows=new Map();
      // Rows by where the LAYOUT puts them (offsetTop): a thing still on its
      // way is drawn off its row (its offset), and would count as a row alone.
      for(const el of kids){
        const top=laidTop(el), w=el.getBoundingClientRect().width;
        rows.set(top, (rows.get(top)||0) + w + (rows.has(top) ? gapIn.get(gg) : 0));
      }
      const widest=Math.max(...rows.values());
      if(widest>0) gg.style.maxWidth=Math.ceil(widest)+'px';
      for(const el of kids) if(el.tagName==='BUTTON') el.style.flexGrow='1';
    }
  };
  if(place<=0) return;               // the shelf is not laid out yet — nothing to measure
  // What stands on the shelf beside the field and counts for its room: all
  // but the singles that are not counted.
  const uncounted=new Set(SINGLES.filter(oo=>!oo.counted).map(oo=>oo.id_));
  const children_=()=>{
    const sp=[...where.children].filter(el=>el.offsetParent!==null);
    if(shelf!==where) for(const el of shelf.children){
      if(el===where || !el.offsetParent || uncounted.has(el.id)) continue;
      sp.push(el);
    }
    return sp;
  };
  /* THE FOLD IS COMPUTED, NOT TRIED. Every fold — all groups in n rows —
     is worked out from the DATA measured once for this packing: the objects'
     widths and heights, the gaps, the dividers, the shelf's other objects.
     Nothing is laid out on the page to see what comes of it; the page gets
     the chosen fold once, at the end.
     For n rows a group is as wide as the narrowest split of its objects into
     n rows (its order kept), and as tall as the rows that split fills. All
     the groups side by side with the dividers, and the shelf's other objects
     beside them: that fits the room — one band — or it wraps, and the shelf
     is as tall as the lines it wraps into. */
  const G=clusters.length;
  const fieldCs=getComputedStyle(where);
  const fieldGap=parseFloat(fieldCs.columnGap)||0, fieldRowGap=parseFloat(fieldCs.rowGap)||0;
  const dvd=[...where.querySelectorAll(':scope > .divider')].find(d=>d.offsetParent);
  const dw=dvd ? dvd.getBoundingClientRect().width : 0;
  // The singles of this shelf stand whole while the data is taken: a status
  // left broken in rows by the last layout would make the heights depend on
  // it. They give way again after (squeezeSingles).
  for(const oo of SINGLES){ const el=$('#'+oo.id_); if(el && shelf.contains(el)) el.classList.remove('inColumn','atBottom'); }
  const others = shelf===where ? [] : [...shelf.children].filter(el=>el!==where && el.offsetParent
    && !uncounted.has(el.id) && getComputedStyle(el).position!=='absolute');
  /* A STACKING SINGLE (stacks — the stage block) is part of this decision,
     not a second one after it: it stands as a column when the field, beside
     it standing as a row, takes more than one row. Both its forms are
     measured once here, and every fold is worked out with the form it would
     have — one trigger, one layout, one way for all. */
  const stacker=others.find(el=>SINGLES.some(oo=>oo.id_===el.id && oo.stacks));
  const measureOthers=()=>({w:others.reduce((a,el)=>a+el.getBoundingClientRect().width+gapSize, 0),
                            h:Math.max(0, ...others.map(el=>el.getBoundingClientRect().height))});
  // Measured as it stands unrolled: a sunk block's narrow width and cap
  // (the ribbon's, see sink) are the rolled shelf's, not this decision's.
  const sunk = stacker && {w:stacker.style.width, mh:stacker.style.maxHeight, cls:stacker.classList.contains('sinking')};
  if(sunk){ stacker.style.width=''; stacker.style.maxHeight=''; stacker.classList.remove('sinking'); }
  if(stacker) evenOut();
  const rowForm=measureOthers();
  let colForm=rowForm;
  if(stacker){
    stacker.classList.add('inColumn'); evenOut(); colForm=measureOthers();
    stacker.classList.remove('inColumn'); evenOut();
  }
  if(sunk){ stacker.style.width=sunk.w; stacker.style.maxHeight=sunk.mh; stacker.classList.toggle('sinking', sunk.cls); }
  /* THE DATA OF EVERY LEVEL of shortened labels, measured once for this
     packing: then the fold for ANY room is worked out from it — the fold
     chosen now, and the rooms where the choice would change (the band). */
  const mx_=Math.max(...clusters.map(gg=>gg.childElementCount));
  const depth=squeezeDepth(where);
  const levels=[];
  for(let ss=0; ss<=depth; ss++){
    // Level zero is a level too: labels must be RESTORED, or a button squeezed
    // once would stay "Grid" on a wide screen.
    squeezeLabels(where, ss);
    measure();
    const widthAt=(gg,k)=>{
      const kk=Math.min(k, gg.childElementCount);
      return kk<=1 ? toLine.get(gg) : Math.max(most.get(gg), narrowestSplit(inOrder.get(gg)||[], kk, gapIn.get(gg)));
    };
    const heightAt=(gg,k)=>{
      const ws=inOrder.get(gg)||[], hs=heights.get(gg)||[], cap=widthAt(gg,k)+0.5, gap=gapIn.get(gg);
      let lines=0, w=0, h=0, total=0;
      ws.forEach((x,i)=>{
        if(lines && w+gap+x<=cap){ w+=gap+x; h=Math.max(h, hs[i]); }
        else { if(lines) total+=h+rowGapIn.get(gg); lines++; w=x; h=hs[i]; }
      });
      return total+h;
    };
    // Each number of rows: the groups' widths and heights — the same at any room.
    const folds=[null];
    for(let nn=1; nn<=mx_; nn++){
      const Wg=clusters.map(gg=>widthAt(gg,nn)), Hg=clusters.map(gg=>heightAt(gg,nn));
      folds.push({Wg, Hg, fieldOne:Wg.reduce((a,b)=>a+b,0)+(G-1)*(dw+2*fieldGap)});
    }
    levels.push(folds);
  }
  // A fold (level ss, nn rows) in a room P: its height, whether it keeps one
  // band, and how its groups wrap into lines (the page wraps them so).
  const foldOf=(ss,nn,P)=>{
    const {Wg, Hg, fieldOne}=levels[ss][nn];
    /* The stacking single is a column exactly when the field stands in more
       than one row, and a row when the field is one: a single row of knobs
       beside a tall column is no state (it would stand so for a while and
       then give its height back — a step). */
    const multi = nn>1 && clusters.some(gg=>gg.childElementCount>1);
    if(!stacker){ const f=foldWith(Wg, Hg, fieldOne, P, rowForm); return {ss, nn, hh:f.hh, one:f.one, lines:f.lines, col:false}; }
    if(!multi){
      const f=foldWith(Wg, Hg, fieldOne, P, rowForm);
      if(f.one) return {ss, nn, hh:f.hh, one:true, lines:f.lines, col:false};
      const g=foldWith(Wg, Hg, fieldOne, P, colForm);
      // One row beside the column: not allowed — another fold is taken.
      if(g.one) return {ss, nn, hh:Infinity, one:false, lines:'x', col:true};
      return {ss, nn, hh:g.hh, one:false, lines:g.lines+'c', col:true};
    }
    const f=foldWith(Wg, Hg, fieldOne, P, colForm);
    return {ss, nn, hh:f.hh, one:f.one, lines:f.lines+'c', col:true};
  };
  const foldWith=(Wg, Hg, fieldOne, P, form)=>{
    const otherW=form.w, otherH=form.h;
    const one=fieldOne+otherW<=P+0.5;
    let hh, lines='';
    if(one) hh=Math.max(...Hg, otherH);
    else {
      // The field's own lines over the whole width, the others under it.
      const room = P;
      let fieldH=0, lineH=0, w=0, first=true;
      Wg.forEach((x,i)=>{
        const add = first ? x : dw+2*fieldGap+x;
        if(!first && w+add>room+0.5){ fieldH+=lineH+fieldRowGap; w=x; lineH=Hg[i]; lines+='|'+i; }
        else { w+=add; lineH=Math.max(lineH, Hg[i]); }
        first=false;
      });
      fieldH+=lineH;
      hh = fieldH+(others.length ? gapSize+otherH : 0);
      lines+='u';
    }
    return {hh, one, lines};
  };
  /* ORDER OF CONCESSIONS. First groups fold into rows — all into the same
     number. Only when folding is exhausted do labels get shortened. ONE
     BAND FIRST: the lowest fold that keeps everyone in one band wins, on a
     phone too — there it is every cluster in a column beside the stage
     block. Only when no fold gives one band does the lowest shelf win, and
     only then are labels shortened. */
  const decide=P=>{
    let best=null, fitted=false;
    for(let ss=0; ss<=depth; ss++){
      let lowest=null, lowestOne=null;
      for(let nn=1; nn<=mx_; nn++){
        const tt=foldOf(ss, nn, P);
        if(!lowest || tt.hh<lowest.hh-0.5) lowest=tt;
        if(tt.one && (!lowestOne || tt.hh<lowestOne.hh-0.5)) lowestOne=tt;
      }
      if(lowestOne) fitted=true;
      const here = lowestOne || lowest;
      if(!best || fitted || here.hh<best.hh-0.5) best=here;
      if(fitted) break;
    }
    return best;
  };
  const pads=(parseFloat(st_.paddingTop)||0)+(parseFloat(st_.paddingBottom)||0)+(parseFloat(st_.borderTopWidth)||0);
  const best=decide(place);
  /* DECIDED BEFORE SHOWN: a shelf that rolls (rolls) is asked with the
     height the chosen fold would have. One row — a ROLLED field is one row
     that scrolls: nothing folds, no label is shortened; it is never shown
     tall first. */
  const rolled=!!(best && shelf._rollDecide && shelf._rollDecide(best.hh+pads));
  /* THE BAND: the rooms about this one where the same would be decided —
     the same fold, the same wraps, rolled or not — worked out from the data
     above, nothing laid out. Its edges are the TRIGGERS: a room past one
     lays this field out anew; within it nothing is asked. The window's
     height is a trigger of a rolling shelf too: its band of heights. */
  const keyAt=P=>{
    const b=decide(P);
    if(b && shelf._rollWould && shelf._rollWould(b.hh+pads)) return 'rolled';
    return b ? b.ss+'/'+b.nn+'/'+(b.one ? 'one' : b.lines) : '-';
  };
  const key=keyAt(place), far=Math.max(4096, place*4);
  let lo=place, hi=place;
  if(key==='rolled' && shelf._rollChosen && shelf._rollChosen()){ lo=0; hi=Infinity; }
  else {
    while(lo>=1 && keyAt(lo-1)===key) lo--;
    while(hi<far && keyAt(hi+1)===key) hi++;
  }
  const [hLo, hHi] = best && shelf._rollBand ? shelf._rollBand(best.hh+pads) : [0, Infinity];
  BANDS.set(where, {shelf, lo, hi:hi+1, hLo, hHi});
  if(rolled){
    squeezeLabels(where, 0);
    measure();
    for(const gg of clusters) linesCount.set(gg, 1);
    place_(); squeezeSingles();
    return;
  }
  if(best){
    squeezeLabels(where, best.ss);
    measure();
    for(const gg of clusters) linesCount.set(gg, Math.min(best.nn, gg.childElementCount));
    if(stacker){ stacker.classList.toggle('inColumn', !!best.col); evenOut(); }
    place_();
  }
  shrink();
  /* Groups are laid out — now it is clear whether singles have room. */
  squeezeSingles();
  /* No reverse step (straightening narrow clusters one by one): the shelf
     height is set by the most awkward cluster anyway, and a shared ceiling
     looks even. */
}
/* HOW TO SPLIT THE WINDOWS. The two windows always share the room equally,
   but they can stand side by side or stacked, and the right choice depends
   on the work: a wide strip belongs stacked, otherwise each window gets a
   narrow column.

   Both cases are computed: the scale side by side and the scale stacked.
   The one showing the work larger wins — unless the flip button said
   otherwise. Its word holds only until the automatic choice comes round to it
   by itself (a new size of the window, another work): from then on the
   automatic choice decides again. A new work drops it at once. */
let splitByHand=null;   // null — automatic; true — stacked; false — side by side
function arrangeWindows(){
  const el=$('#stages'); if(!el) return;
  let auto=false;
  const r=el.getBoundingClientRect();
  if(size.w && size.h && r.width && r.height){
    const beside  = Math.min((r.width/2)/size.w, r.height/size.h);
    const asStack= Math.min(r.width/size.w, (r.height/2)/size.h);
    auto=(asStack>beside);
  }
  if(splitByHand===auto) splitByHand=null;
  const stacked = splitByHand===null ? auto : splitByHand;
  el.style.flexDirection = stacked ? 'column' : 'row';
  stitchCaptions(stacked);
}
/* THE FLIP is one trigger: the pictures go out, the windows go to their new
   places — the seam between them to the middle of the room, wherever the
   middle is by then — and the pictures come back in their new windows. */
FLIP.onclick=e=>{ e.stopPropagation();
  // What goes out and comes back: the pictures, and the seam between the
  // windows — it goes with the captions' shelf, which the turn changes.
  const pics=[...document.querySelectorAll('#stages canvas')].filter(c=>c.offsetParent);
  if($('#stages')) pics.push($('#stages'));
  let left=pics.length;
  const turn=()=>{
    smoothly(()=>{
      splitByHand = $('#stages').style.flexDirection!=='column';
      arrangeWindows();
      if(hasImage) fitCanvas();    // at once, not waiting for the size observer
    });
    for(const c of pics) appear(c);
  };
  if(!left) return turn();
  for(const c of pics) vanish(c, ()=>{ if(--left===0) turn(); });
};
/* The captions' bar moves WHOLE — one object, its words and the flip button
   on it: over the windows standing side by side, between them stacked.
   Drawing knows nothing about it — it writes into #ww0 and #ww2 wherever
   they are. The flip button TURNS a quarter to show the arrangement it
   would give. */
function stitchCaptions(stacked){
  const bar=$('#captionsTop'), stages=$('#stages'), top=$('#captionsShelf'); if(!bar || !stages || !top) return;
  const second=$('#xx2') && $('#xx2').closest('.stage');
  // The captions live on the bar (built with their windows, they are moved
  // onto it once).
  for(const id of ['#ww0','#ww2']){ const c=$(id); if(c && c.parentElement!==bar) bar.appendChild(c); }
  if(stacked){ if(bar.parentElement!==stages && second) stages.insertBefore(bar, second); }
  else if(bar.parentElement!==top) top.appendChild(bar);
  turnTo(FLIP, stacked ? 90 : 0);
  arrangeAreas();
}
/* KNOB CLUSTERS ARE THE ENGINE'S TOO, laid out like the header's: cluster by
   cluster, a divider between two neighbouring VISIBLE ones, spare room at the
   end of the shelf where the stage block stands. Tightness is measured over
   the WHOLE footer: the stage block takes room like the clusters, though it
   lies outside the knob field. */
function arrangeClusters(){
  const field=$('#knobsField'); if(!field) return;
  divideGroups(field);
  // The knobs are always packed with the stage block standing as a row; only
  // then does it decide whether to stand as a column (its stacks argument). If
  // the column took part in the packing, the room it frees would undo the
  // very reason it was taken, and the two would swap back and forth.
  const block=$('#stageBlock'); if(block) block.classList.remove('inColumn');
  evenOut();          // its rows as they stand in a row, before the packing
  // Label heights are levelled by alignCaptions from scratch, whenever the
  // labels change: another stage's reserve never weighs in.
  packClusters(field, field.parentNode);
}
/* LABEL HEIGHT is measured, not assigned: in a narrow window a label takes
   three lines. The engine measures the tallest visible label and gives
   everyone the same reserve, so the sliders stay level. */
let captionsFor='';
function alignCaptions(){
  const visibleOnes=[...document.querySelectorAll('#knobsField .knob')]
    .filter(rr=>rr.offsetParent!==null);
  if(!visibleOnes.length) return;
  // What the reserve depends on: which labels, their words, a knob's width,
  // the scale. The same as last time — the labels keep their reserve.
  const key=[gridPixel(), Math.round(visibleOnes[0].getBoundingClientRect().width),
             ...visibleOnes.map(rr=>rr.querySelector('b').textContent)].join('|');
  if(key===captionsFor) return;
  captionsFor=key;
  const line=gridPixel()*10;                // a line is ten grid pixels
  let mx_=line;
  for(const rr of visibleOnes) rr.querySelector('b').style.minHeight='0';
  for(const rr of visibleOnes){ const vv=rr.querySelector('b').scrollHeight; if(vv>mx_) mx_=vv; }
  const reserve=Math.ceil(mx_/line)*line;
  for(const rr of visibleOnes) rr.querySelector('b').style.minHeight=reserve+'px';

/* STAGES ARE DATA, NOT BRANCHES. A stage is a record in this list, and
   everything reads it:
     number, title — "Stage 1 — prepare" in the explanation of where we are;
     brief   — the short name on the stage flipper;
     about   — the stage's explanation;
     result  — the status line;
     auto    — what "Auto settings" does on this stage;
     count_  — recomputing when knobs move.
   Switching stages swaps the record; nothing is rebuilt. */
const STAGES=[
  {number:1, title:'prepare', brief:'st.1',
   about:'You are on the first stage: bringing back the pixels. The grid of the original art is found and the picture is handed back at its native resolution, one grid cell per pixel. The knobs below tune how well the grid fits and how each cell gets its color.',
   result:()=> result ? [`art ${result.nw}×${result.nh}`,`colors ${result.colorsCount}`,`${result.msec} ms`]
                  : (buf ? [`art ${buf.width}×${buf.height}`,'computing…'] : [`${size.w}×${size.h} px`]),
   auto:async ()=>{ touched=false; await applyAdvice(); laterCount(0); },
   count_:()=>{ redraw(); laterCount(); }},

  {number:2, title:'clusters', brief:'st.2',
   about:'You are on the second stage: clusters. Neighboring cells of one paint are gathered together and get one shared color, so the noise inside them averages out. A lone patch on a flat background stays on its own.',
   result:()=> result2 ? [`clusters ${result2.groupsCount}`,`colors ${result2.colorsCount}`,`${result2.msec} ms`] : ['computing…'],
   auto:(record=true)=>autoGroups(record),
   count_:()=>laterGroups()},

  {number:3, title:'merge', brief:'st.3',
   about:'You are on the third stage: merge. Clusters of the same color anywhere in the work are brought into one paint, including pieces that do not touch. The ribbon shows the paints that came out.',
   result:()=> result3 ? [`paints ${result3.paintsCount}`,`${result3.msec} ms`] : ['computing…'],
   auto:(record=true)=>autoPaints(record),
   count_:()=>laterMerge()},

  /* FOUR — painting. No more algorithms: what did not come together is
     finished by hand. The stage has no knobs. */
  {number:4, title:'paint', brief:'st.4',
   about:'You are on the fourth stage: painting by hand. Whatever did not come together on its own is finished here. Brush and fill use the paints of the work; the picker also copies a color from any picture, and it joins the palette once you paint with it. Double-click a paint to change its color.',
   result:()=> [`paints ${paintsOnPicture()}`, `edits ${edits()}`],
   // No auto, no computing: nothing to turn, nothing to count — painting is
   // done by hand. The "Auto settings" button disappears by itself, seeing the
   // stage has no automatic settings.
   count_:()=>{}},
];
const currentStage=()=>STAGES[stage-1];

/* The button names an ACTION, not what is shown now: the caption above the

function nextStep(){
  const ring=showRing();
  const i=ring.indexOf(leftView);
  return ring[(i+1)%ring.length];
}
// The show button's label and availability are computed by the button engine:
// only the name of the next step, which it uses, is left here.
/* ALL OUTPUT IN ONE REFRESH. Buttons, stage label, fine knobs, the step

function refreshView(){ smoothly(refreshViewNow); }
function refreshViewNow(){

  arrangeWindows();

const autoVisited=new Set();
/* quiet — the move is not a step of its own: undo and redo walk the history,

   and acts; Cancel, a click elsewhere or Escape just close it. */
let clickedNow=null, askedAct=null;
addEventListener('click',e=>{

function askFirst(title, text, yes, act){

  // a click outside the window closes it.

    askedAct=act;
    $('#askTitle').textContent=title; $('#askText').textContent=text; $('#askYes').textContent=yes;
    win.hidden=false; evenOut();
    // Against what asked, above it; asked by nothing — in the middle of
    // the window. Its goal either way.

function closeAsk(){ askedAct=null; $('#askWin').hidden=true; }
function setupAsk(){

  $('#askNo').onclick=closeAsk;

/* LEAVING THE PAINTING goes back to stage 3 only when confirmed: there, a

function leavePainting(then){

    'Go back', then);

// A move between stages is one trigger, whatever calls it (a button, a key,
// undo): one consequence, from where everything stood.
function toStage(nn, quiet=false){ return smoothly(()=>toStageNow(nn, quiet)); }
function toStageNow(nn, quiet=false){
  if(!quiet && nn!==stage && hasImage) remember('stage '+nn);

  // source, cluster borders over pixels, paint borders over clusters.
  leftView=String(nn*2);
  showGrid=(leftView==='2');
  // THE FIRST VISIT to a stage in a session starts from its automatic
  // settings, as stage 1 does on opening. Later visits keep what the hand

  const firstAuto = !autoVisited.has(nn) && nn>1 && nn<4 && !quiet && !!STAGES[nn-1].auto

/* THE FINE KNOBS are only their clusters' visibility; the button's look is

function refreshFine(){

    gg.hidden = !(stage===1 && fineVisible);
}

/* STEPS. The whole path from the source to the painted work is laid out by

   Odd — a clean picture, even — a STAGE'S MARKUP over its input: what the

const STEPS={

  '2':{brief:'grid',
       above:()=>`source with grid — cell ${val[STEP_KNOB].toFixed(4)}, origin ${val['origin x'].toFixed(2)} / ${val['origin y'].toFixed(2)}`,
       draw:kk=>{ if(!putSource(kk))return false; drawGrid(kk); return true; }},
  '3':{brief:'pixels', squeezedDown:'px',
       above:()=>`pixels — ${buf?buf.width:0}×${buf?buf.height:0} cells`,
       draw:kk=>drawArt(kk,buf)},
  '4':{brief:'cluster borders', squeezedDown:'cl. borders',
       prepare:()=>{ ensureGroups(); },
       above:()=>`cluster borders over pixels — ${result2?result2.groupsCount:0} clusters`,
       draw:kk=>{ if(!drawArt(kk,buf))return false; drawClusters(kk); return true; }},
  '5':{brief:'clusters', squeezedDown:'clust.',
       prepare:()=>{ ensureGroups(); },
       above:()=>`clusters — ${result2?result2.groupsCount:0}`,
       draw:kk=>drawArt(kk,buf2)},
  '6':{brief:'paint borders',
       prepare:()=>{ ensureGroups(); ensureMerge(); },
       above:()=>`paint borders over clusters — ${result3?result3.paintsCount:0} paints`,
       draw:kk=>{ if(!drawArt(kk,buf2))return false; drawMerged(kk); return true; }},
  '7':{brief:'merged',
       prepare:()=>{ ensureGroups(); ensureMerge(); },
       above:()=>`merged paints — ${result3?result3.paintsCount:0}`,
       draw:kk=>drawArt(kk,buf3)},
  '8':{brief:'painted borders',
       prepare:()=>{ ensureGroups(); ensureMerge(); setupRecolor(); },

/* A digit is a VIEW, not a move: it changes the left window, not the stage,
   so the knobs under the hand stay. A step not yet computed is computed here.
   Zero brings the left window back to the current stage's markup. */
function toStep(nn){
  const st_=STEPS[nn]; if(!st_||!hasImage) return;
  if(!AVAILABLE().includes(nn)) return;    // no looking ahead
  if(st_.prepare) st_.prepare();
  leftView=nn;
  // The grid is visible exactly on its own step — no separate button any more.
  // Line editing cannot be done blind, so it freezes with the grid.
  showGrid=(nn==='2');

addEventListener('keydown',e=>{
  if(e.ctrlKey||e.altKey||e.metaKey) return;
  const vv=e.target;
  if(vv && (vv.tagName==='INPUT'||vv.tagName==='TEXTAREA')) return;  // digits are typed in fields
  // Zero — back to the current stage's markup.
  if(e.key==='0'){ e.preventDefault(); toStep(String(stage*2)); return; }
  if(STEPS[e.key]){ e.preventDefault(); toStep(e.key); return; }
  if(e.key==='Delete' && stage===4){ e.preventDefault(); deletePaint(); refreshButtons(); }
});
/* ===================== hints =====================
   Everything explained goes through ONE hint: a native tooltip has its own
   look and font and reads as a foreign program.
   EXPLANATION ON HOLD. With the mouse — stay on one spot for almost a second
   (leave earlier and it does not appear at all); with a finger — press and
   hold. A short tap only does the job, a long one only explains, and the
   press is not passed through. */
const hint=$('#hint');
let hintsOn=true;
function recallHints(){
  try{ hintsOn = localStorage.getItem('repix.hints')!=='no'; }catch(_){}
}
function saveHints(){
  try{ localStorage.setItem('repix.hints', hintsOn?'yes':'no'); }catch(_){}
}
const WAIT=900;              // mouse: how long to stay
const PRESS=450;             // finger: how long to hold

/* THE ICON IS AN EXPLICIT QUESTION. The hints switch turns off what pops up

   be asked, so icons are "on demand" and the switch does not apply to them. */
function attachHint(el, give, onDemand){
  const name=()=>typeof give==='function'?give():give;
  // Explained even with Hints off: the question mark under the cursor says so.
  el.classList.toggle('alwaysHint', !!onDemand);
  el.addEventListener('pointerenter', ss=>{
    if(ss.pointerType==='touch') return;   // a finger has its own way — press and hold
    const [ii,tt]=name(); showHint(el,ii,tt,onDemand);

  // hint comes and stays (see holdHint). Hovering is hovering.

function gridPixel(){
  return parseFloat(getComputedStyle(document.documentElement)
           .getPropertyValue('--unit'))||2;
}
/* A FLOATING WINDOW IS DRAGGED BY ITS HEADER — and lands on the grid like
   everything else. Buttons in the header stay buttons: one drags by the empty
   space between them. The drag step is the grid pixel. */
function dragFloating(win, knob){
  knob.addEventListener('pointerdown', ss=>{
    if(ss.target.closest('button')) return;
    const unit=gridPixel(), edge=unit*FLOAT_EDGE;
    const rr=win.getBoundingClientRect();
    const dx_=ss.clientX-rr.left, du=ss.clientY-rr.top;

    win._held=true;                  // the hand holds it: it stands where the hand puts it
    win._goal=null;                  // and its goal against what it came to is let go

      let x=Math.round((mm.clientX-dx_)/unit)*unit;
      let y=Math.round((mm.clientY-du)/unit)*unit;
      x=Math.max(edge, Math.min(innerWidth-rr.width-edge, x));
      y=Math.max(edge, Math.min(innerHeight-rr.height-edge, y));
      win.style.left=x+'px'; win.style.top=y+'px';
    };
    const enough=()=>{
      win._held=false;
      knob.removeEventListener('pointermove',drag);
      knob.removeEventListener('pointerup',enough);
      knob.removeEventListener('pointercancel',enough);
    };

    knob.addEventListener('pointerup',enough);
    knob.addEventListener('pointercancel',enough);
    ss.preventDefault();
  });

/* THE WINDOW CHANGED. What is open keeps its goal by itself (see PLACE);

const stuckNow=()=>{ for(const x of stuck) if(!x.isConnected || !x._goal) stuck.delete(x); return [...stuck]; };

  // hang on "reading" forever.

function setupRecolor(){
  if(!buf3||!marks||!groupPaint||!palette||!palette.length) return false;
  const nw=buf3.width, nh=buf3.height, total=nw*nh;
  if(!buf4||buf4.width!==nw||buf4.height!==nh){
    buf4=new OffscreenCanvas(nw,nh); bk4=buf4.getContext('2d');
    bk4.imageSmoothingEnabled=false;
  }
  if(paintsField && paintsField.length===total) return true;   // already painted — do not trample
  paintsField=new Int32Array(total);
  for(let k=0;k<total;k++){
    const gg=marks[k];
    paintsField[k] = (gg<0) ? -1 : groupPaint[gg];
  }
  RECOLOR.back.length=0; RECOLOR.forward.length=0;
  if(chosen<0 || chosen>=paintColors.length/3) chosen=palette[0].nn;
  writeRecolor();
  return true;
}
function writeRecolor(){
  if(!buf4||!paintsField) return;
  const nw=buf4.width, nh=buf4.height, total=nw*nh;
  const frame=new ImageData(nw,nh);
  paintCounts=new Int32Array(paintColors.length/3);
  for(let k=0,o=0;k<total;k++,o+=4){
    const pt=paintsField[k];
    if(pt<0) continue;                       // outside the work — transparent
    paintCounts[pt]++;
    frame.data[o]=paintColors[pt*3]; frame.data[o+1]=paintColors[pt*3+1];
    frame.data[o+2]=paintColors[pt*3+2]; frame.data[o+3]=255;
  }
  bk4.putImageData(frame,0,0);
  litFor=-1; aimFor=-1;
}
/* Which cell is under the cursor: the inverse of how the result is laid on
   screen — between the first and last grid line, in equal shares. */
function cellUnder(hl,clientX,clientY){
  if(!boundsField||!buf4) return -1;
  const dd=canvasBox(hl);
  const {ax,ay,ssx,ssy}=visiblePart();
  const {ggx,ggy}=boundsField;
  const ll=ggx[0], unit=ggx[ggx.length-1], vv=ggy[0], nn=ggy[ggy.length-1];
  const nw=buf4.width, nh=buf4.height;
  const d=density();
  const mx=ax+((clientX-dd.left)*d-ssx)/view.mm, my=ay+((clientY-dd.top)*d-ssy)/view.mm;
  const i=Math.floor((mx-ll)/((unit-ll)/nw)), j=Math.floor((my-vv)/((nn-vv)/nh));
  if(i<0||j<0||i>=nw||j>=nh) return -1;
  return j*nw+i;
}
function put(k){            // one stroke into one cell
  if(chosen<0||paintsField[k]<0||paintsField[k]===chosen) return false;
  strokeK.push(k); strokeB.push(paintsField[k]);
  paintsField[k]=chosen;
  return true;
}
/* THE AREA of a cell: every cell of the same paint reachable from it by
   side steps. A mask over the whole field; the fill and its preview both
   use it. */
function regionOf(k){
  const nw=buf4.width, nh=buf4.height, was_=paintsField[k];
  const region=new Uint8Array(nw*nh), stack=[k];
  region[k]=1;
  while(stack.length){
    const c=stack.pop(), i=c%nw, j=(c-i)/nw;
    for(const s of [i>0?c-1:-1, i+1<nw?c+1:-1, j>0?c-nw:-1, j+1<nh?c+nw:-1])
      if(s>=0 && !region[s] && paintsField[s]===was_){ region[s]=1; stack.push(s); }
  }
  return region;
}
function floodFill(k){
  const was_=paintsField[k];
  if(was_<0||was_===chosen) return false;
  const region=regionOf(k);
  for(let c=0;c<region.length;c++) if(region[c]) put(c);
  return true;
}
function takePaint(k){
  if(paintsField[k]<0) return;
  chosen=paintsField[k];
  markChosen();
  $('#palette').strip.show(chosen);   // taken from the picture: shown in the middle
}
/* What is in hand is marked in place, without rebuilding the strip. */
function markChosen(){
  $('#palette').strip.mark('held', chosen);
  refreshButtons();   // Delete dims and lights up by what is in hand
}
/* A color from the screen — exactly the pixel visible in the window: the
   source, a step on the left, the result on the right. */
/* The color of exactly the pixel visible under the pointer, or null outside
   the work. */
function pixelAt(hl,e){
  const cv=hl.tagName==='CANVAS'?hl:hl.querySelector('canvas'); if(!cv) return null;
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)*cv.width/r.width);
  const y=Math.floor((e.clientY-r.top)*cv.height/r.height);
  const dd=cv.getContext('2d').getImageData(x,y,1,1).data;
  return dd[3]===0 ? null : [dd[0],dd[1],dd[2]];
}
function copyFromScreen(hl,e){
  const px=pixelAt(hl,e);
  if(!px) return;                          // outside the work — nothing to take
  const [rr,gg,bb]=px;
  const own=palette&&palette.find(kk=>paintColors[kk.nn*3]===rr
    &&paintColors[kk.nn*3+1]===gg&&paintColors[kk.nn*3+2]===bb);
  if(own){ copied=null; chosen=own.nn; }
  else   { copied={r:rr,g:gg,b:bb}; chosen=COPIED; }
  showPalette();
}
/* The first stroke with a copied color makes it a paint of the work. */
function adoptCopied(){
  if(chosen!==COPIED||!copied) return;
  const nn=paintColors.length/3;
  const grown=new Uint8Array(paintColors.length+3);
  grown.set(paintColors);
  grown[nn*3]=copied.r; grown[nn*3+1]=copied.g; grown[nn*3+2]=copied.b;
  paintColors=grown;
  palette.push({r:copied.r,g:copied.g,b:copied.b,groupsCount:0,nn});
  strokeAdopted={nn, rgb:[copied.r,copied.g,copied.b]};   // if the stroke is undone, the paint goes too
  chosen=nn; copied=null;
  showPalette();
}
let strokeAdopted=null;
/* A paint's color in one place: both editing and undoing go through here. */
function setPaintRGB(nn, rgb){
  rgb.forEach((v,i)=>paintColors[nn*3+i]=v);
  const kk=palette.find(x=>x.nn===nn);
  if(kk){ kk.r=rgb[0]; kk.g=rgb[1]; kk.b=rgb[2]; }
  const tile=$('#palette').strip.tile(nn);
  if(tile) paintTile(tile, `rgb(${rgb.join(',')})`);
  litFor=-1;
}
/* EDITING A PAINT — double-click it in the strip. The same window as for the
   interface colors, but its target is a paint: its color changes everywhere
   it lies. */
function editPaint(nn, tile){
  const hex=()=>'#'+[0,1,2].map(i=>paintColors[nn*3+i].toString(16).padStart(2,'0')).join('');
  // The color slider moves in dozens of steps — in history it is one edit:
  // however long it is turned, undo returns the color from before opening.
  let recorded=false;
  openColorPicker({
    get:hex,
    set:cc=>{
      const tt=parseInt(cc.slice(1),16);
      const rgb=[(tt>>16)&255,(tt>>8)&255,tt&255];
      if(!recorded){
        RECOLOR.back.push({color:nn, bb:[0,1,2].map(i=>paintColors[nn*3+i])});
        newStep(RECOLOR); recorded=true;
      }
      setPaintRGB(nn, rgb);
      writeRecolor(); redraw(); tell();
    }}, tile);
}
/* DELETING A PAINT. All its cells go to the CLOSEST remaining paint on the
   picture, and that paint goes into the hand; the deleted one stays in the
   strip, empty, until Clean. Closeness is measured in Lab, as the eye sees it, not by RGB
   numbers. It is an ordinary edit: Ctrl+Z brings everything back. */
function toLab(r,g,b){
  const lin=v=>{ v/=255; return v<=0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
  const R=lin(r), G=lin(g), B=lin(b);
  const X=(R*0.4124+G*0.3576+B*0.1805)/0.95047, Y=R*0.2126+G*0.7152+B*0.0722,
        Z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const f=t=>t>0.008856 ? Math.cbrt(t) : 7.787*t+16/116;
  return [116*f(Y)-16, 500*(f(X)-f(Y)), 200*(f(Y)-f(Z))];
}
function canDeletePaint(){
  if(stage!==4||!paintsField||!paintCounts||chosen<0) return false;
  let others=0;
  for(const kk of palette) if(kk.nn!==chosen && paintCounts[kk.nn]>0) others++;
  return paintCounts[chosen]>0 && others>0;
}
function deletePaint(){
  if(!canDeletePaint()) return;
  const nn=chosen;
  const lab=toLab(paintColors[nn*3],paintColors[nn*3+1],paintColors[nn*3+2]);
  let best=-1, bestD=Infinity;
  for(const kk of palette){
    if(kk.nn===nn || !(paintCounts[kk.nn]>0)) continue;
    const q=toLab(paintColors[kk.nn*3],paintColors[kk.nn*3+1],paintColors[kk.nn*3+2]);
    const dd=(q[0]-lab[0])**2+(q[1]-lab[1])**2+(q[2]-lab[2])**2;
    if(dd<bestD){ bestD=dd; best=kk.nn; }
  }
  if(best<0) return;
  startStroke();
  for(let k=0;k<paintsField.length;k++)
    if(paintsField[k]===nn){ strokeK.push(k); strokeB.push(nn); paintsField[k]=best; }
  chosen=best;
  writeRecolor();
  endStroke();
}
/* A NEW PAINT — the plus at the end of the strip. It appears at once with the
   color in hand, goes into the hand, and the color window opens for it. */
function addPaint(){
  if(stage!==4||!paintColors) return;
  const hand = chosen===COPIED&&copied ? [copied.r,copied.g,copied.b]
             : chosen>=0 ? [0,1,2].map(i=>paintColors[chosen*3+i]) : [128,128,128];
  const nn=paintColors.length/3;
  const grown=new Uint8Array(paintColors.length+3);
  grown.set(paintColors); grown.set(hand, nn*3);
  paintColors=grown;
  palette.push({r:hand[0],g:hand[1],b:hand[2],groupsCount:0,nn});
  RECOLOR.back.push({paletteAdd:[{r:hand[0],g:hand[1],b:hand[2],groupsCount:0,nn}]});
  newStep(RECOLOR);
  chosen=nn; copied=null;
  writeRecolor(); showPalette(); refreshButtons(); tell();
  const tile=$('#palette').strip.tile(nn);
  if(tile) editPaint(nn, tile);
}
/* CLEANING — only on the button. Paints lying in no cell of the picture go
   away. The strip does not hide them by itself: a paint covered by accident
   must not vanish from under the hand. */
function unusedPaints(){
  if(stage!==4||!palette||!paintCounts) return [];
  return palette.filter(kk=>!(paintCounts[kk.nn]>0));
}
function cleanPalette(){
  const gone=unusedPaints(); if(!gone.length) return;
  palette=palette.filter(kk=>paintCounts[kk.nn]>0);
  RECOLOR.back.push({paletteClean:gone});
  newStep(RECOLOR);
  if(chosen>=0 && gone.some(kk=>kk.nn===chosen)){
    // The paint in hand went away — its color stays in hand as a copied one.
    copied={r:paintColors[chosen*3], g:paintColors[chosen*3+1], b:paintColors[chosen*3+2]};
    chosen=COPIED;
  }
  showPalette(); refreshButtons(); tell();
}
/* SHOWING AN AREA. Everything that is not this paint is shaded; the paint
   itself stays as it is. The mask is computed once per paint. */
function lightPaint(nn){
  if(litPaint===nn) return;
  litPaint=nn; redraw();
}
function drawLit(kk){
  if(stage!==4||litPaint<0||!paintsField||!buf4||!boundsField) return;
  const nw=buf4.width, nh=buf4.height;
  if(litFor!==litPaint || !litMask || litMask.width!==nw || litMask.height!==nh){
    litMask=new OffscreenCanvas(nw,nh);
    const frame=new ImageData(nw,nh);
    for(let k=0,o=0;k<nw*nh;k++,o+=4)
      if(paintsField[k]!==litPaint){ frame.data[o+3]=150; }
    litMask.getContext('2d').putImageData(frame,0,0);
    litFor=litPaint;
  }
  const {ax,ay,ssx,ssy}=visiblePart();
  const {ggx,ggy}=boundsField;
  const ll=ggx[0], unit=ggx[ggx.length-1], vv=ggy[0], nn=ggy[ggy.length-1];
  kk.imageSmoothingEnabled=false;
  kk.drawImage(litMask,0,0,nw,nh,
              ssx+(ll-ax)*view.mm, ssy+(vv-ay)*view.mm,
              (unit-ll)*view.mm, (nn-vv)*view.mm);
}
/* THE CURSOR IS THE TOOL ITSELF, as in Paint: a pen, a bucket, a pipette.
   Drawn in cells and scaled with the grid pixel like everything else; each
   one's tip is where the action lands.
   Under the cursor the brush shows the cell in the paint in hand, and the
   fill shows the whole area that will change. With no tool the cursor is
   ordinary: the mouse only moves the picture. */
const TOOL_CURSORS={
  // All three are drawn after Paint's: an outline with a white middle, so the
  // cursor stays visible on a dark work.
  // Brush — a dark blue pen nib; the tip is at the bottom left.
  brush:{hx:0,hy:11,ink:{K:'#0a1238',W:'#ffffff'},rows:[
    '........KK..',
    '.......KKKK.',
    '....KKKKKKKK',
    '..KKWWWWKKKK',
    '..KWWWWWWKK.',
    '..KWWKKWWK..',
    '.KWWWKKWWK..',
    '.KWWKWWWWK..',
    '.KWKWWWWK...',
    'KWKWWWKKK...',
    'KKWKKK......',
    'KKK.........']},
  // A Paint 98 style bucket, mirrored: paint pours on the left, the tip is
  // the end of the stream. The handle is see-through; the grid is cropped
  // to the drawing.
  fill:{hx:2,hy:14,ink:{K:'#000000',W:'#ffffff'},rows:[
    '.......KK....',
    '......K..K...',
    '......KK.K...',
    '....KKKWKK...',
    '..KKKWKWWK...',
    '.KKKWWKWWWK..',
    'KKKWWKWKWWWK.',
    'KKWWWWKWWWWWK',
    'KKKKWWWWWWWWK',
    'KKK.KWWWWWWK.',
    'KKK..KWWWWK..',
    'KKK...KWWK...',
    'KKK....KK....',
    '.KK..........',
    '..K..........']},
  // Pipette: a thin outline, diagonals stepping one cell at a time;
  // the tip is at the bottom left.
  pipette:{hx:0,hy:11,ink:{K:'#000000',W:'#ffffff'},rows:[
    '.........K..',
    '......K.KWK.',
    '.....KWKWWWK',
    '......KWWWK.',
    '.....KWKWK..',
    '....KWWWKWK.',
    '...KWWWK.K..',
    '..KWWWK.....',
    '.KWWWK......',
    '.KWWK.......',
    'KWKK........',
    'KK..........']},
};
const cursorCache={};
function toolCursor(name){
  const cc=TOOL_CURSORS[name]; if(!cc) return '';
  const px=Math.max(1,Math.round(gridPixel()));
  const key=name+px;
  if(!cursorCache[key]){
    const c=document.createElement('canvas'); c.width=cc.rows[0].length*px; c.height=cc.rows.length*px;
    const x=c.getContext('2d');
    cc.rows.forEach((row,j)=>[...row].forEach((ch,i)=>{
      if(ch==='.') return;
      x.fillStyle = cc.ink[ch] || '#000000';
      x.fillRect(i*px,j*px,px,px);
    }));
    cursorCache[key]=`url(${c.toDataURL()}) ${cc.hx*px} ${cc.hy*px}, default`;
  }
  return cursorCache[key];
}
let aimK=-1, aimFor=-1, aimMask=null, aimTint=null;
function aimAt(hl,e){
  const k=(stage===4&&tool&&paintsField)?cellUnder(hl,e.clientX,e.clientY):-1;
  hl.style.cursor = (stage===4&&tool) ? toolCursor(tool) : '';
  if(k===aimK) return;
  aimK=k; redraw();
}
function aimOff(){ if(aimK<0) return; aimK=-1; redraw(); }
function inHand(){
  if(chosen===COPIED&&copied) return `rgb(${copied.r},${copied.g},${copied.b})`;
  if(chosen<0||!paintColors) return null;
  return `rgb(${paintColors[chosen*3]},${paintColors[chosen*3+1]},${paintColors[chosen*3+2]})`;
}
function drawAim(kk){
  if(stage!==4||!tool||aimK<0||!paintsField||!buf4||!boundsField) return;
  const nw=buf4.width, nh=buf4.height;
  const {ax,ay,ssx,ssy}=visiblePart();
  const {ggx,ggy}=boundsField;
  const ll=ggx[0], unit=ggx[ggx.length-1], vv=ggy[0], nn=ggy[ggy.length-1];
  const x0=ssx+(ll-ax)*view.mm, y0=ssy+(vv-ay)*view.mm;
  const cw=(unit-ll)*view.mm/nw, ch=(nn-vv)*view.mm/nh;
  const i=aimK%nw, j=(aimK-i)/nw;
  const hand=inHand();
  kk.imageSmoothingEnabled=false;
  if(tool==='fill' && hand && paintsField[aimK]>=0){
    // The area is recomputed only when the cursor moves into ANOTHER area.
    if(aimFor<0 || !aimMask || aimMask.width!==nw || aimMask.height!==nh
       || aimMask.region[aimK]!==1){
      const region=regionOf(aimK);
      aimMask=new OffscreenCanvas(nw,nh); aimMask.region=region;
      const frame=new ImageData(nw,nh);
      for(let c=0,o=0;c<nw*nh;c++,o+=4) if(region[c]){ frame.data[o+3]=255; }
      aimMask.getContext('2d').putImageData(frame,0,0);
      aimFor=aimK; aimTint=null;
    }
    // The mask gives the area's shape, the paint in hand its color; the
    // tinted copy is kept until the area or the paint changes.
    if(!aimTint || aimTint.hand!==hand){
      aimTint=new OffscreenCanvas(nw,nh); aimTint.hand=hand;
      const tt=aimTint.getContext('2d');
      tt.drawImage(aimMask,0,0); tt.globalCompositeOperation='source-in';
      tt.fillStyle=hand; tt.fillRect(0,0,nw,nh);
    }
    kk.globalAlpha=0.7;
    kk.drawImage(aimTint,0,0,nw,nh,x0,y0,cw*nw,ch*nh);
    kk.globalAlpha=1;
  }
  if(tool==='brush' && hand){ kk.fillStyle=hand; kk.fillRect(x0+i*cw, y0+j*ch, cw, ch); }
}
/* SHOWING A PAINT IN THE STRIP. The cursor is on a cell of the picture — its
   paint in the strip looks as if the cursor were on it, and the strip scrolls
   to it. */
let dwellPaint=-1;
function pointPaint(nn){
  const strip=$('#palette').strip;
  if(strip.mark('pointed', nn<0?null:nn)) strip.show(nn);
}
function dwellOn(hl,e){
  if(stage!==4||!paintsField||e.pointerType==='touch') return;
  // Only with the pipette in hand (or Alt, the pipette for a moment): the
  // strip answers "which paint is this" when that is being asked.
  if(!(tool==='pipette' || e.altKey)){ if(dwellPaint>=0) dwellOff(); return; }
  const k=cellUnder(hl,e.clientX,e.clientY);
  const nn=k<0?-1:paintsField[k];
  if(nn===dwellPaint) return;
  dwellPaint=nn; pointPaint(nn);
}
function dwellOff(){ dwellPaint=-1; pointPaint(-1); }
function startStroke(){ strokeK=[]; strokeB=[]; }
function endStroke(){
  if(!strokeK||!strokeK.length){ strokeK=null; strokeB=null; return; }
  RECOLOR.back.push({kk:Int32Array.from(strokeK), bb:Int32Array.from(strokeB),
                    adopted:strokeAdopted});
  strokeAdopted=null;
  newStep(RECOLOR);
  strokeK=null; strokeB=null;
  // Both the status line and the window caption: the edit count is in both.
  showPalette(); refreshButtons(); tell(); redraw();
}
function rollBack(whence,whereTo){
  const ww=whence.pop(); if(!ww) return false;
  const undoing=(whence===RECOLOR.back);
  if(ww.paletteAdd || ww.paletteClean){
    // Adding is undone by removing, cleaning by bringing back, and vice versa.
    const list=ww.paletteAdd||ww.paletteClean;
    const bringBack = ww.paletteClean ? undoing : !undoing;
    if(bringBack){ for(const kk of list) if(!palette.some(x=>x.nn===kk.nn)) palette.push({...kk}); }
    else {
      palette=palette.filter(x=>!list.some(kk=>kk.nn===x.nn));
      if(list.some(kk=>kk.nn===chosen)){
        copied={r:paintColors[chosen*3], g:paintColors[chosen*3+1], b:paintColors[chosen*3+2]};
        chosen=COPIED;
      }
    }
    whereTo.push(ww);
  } else if(ww.color!==undefined){
    // A paint color edit: swap the current color and the remembered one.
    const now=[0,1,2].map(i=>paintColors[ww.color*3+i]);
    setPaintRGB(ww.color, ww.bb);
    whereTo.push({color:ww.color, bb:now});
  } else {
    const was_=new Int32Array(ww.kk.length);
    for(let n=0;n<ww.kk.length;n++){ was_[n]=paintsField[ww.kk[n]]; paintsField[ww.kk[n]]=ww.bb[n]; }
    whereTo.push({kk:ww.kk,bb:was_,adopted:ww.adopted});
    /* A stroke that gave birth to a paint — undo moves it from the palette back
       to copied, redo brings it back. */
    if(ww.adopted){
      const {nn,rgb}=ww.adopted;
      if(undoing){
        palette=palette.filter(x=>x.nn!==nn);
        copied={r:rgb[0],g:rgb[1],b:rgb[2]};
        if(chosen===nn) chosen=COPIED;
      } else {
        if(!palette.some(x=>x.nn===nn)) palette.push({r:rgb[0],g:rgb[1],b:rgb[2],groupsCount:0,nn});
        copied=null;
        if(chosen===COPIED) chosen=nn;
      }
    }
  }
  writeRecolor(); showPalette(); refreshButtons(); redraw(); tell();
  return true;
}
const undoRecolor=()=>rollBack(RECOLOR.back,RECOLOR.forward);
const redoRecolor=()=>rollBack(RECOLOR.forward,RECOLOR.back);

/* A click on the right window. The pipette also lives on Alt with any tool:
   taking a paint is needed all the time. */
/* A STROKE KEEPS THE TOOL IT BEGAN WITH: a drag after the pipette or a fill
   takes and floods nothing more, and letting Alt go mid-drag does not turn it
   into a brush. A copied color becomes a paint with the first cell it lands
   on, wherever the stroke began. */
let strokeTool=null, strokeAt=null;
function recolorTap(hl,e,first){
  if(first) strokeTool = (e.altKey || tool==='pipette') ? 'take' : tool;
  const k=cellUnder(hl,e.clientX,e.clientY);
  if(k<0) return;
  if(strokeTool==='take'){ if(first) takePaint(k); return; }
  if(!first && strokeTool!=='brush') return;
  adoptCopied();
  if(!strokeK) startStroke();
  const changed = (first && strokeTool==='fill') ? floodFill(k) : put(k);
  if(changed){ writeRecolor(); redraw(); }
}
/* A stroke taken back before it is done (it turned into a pinch): its cells
   return to what they were. A stroke that gave birth to a paint is kept. */
function cancelStroke(){
  if(!strokeK){ return; }
  if(strokeAdopted){ endStroke(); return; }
  for(let n=strokeK.length-1;n>=0;n--) paintsField[strokeK[n]]=strokeB[n];
  strokeK=null; strokeB=null;
  writeRecolor(); redraw();
}

/* ===================== COLORS =====================
   A few base colors are chosen — body, accent, markup, canvas, buttons,
   text — and everything else derives from them, so no combination leaves the
   text unreadable. Derived colors keep their DISTANCES in lightness from the
   base, which is what tells raised from pressed.

   Computed in HSL: "the same, but lighter" is one number there. */

const DEFAULT_THEME='98';
const DEFAULT_COLORS=THEMES.find(tt=>tt.name===DEFAULT_THEME).colors;
const THEME_COLORS=['hull','accent','markup','canvas','buttons','text'];
const THEME_FLAGS=['lockButtons','lockText','auto'];
/* THEMES ARE ONE LIST, one record each: its name, its colors in force, and
   `back` — what Reset brings: a built-in theme's factory colors, an own
   theme's previous version (what it had before the last Apply). Own themes
   (`own`) — made with the plus from the colors in force, named "Own 1",
   "Own 2"…, or loaded — stand after the built-in ones, and only they can be
   renamed, deleted and saved to disk. Everything else is the same for all.
   Kept: every own theme, and a built-in one only while it differs from how
   it came (so a new version of the program can bring new factory colors). */
const pickColors=cc=>{ const o={}; for(const kk of THEME_COLORS.concat(THEME_FLAGS)) o[kk]=cc[kk]; return o; };
const sameColors=(a,b)=>THEME_COLORS.concat(THEME_FLAGS).every(kk=>a[kk]===b[kk]);
let themeList=THEMES.map(tt=>({name:tt.name, colors:pickColors(tt.colors), back:pickColors(tt.colors)}));
const allThemes=()=>themeList;
const ownThemes=()=>themeList.filter(tt=>tt.own);
const themeOf=name=>themeList.find(tt=>tt.name===name);
const isOwnTheme=name=>{ const tt=themeOf(name); return !!(tt && tt.own); };
const themeColors=tt=>({...tt.colors, theme:tt.name});
function recallThemes(){
  const good=cc=>cc && /^#[0-9a-f]{6}$/i.test(cc.hull||'') && /^#[0-9a-f]{6}$/i.test(cc.accent||'');
  const fill=cc=>pickColors({...DEFAULT_COLORS, ...cc});
  let kept=null;
  try{ kept=JSON.parse(localStorage.getItem('repix.themeList')||'null'); }catch(_){}
  if(!Array.isArray(kept)){
    // From the earlier records: own themes apart, a built-in's edits apart.
    kept=[];
    try{
      const own=JSON.parse(localStorage.getItem('repix.themes')||'[]');
      if(Array.isArray(own)) for(const tt of own) if(tt) kept.push({name:tt.name, colors:tt.colors, own:true});
      const edits=JSON.parse(localStorage.getItem('repix.themeEdits')||'{}');
      if(edits && typeof edits==='object') for(const name in edits) kept.push({name, colors:edits[name]});
    }catch(_){}
  }
  for(const tt of kept){
    if(!tt || typeof tt.name!=='string' || !good(tt.colors)) continue;
    let name=tt.name;
    const was=themeOf(name);
    if(was && !was.own && !tt.own){ was.colors=fill(tt.colors); continue; }
    // An own theme under a name a built-in one has since taken: the same
    // colors — it has become that theme; others — it stays, with a number.
    if(was && !was.own && sameColors(fill(tt.colors), was.back)) continue;
    if(was) for(let n=2; themeOf(name); n++) name=tt.name.slice(0, THEME_NAME_MAX-String(n).length-1)+' '+n;
    themeList.push({name, colors:fill(tt.colors), back:fill(good(tt.back) ? tt.back : tt.colors), own:true});
  }
}
function saveThemes(){
  const out=themeList.filter(tt=>tt.own || !sameColors(tt.colors, tt.back))
    .map(tt=>tt.own ? {name:tt.name, colors:tt.colors, back:tt.back, own:true} : {name:tt.name, colors:tt.colors});
  try{ localStorage.setItem('repix.themeList', JSON.stringify(out)); }catch(_){}
}
/* FAVORITES — names of themes marked by the heart, and whether the arrows
   flip through them only. Kept apart from the themes: a mark, not a color. */
let favThemes=new Set(), favOnly=false;
function recallFavs(){
  try{
    const tt=JSON.parse(localStorage.getItem('repix.favThemes')||'[]');
    if(Array.isArray(tt)) favThemes=new Set(tt.filter(n=>typeof n==='string' && themeOf(n)));
    favOnly=localStorage.getItem('repix.favOnly')==='1' && favThemes.size>0;
  }catch(_){}
}
function saveFavs(){
  try{
    localStorage.setItem('repix.favThemes', JSON.stringify([...favThemes]));
    localStorage.setItem('repix.favOnly', favOnly ? '1' : '0');
  }catch(_){}
}
/* A new own theme: its previous version is itself. */
function addTheme(name, cc){
  const tt={name, colors:pickColors(cc), back:pickColors(cc), own:true};
  themeList.push(tt); return tt;
}
/* A THEMES FILE is JSON: {"repix":"themes", "version":1, "themes":[{"name":…,
   "colors":{…}}, …]}; a single theme ({"repix":"theme", "name", "colors"}) is
   read too. The names are the file's header: loading offers them. Colors that
   are missing or not colors are taken from the default theme; a theme without
   its body and accent is skipped, and a file with none left is refused. */
function readThemesFile(text){
  try{
    const ff=JSON.parse(text);
    const list = ff && ff.repix==='themes' && Array.isArray(ff.themes) ? ff.themes
               : ff && ff.repix==='theme' ? [ff] : [];
    const good=vv=>/^#[0-9a-f]{6}$/i.test(vv||'');
    const out=[];

/* ===================== GRID PIXEL SIZE =====================
   The grid cannot be fixed at two CSS pixels: on 4K at 100% that is a strip
   at the screen edge, and at fractional densities (125%, 150%) two CSS pixels
   fall on two and a half physical ones and the pixel font smears.

   So it is computed the other way round: first how many PHYSICAL pixels one
   of ours takes, then the CSS value by dividing by the density. Our pixel
   always covers a whole number of real ones.

   How many depends on the window width: smaller on a phone, larger on a big
   screen. */
/* INTERFACE SIZE. The engine picks it by window width and screen density,
   and there is a manual override that survives a restart: physical pixels per
   grid pixel, one of SIZES. SPACING likewise, in cells, one of SPACINGS.
   Zero means "auto". */
const SIZES=[1,2,3,4], SPACINGS=[1,2,3];
let sizeManual=0, spacingManual=0;
function recallSize(){
  try{ const tt=+localStorage.getItem('repix.size');
       if(SIZES.includes(tt)) sizeManual=tt;
       const oo=+localStorage.getItem('repix.spacing');
       if(SPACINGS.includes(oo)) spacingManual=oo; }catch(_){}
}
function saveSize(){
  try{ if(sizeManual) localStorage.setItem('repix.size',sizeManual);
       else localStorage.removeItem('repix.size');
       if(spacingManual) localStorage.setItem('repix.spacing',spacingManual);
       else localStorage.removeItem('repix.spacing'); }catch(_){}
}
function fitGrid(){
  const density=Math.max(1,window.devicePixelRatio||1);
  const ww=innerWidth;                 // in CSS pixels: this is a measure of ROOM
  // About one step per 960 pixels of width: 1920 gets 2, 2880 — 3, 3840 — 4;
  // it changes halfway between them.
  const baseValue = sizeManual || (ww>=3360 ? 4 : ww>=2400 ? 3 : 2);
  // rounded to a whole number of physical pixels and converted back to CSS
  const phys=Math.max(1,Math.round(baseValue*density));
  const unit=phys/density;
  document.documentElement.style.setProperty('--unit',unit+'px');
  /* Spacing by itself: squeezed on a narrow screen, where every cell counts. */
  const spacing = spacingManual || (ww<560 ? 2 : 3);
  document.documentElement.style.setProperty('--density',spacing);

/* The browser window changed. Only what the size observers cannot see is done
   here — the grid pixel (it depends on screen density) and the split of the
   windows; the observers then lay out the sections and fit the canvases. What
   is already open must not end up past the edge. */
/* The density may change with no new size at all (the window dragged to
   another monitor): the screen is asked to tell when its density leaves the
   one of now. */
(function watchDensity(){
  if(!window.matchMedia) return;
  const mq=matchMedia(`(resolution: ${devicePixelRatio}dppx)`);
  const moved=()=>{ mq.removeEventListener('change', moved); fitGrid(); if(hasImage) fitCanvas(); watchDensity(); };
  mq.addEventListener('change', moved);
})();
addEventListener('resize',()=>{

  arrangeWindows();
  repositionOpen();
});

    where.appendChild(buildNode({tag:'button', text:nn+'  '+STEPS[nn].brief, data:{step:nn}, align:'start',
      held:ring.includes(nn), off:!hasImage,

        const became = was_.includes(nn) ? was_.filter(x=>x!==nn) : avail.filter(x=>was_.includes(x)||x===nn);

      ls.setItem('repix.hints', old('подсказки')==='нет'?'no':'yes');
    if(ls.getItem('repix.colors')===null && old('цвета')!==null){

     back to where one was. */
  let asking=null;
  const ask=(title, text, yes, act)=>{
    asking={title, act};
    $('#confirmText').textContent=text; $('#confirmYes').textContent=yes;
    goTo('confirm');
  };
  $('#confirmYes').onclick=e=>{ e.stopPropagation(); asking.act(); };
  $('#confirmNo').onclick=e=>{ e.stopPropagation(); back(); };
  // Deleting cannot be undone, so it asks first.
  $('#themeDelete').onclick=e=>{ e.stopPropagation();
    if(!isOwnTheme(colors.theme)) return;
    const name=colors.theme;
    ask('Delete theme?', `"${name}" will be removed from the list for good. A theme saved to disk can be loaded again.`, 'Delete', ()=>{
      const all=allThemes(), i=all.findIndex(x=>x.name===name);
      themeList=themeList.filter(x=>x.name!==name);
      if(favThemes.delete(name)){ if(!favThemes.size) favOnly=false; saveFavs(); }
      saveThemes(); editFrom=null;
      colors=themeColors(all[i-1]); applyColors(); saveColors(); home(); }); };
  for(const id_ of ['themeFav','themeFavs','themeAdd','themeSave','themeFork','themeLoad','themeRename','themeDelete','themeNameField','saveToDisk','themeApply','themeCancel'])
    attachHint($('#'+id_), HINTS[id_]);
  // The colors: swatches open the picker, locks flip; both explain themselves.
  for(const ck of COLOR_KNOBS){
    const el=$(ck.swatch);
    if(el){ el.onclick=e=>{ e.stopPropagation(); openColorPicker(ck.key, el); };
            attachHint(el, ck.hint); }
    const zz=ck.lock && $(ck.lock); if(!zz) continue;
    zz.onclick=e=>{ e.stopPropagation(); colors[ck.lockKey]=!colors[ck.lockKey];
                   applyColors(); saveColors(); };
    attachHint(zz, ck.lockHint);
    zz.addEventListener('click',hideHint);
  }
  for(const id_ in HINTS.menu){
    const el=$('#'+id_); if(el) attachHint(el, HINTS.menu[id_]);
  }
  const btnP=$('#btnHints');
  if(btnP){
    const markIt=()=>btnP.classList.toggle('held', hintsOn);
    markIt();
    btnP.onclick=e=>{ e.stopPropagation();
      hintsOn=!hintsOn; saveHints(); markIt();
      if(!hintsOn) hideHint(); };
    attachHint(btnP, HINTS.hints, true);
  }
  /* Reset does not mean "factory defaults" but "back to the theme": whoever sits
     on Windows 98 and tweaked it is not thrown into another theme. */
  $('#btnReset').onclick=()=>{
    const tt=themeOf(colors.theme)||themeOf(DEFAULT_THEME);
    colors=themeColors({...tt, colors:tt.back});
    applyColors(); saveColors();
  };
}

/* ===================== saving ===================== */
/* GIVING A FILE — one way for everything the program saves. An iPhone or an
   iPad does not take a download from a page as a computer does (a web app
   installed from the site takes none at all): there the system's share
   sheet is opened, with "Save Image" and "Save to Files" in it. The file is
   made in the very press — a share asked after a wait is no longer the
   hand's and is refused. Elsewhere it is downloaded, and the file is kept
   for a minute: a browser asking "download?" must still find it. Where
   neither works, the picture opens on its own, to be kept by a long press. */
const appleTouch = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function giveFile(bytes, name, type){
  const file=new File([bytes], name, {type});
  if(appleTouch && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{
      if(err && err.name==='AbortError') return;     // closed by the hand: nothing to do
      openFile(file);
    });
    return;
  }
  const url=URL.createObjectURL(file);
  const a=document.createElement('a');
  a.href=url; a.download=name;
  if(appleTouch && !('download' in a)){ window.open(url, '_blank'); }
  else a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
function openFile(file){
  const url=URL.createObjectURL(file);
  window.open(url, '_blank');
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
// A picture's PNG, made at once (no waiting — see giveFile).
function pngBytes(bb){
  const c=document.createElement('canvas'); c.width=bb.width; c.height=bb.height;
  c.getContext('2d').drawImage(bb, 0, 0);
  const b64=c.toDataURL('image/png').split(',')[1], bin=atob(b64), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function save(){
  // Saved is the CURRENT stage's output — what the user sees on the right.
  const [bb]=stageOutput(); if(!bb) return;
  giveFile(pngBytes(bb), `art_${bb.width}x${bb.height}.png`, 'image/png');
}
/* ===================== start ===================== */
placeButtons();   // the engine places, labels and dims by itself
arrangeWindows();  // the captions take their shelf even before a work is open
/* Fine knobs start hidden — as the unpressed button says. */
refreshFine();
/* Layout hangs on EVENTS, not frames: as soon as the sections get a width,
   the observer calls. It also catches everything that changes width later —
   the window, a scrollbar, zoom. */
adoptScrolls(document.body);
relayout(true);
/* THE CANVAS IS MEASURED BY ITS OWN PLACE, and the place changes not only
   with the browser window: on stage 2 there are fewer knobs, the footer is
   lower and the windows get more height. */
if(window.ResizeObserver){
  /* The pictures follow their windows' size at every step, the window
     dragged or not: fitting them is laying the art held in memory out
     anew — about a millisecond — so no edge is ever left cut. */
  const pupil=new ResizeObserver(()=>{ if(hasImage) fitCanvas(); });
  for(const xx of document.querySelectorAll('.canvas')) pupil.observe(xx);
  const eyeIcon=new ResizeObserver(()=>relayout());
  // And the fields themselves: a section may stay full-window width while the
  // room inside it changes.
  for(const rr of [$('header'), $('#knobs'), $('#headerField'), $('#knobsField')])
    if(rr) eyeIcon.observe(rr);
}
// A font changes the width of EVERY label, and the print does not see that.
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{
  // Measures kept from the fallback font are no measures.
  captionsFor='';
  for(const box of document.querySelectorAll('[data-even]')) box._evenFor=null;
  const st=$('#status'); if(st){ st._widths=null; st._decided=null; }
  relayout(true);
});
setupHints();   // hints of what the button engine does not build: the gear plate
setupSettings();
setupAsk();
/* FULL SCREEN IS THE PAGE'S OWN. The browser's (F11) lays its bars over
   the top of the page when the mouse comes near and takes the clicks
   there. The page's own (the Fullscreen API) has no bars at all. So F11,
   heard by the page, turns the page's own full screen on and off; Esc
   leaves it too. A browser that does not let the page have it keeps F11
   as its own. */
addEventListener('keydown', e=>{
  if(e.key!=='F11' || !document.documentElement.requestFullscreen || !document.fullscreenEnabled) return;
  if(!document.fullscreenElement && innerHeight>=screen.height-1 && innerWidth>=screen.width-1) return;   // the browser's own: its key
  e.preventDefault();
  if(e.repeat) return;
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
}, true);
/* OPENED WITH REPIX. The installed app is one of the programs a picture can be
   opened with; the picture comes here once the core is up. */
function takeLaunched(){
  if(!('launchQueue' in window)) return;
  launchQueue.setConsumer(async lp=>{
    if(lp.files && lp.files.length) fromFile(await lp.files[0].getFile());
  });
}
bootCore().then(()=>{ refreshButtons(); takeLaunched(); }).catch(e=>{ say_('coreFailed',e); });
</script>
